{ tag:'Two', title:'Money moved by you',
  cards:[
  {h:'Why it is always you who sends it',
   b:`<p class="lead">In almost every pattern here, the victim makes the payment themselves, deliberately, through their own bank, having been given a reason they found convincing at the time.</p>
      <p>That is not incidental. A payment you authorise defeats fraud detection, is hard to reverse, and is much harder to report — because reporting it means describing a decision you made. The persuasion is not decoration on the theft; it is the whole of the theft.</p>`},
  {h:'The seven money patterns',
   b:`<table class="k">
      <tr><th>A</th><td><b>Investment grooming</b> — returns exist only inside their platform<span class="tell">The small successful withdrawal is bait, not evidence.</span></td></tr>
      <tr><th>B</th><td><b>Romance</b> — a crisis at a permanent distance<span class="tell">Months of asking for nothing is the investment.</span></td></tr>
      <tr><th>C</th><td><b>Advance fee</b> — money must go out before money comes in<span class="tell">Lottery, inheritance, loan approval, job equipment.</span></td></tr>
      <tr><th>D</th><td><b>Recovery</b> — it targets a loss you already suffered<span class="tell">They have the list from the first time.</span></td></tr>
      <tr><th>E</th><td><b>Invoice redirect</b> — late change of bank details, by message<span class="tell">Highest value per incident, and it takes finance teams.</span></td></tr>
      <tr><th>F</th><td><b>Authority</b> — pay now, irreversibly, and tell no one<span class="tell">The isolation instruction is diagnostic on its own.</span></td></tr>
      <tr><th>G</th><td><b>Overpayment</b> — they send too much and want the difference<span class="tell">Their payment reverses; yours does not.</span></td></tr>
      </table>`},
  {h:'The three levers, in every one of them',
   b:`<p><b>Urgency</b> removes the interval in which you would have checked. <b>Isolation</b> removes the person who would have said stop — the bank teller, the shop assistant, your daughter. <b>A reason not to verify</b> is supplied in advance: it is confidential, the line is monitored, there is no time, don’t embarrass yourself.</p>
      <div class="warn"><strong>All three are about your access to other people and to time.</strong> Nothing legitimate requires you to decide alone, immediately, without checking. When you notice those three arriving together, you do not need to know which pattern it is.</div>`},
  {h:'The counter-move is the same every time',
   b:`<p>Stop. Use a route you already had — the number on the card, the contract, the app you installed yourself. Verify from that direction, not the one offered.</p>
      <p>Every genuine version of every specimen in this course survives that. That is what makes it usable: you do not have to identify the pattern correctly, or at all. You only have to change direction.</p>
      <div class="note">This course teaches identification because it makes the reflex quicker and lets you warn other people specifically. But the response never depends on getting the name right.</div>`}
  ],
  drill:{kind:'pick', key:'w2'} },

{ tag:'Three', title:'Credentials and codes',
  cards:[
  {h:'What makes this category different',
   b:`<p class="lead">A payment is a loss of a known size. A credential is a loss of unknown size that continues after the conversation ends — the mailbox that resets every other password, the account that vouches for you to your contacts.</p>
      <p>Three mechanisms, distinguished by what actually leaves your hands.</p>`},
  {h:'Password, code, permission',
   b:`<table class="k">
      <tr><th>A</th><td><b>Credential phishing</b> — a password, on a page reached from their message<span class="tell">The route is the tell, not the quality of the copy.</span></td></tr>
      <tr><th>B</th><td><b>One-time-code interception</b> — a real code, read back to a caller<span class="tell">The code is genuine and arrives on cue, because it is authorising them.</span></td></tr>
      <tr><th>C</th><td><b>App-permission phishing</b> — a real consent screen, granting a real app<span class="tell">Nothing is forged, and it survives a password change.</span></td></tr>
      </table>
      <p>Only the first is defeated by a password manager, and only the first two by changing your password.</p>`},
  {h:'One rule that needs no judgement',
   b:`<p>Under pressure, on the phone, with someone plausible narrating an emergency, you will not reliably assess whether a request is legitimate. So the rule has to be one that requires no assessment.</p>
      <div class="warn"><strong>Nobody ever needs a one-time code read back to them. Not the bank, not the police, not support, not ever.</strong> The code exists to prove you are present at your own device. Speaking it aloud is the only way to lose it.</div>
      <p>Its value is that it holds when your judgement is compromised, which is precisely the condition these calls are built to create.</p>`},
  {h:'Permissions are the modern gap',
   b:`<p>App-permission phishing is hard because nothing about it is fake. The consent screen is served by your real provider, the app is a real app, and the permissions it requests are the ones it says.</p>
      <p>What is false is only the pretext for asking — a shared document, an urgent scan, a productivity tool a colleague supposedly uses. The grant then sits there, unaffected by password resets and unnoticed by anything watching for logins.</p>
      <p>Audit the granted-apps list in your main accounts occasionally, and revoke anything you cannot place. It takes two minutes and almost nobody does it.</p>`}
  ],
  drill:{kind:'pick', key:'w3'} },

{ tag:'Four', title:'Access to your device',
  cards:[
  {h:'One contact into standing access',
   b:`<p class="lead">This category converts a single conversation into a position on your machine — remote-control software installed by you, an attachment run by you, a screen-share you agreed to.</p>
      <p>Consent is the point. Nothing has to be broken into, so nothing raises an alarm.</p>`},
  {h:'Three routes in',
   b:`<table class="k">
      <tr><th>A</th><td><b>Tech-support / fake alert</b> — the warning exists to produce a phone call<span class="tell">Real security software never asks you to telephone anyone.</span></td></tr>
      <tr><th>B</th><td><b>Malicious installer</b> — a file arrives with a covering story<span class="tell">Success looks exactly like nothing happening.</span></td></tr>
      <tr><th>C</th><td><b>Refund scam</b> — a screen-share to fix a payment<span class="tell">Ask for access first; the money is asked for later.</span></td></tr>
      </table>`},
  {h:'The refund scam is worth its own card',
   b:`<p>It is the clearest case of the ask-versus-goal distinction, and one of the most effective patterns operating.</p>
      <p>With remote access and your banking open, the operator moves money between your own accounts — savings to current — so the balance genuinely rises. You are then shown an apparent overpayment, told it will come out of the caller’s wages, and asked to put it right. The remorse is real-sounding and entirely scripted.</p>
      <div class="note"><strong>Nothing on a screen someone else controls is evidence about your money.</strong> End the session and check the balance on a different device, through the app you installed yourself.</div>`},
  {h:'An admin prompt is not the warning sign',
   b:`<p>Installers legitimately ask for elevated rights. The question is never what the prompt says — it is how you came to be standing in front of it.</p>
      <p>You navigated to the vendor yourself and downloaded it: ordinary. A call, a pop-up, a message, or a search advert put you there: the identical prompt, an entirely different situation.</p>
      <p>Search adverts deserve a line of their own. The paid result above the real one is bought by whoever pays, routinely including operators buying their target’s brand name — which is how people reach a scam support line by searching for the real one.</p>`}
  ],
  drill:{kind:'pick', key:'w4'} },

{ tag:'Five', title:'Information, and nothing yet',
  cards:[
  {h:'The stage that feels like safety',
   b:`<p class="lead">Nothing has been asked for. No money, no password, no file. This reads as harmless and is the reason grooming works — people wait for the ask before starting to assess, and by the time it comes they have months of relationship arguing on its behalf.</p>
      <p>An absent ask is a stage. It is the only category here defined by what has not happened yet.</p>`},
  {h:'Two shapes',
   b:`<table class="k">
      <tr><th>A</th><td><b>Identity harvesting</b> — documents before anything real has happened<span class="tell">A selfie holding your passport defeats bank liveness checks.</span></td></tr>
      <tr><th>B</th><td><b>Reconnaissance</b> — warmth from a stranger who reached you by accident<span class="tell">Manufactured coincidence, then patience.</span></td></tr>
      </table>
      <p>The first is the take itself: an identity package is worth money without you ever being contacted again. The second is preparation for an ask that has not arrived.</p>`},
  {h:'Does the data match the reason given?',
   b:`<p>The most portable test in this unit. A delivery firm asking for a full card number to "verify an address" fails it — a card number verifies nothing about an address. An employer asking for a photograph of you holding your passport before a contract exists fails it.</p>
      <p>You do not need to know what the data will be used for. You only need to notice that the stated justification does not require it.</p>
      <div class="note"><strong>Direction of contact carries most of the weight here.</strong> A request inside something you started, verifiable independently, is ordinary. The same words arriving unsought are not.</div>`}
  ],
  drill:{kind:'pick', key:'w5'} },

{ tag:'Six', title:'What people believe instead',
  cards:[
  {h:'The tells that stopped working',
   b:`<p class="lead">Most people are carrying a defence assembled around 2010: bad spelling, odd phrasing, obviously wrong logos, a foreign accent, an implausible story. Every one of those has been cheap to fix for years, and generated text and synthesised voice have finished the job.</p>
      <p>A defence built on surface cues does not merely fail — it actively harms, because a message that passes those checks then feels verified.</p>`},
  {h:'And the beliefs that make it worse',
   b:`<p><b>"It came from their real number."</b> Sender IDs and caller ID are spoofable, and a spoofed SMS lands in the same thread as the genuine ones.</p>
      <p><b>"They knew my details, so it was really them."</b> Breach data is abundant and cheap, and is used early precisely because it feels like proof.</p>
      <p><b>"It would never work on me."</b> The reliable risk factors are being busy, being mid-transaction so the message is expected, and being alone with the decision. Invoice redirect takes finance departments, not the careless.</p>
      <div class="warn"><strong>Confidence is a risk factor, not a defence.</strong> People who are sure it could not happen to them do not verify, and verifying is the entire defence.</div>`}
  ],
  drill:{kind:'err'} },

{ tag:'Seven', title:'Full determination',
  cards:[
  {h:'Running the whole key',
   b:`<p class="lead">Now the categories come without labels. Read the scenario, decide what is being asked for <i>right now</i>, work the two questions under that ask, and name the pattern.</p>
      <p>Four specimens are legitimate. Getting those right matters as much as the rest — a key that flags everything is one you will stop using the first week it makes you insult a real builder.</p>
      <div class="note">Your name and your route are scored separately. Right name from the wrong route counts as a miss, because a pattern you cannot locate is one you will not see in a variant.</div>`}
  ],
  drill:{kind:'det'} }
];

      <ol>
        <li>Read the scenario.</li>
        <li><b>Step 1</b> — what is being asked for <i>at this moment</i>: money, a credential, something onto your device, or information? Classify the current ask, not the eventual goal — a screen-share to arrange a refund is device access, even though the money is what they are after.</li>

  errDrill: SCAM_ERR,
  course: SCAM_COURSE,
  tabs: [
    {key:'course', label:'Course'}, {key:'det', label:'Determination'},
    {key:'w1', label:'Which ask'}, {key:'w2', label:'Money patterns'}, {key:'w3', label:'Credentials'},
    {key:'w4', label:'Device access'}, {key:'w5', label:'Information'},
    {key:'err', label:'Faulty claims'}, {key:'reference', label:'Reference'}
  ],
  caveats:`<ul>
    <li><b>The response does not depend on the name.</b> Stop, and verify through a route you already had — the number on your card, the contract, the app you installed yourself. That single move defeats every specimen in this course, including ones invented after it was written. Identification makes the reflex faster; it is not a prerequisite.</li>
    <li><b>The key cannot authenticate a particular message.</b> It tells you a message has the shape of something that warrants checking. Only verification through an independent channel establishes that a specific request is real.</li>
    <li><b>Legitimate organisations do suspicious-looking things.</b> Banks really do call about fraud, couriers really do text about parcels, and real recruiters ask for right-to-work documents. A pattern match is a reason to verify, not grounds to accuse — and treating it as proof is how people end up abusing a support worker doing their job.</li>
    <li><b>Surface cues are finished as evidence.</b> Spelling, grammar, logos, sender IDs, accents and now voices are all cheap to get right. Anything that can be copied is not a tell, in either direction: polish is not reassurance.</li>
    <li><b>These patterns recombine.</b> Real operations run grooming into investment, or authority into remote access, and hand victims between teams. The key names mechanisms because mechanisms are what recur; the scripts are rewritten constantly.</li>
    <li><b>Knowing you are in one does not mean you can stop.</b> Sunk cost, shame, isolation from anyone who would object, and genuine attachment all keep people in long after doubt begins. Recovery scams exist because that state persists after the money has gone.</li>
    <li><b>Not covered here:</b> extortion and blackmail patterns, employment and rental fraud in depth, charity and disaster fraud, and the whole of card-present and ATM fraud, which are physical rather than social. The four-ask frame still applies; the specific tells do not.</li>
    <li><b>If it has already happened:</b> contact your bank immediately — payment recall is sometimes possible within hours — then report it to your national fraud body, preserve the messages, and change credentials from a device you trust. Do not engage with anyone who approaches you offering to recover the funds, which is Unit Two, pattern D, and is often the same operation returning.</li>
  </ul>`
};

const WEALTH_SPECIMENS = [
  {q:'A £4m portfolio has sat with the same wealth manager for fifteen years: 0.9% to the manager, 0.8% average fund charge, and a platform fee on top. Returns have tracked the benchmark before costs and trailed it after. The proposal is to keep the same allocation and move the core holdings to index funds at 0.07%.',

   sub:{P1:['erosion'],E1:['taxnow'],E2:['whichacct']},outcome:'location',

   why:'Flat, disclosed, and buying work that would otherwise not happen — including the part that is hardest to price, which is being talked out of a decision at the moment it would have done the most damage. A charge is only a leak when nothing arrives in return.',

  {q:'After a lockup expires, a founder’s stake is 68% of her net worth. She sets a schedule selling a fixed number of shares each quarter for three years, executed automatically regardless of price, and accepts the tax as it falls due.',
   sub:{P1:['shock'],S1:['oneasset'],S2:['staged']},outcome:'diversify',
   why:'Concentration is how the wealth was made and is the most common way it is lost, and those two facts are not in tension — they describe different stages. The schedule is mechanical and price-blind on purpose: a discretionary plan to sell "when it recovers" is a timing decision, and it is the decision people reliably fail to make.',

  {q:'An executive cannot sell for two more years under the terms of her award. She buys put options below the current price and sells calls above it, capping her loss and her gain over that window, at a net cost of a little over 1% a year.',
   sub:{P1:['shock'],S1:['oneasset'],S2:['capped']},outcome:'hedge',
   why:'Where selling is restricted or the tax cost is prohibitive, the exposure can be bounded without transferring the asset. It buys survival through a window rather than solving the concentration, and it is not free — the ceiling given up is a real cost, paid whether or not the floor is ever needed.',

   sub:{P1:['timing'],T1:['drawdown'],T2:['yearscash']},outcome:'cashbuffer',
   why:'Two portfolios with identical average returns can end very differently depending on the order the returns arrive, if money is being withdrawn — selling into a fall converts a temporary decline into a permanent reduction in the number of units owned. The reserve exists so that no month’s spending ever depends on that month’s price. It is the single most effective answer to sequence risk.',

   why:'Money needed in months is held in something that cannot fall, and money not needed for decades is invested. The match already holds and no restructuring is called for. Recognising the cases that need no action is part of the discipline — most of the damage in this category is done by investing short-dated money to avoid the feeling of it sitting idle.',

const WEALTH_COURSE = [
{ tag:'One', title:'Keeping is not making',
  cards:[
  {h:'Two different jobs',
   b:`<p class="lead">Almost every large fortune was built by concentration — one business, one holding, one bet, worked at for years. Almost every large fortune that disappears, disappears the same way.</p>
      <p>That is not a contradiction. Building and keeping are different activities with opposite rules, and the mistake that matters is running the wrong one for where you are. Preservation rules applied during accumulation mean you never accumulate; accumulation habits applied to capital you cannot replace are how people end up starting again at fifty-five.</p>
      <p>This course is about the second job only. It assumes the money exists and asks what actually threatens it.</p>
      <div class="note">Throughout, a right label reached by the wrong route counts as a miss. If you cannot say <i>which threat</i> a practice answers, you have memorised a tactic and will apply it to the wrong situation.</div>`},
  {h:'The four threats',
   b:`<table class="k">
      <tr><th>P1</th><td><b>A leak that compounds</b><br>fees, tax paid earlier than required, spending<span class="tell">Never urgent, which is why it runs for thirty years.</span></td></tr>
      <tr><th>P2</th><td><b>A single event that could end it</b><br>concentration, liability, borrowing<span class="tell">Fine every year until the one year it is not.</span></td></tr>
      <tr><th>P3</th><td><b>Being forced to act at the wrong moment</b><br>selling into a fall to fund a bill<span class="tell">Solvent the whole time, and permanently poorer afterwards.</span></td></tr>
      <tr><th>P4</th><td><b>The money outliving the arrangement</b><br>transfer, heirs, control<span class="tell">The market risk was never the problem.</span></td></tr>
      </table>
      <p>Every practice in this course answers exactly one of these. That is how you tell whether you need it.</p>`},
  {h:'Start with the threat, not the product',
   b:`<p>The financial industry is organised around products, so its advice arrives as products: a structure, a wrapper, a policy, a fund. Run backwards from the product and you will always find a reason you need it, because someone was paid to construct one.</p>
      <p>Run forwards from the threat and most of the catalogue disappears. A couple with two pensions and a mortgage has a leak problem and a paperwork problem. They do not have a structure problem, and a trust sold to them solves nothing at an annual cost.</p>
      <div class="warn"><strong>Every category in this course contains an outcome meaning "nothing is needed here."</strong> Four of the twenty-one specimens resolve that way. Recognising them is the part that saves the most money.</div>`},
  {h:'What actually does the work',
   b:`<p>Ranked by how much they matter against how much they cost, the practices that survive at every level of wealth are unglamorous:</p>
      <ul>
        <li><b>Pay less in fees</b> — the only certain return available to anyone.</li>
        <li><b>Define spending as a share of capital</b>, not a habit inherited from a better year.</li>
        <li><b>Keep the basic documents current</b> — will, beneficiary forms, power of attorney.</li>
        <li><b>Hold a spending reserve</b>, so you are never a forced seller.</li>
      </ul>
      <p>None of these require scale, an adviser, or a jurisdiction. Everything else in this course is conditional on size, circumstance and the tax code where you live.</p>`}
  ],
  drill:{kind:'pick', key:'x1'} },

{ tag:'Two', title:'Leaks that compound',
  cards:[
  {h:'The arithmetic that makes this the first unit',
   b:`<p class="lead">A long-run real return of 3–4% is a reasonable planning assumption for a diversified portfolio. Against that, a 1% annual fee is not one percent of anything that matters — it is a quarter to a third of the return, taken every year whether or not the return arrives.</p>
      <p>This is the error the industry depends on: percentages of capital feel small because they are quoted against the capital, while the thing you actually receive is the return. Convert every charge into a share of expected return before judging it.</p>`},
  {h:'The five leaks and their answers',
   b:`<table class="k">
      <tr><th>A</th><td><b>Fees</b> → a low-cost core<span class="tell">A cost avoided is kept in full; outperformance is a hope.</span></td></tr>
      <tr><th>B</th><td><b>Tax on income</b> → asset location<span class="tell">Same portfolio, arranged so the taxed parts sit in the shelter.</span></td></tr>
      <tr><th>C</th><td><b>Tax realised early</b> → deferral<span class="tell">Unrealised gains keep compounding on the untaxed amount.</span></td></tr>
      <tr><th>D</th><td><b>Gains already realised</b> → loss harvesting<span class="tell">Bank the loss, keep the exposure, watch the repurchase rules.</span></td></tr>
      <tr><th>E</th><td><b>Spending</b> → a fixed burn rate<span class="tell">The only leak entirely within your control.</span></td></tr>
      </table>`},
  {h:'Spend a share of capital, not a number',
   b:`<p>A withdrawal fixed in pounds does its worst damage precisely when the portfolio is smallest, because the same sum is a larger share of a fallen balance. Defining the draw as a percentage — reset annually against the actual value — makes spending fall automatically in bad years.</p>
      <p>That automatic fall is the whole mechanism. It is how endowments that intend to exist in perpetuity are run, and it is the difference between a household that adjusts by 8% for one uncomfortable year and one that sells a third of its assets over three.</p>
      <div class="note"><strong>The uncomfortable part is not the arithmetic.</strong> It is that spending must be treated as the output of the portfolio rather than an input to it — which means the lifestyle moves when the capital does.</div>`},
  {h:'Not every cost is a leak',
   b:`<p>A flat fee for work that genuinely would not otherwise happen — the tax filings, the rebalance nobody executes, the estate documents left for eleven years, the conversation that stops a panicked sale — is a cost buying something real.</p>
      <p>What distinguishes it is how the person is paid. A flat fee scales with the work. A percentage of assets scales with the portfolio while the work stays the same, and commission scales with what gets sold to you.</p>
      <div class="warn"><strong>Ask any adviser how they are paid before weighing what they recommend.</strong> It is a short question and it predicts the advice better than anything else you can ask.</div>`}
  ],
  drill:{kind:'pick', key:'x2'} },

{ tag:'Three', title:'The single event',
  cards:[
  {h:'Correlated exposures that look like several things',
   b:`<p class="lead">The classic ruin is not a bad market. It is an employer’s stock, held by two spouses who both work there, pledged as collateral for the mortgage. That reads as three assets and one job. It is one exposure, and a single bad quarter takes all of it at once.</p>
      <p>Before counting holdings, ask what single event would move them together.</p>`},
  {h:'Three failure points, six responses',
   b:`<table class="k">
      <tr><th>A</th><td><b>One holding dominates</b> → sell down on a schedule, cap the downside, or retain it deliberately<span class="tell">Which one depends on whether you control the asset.</span></td></tr>
      <tr><th>B</th><td><b>One event creates a claim on everything</b> → transfer the tail to an insurer, separate the entities<span class="tell">Both, usually. They do different jobs.</span></td></tr>
      <tr><th>C</th><td><b>Borrowing can force the outcome</b> → modest, fixed, not callable<span class="tell">The rate is not the risk. The call is the risk.</span></td></tr>
      </table>`},
  {h:'Diversify mechanically or you will not diversify',
   b:`<p>Everyone holding a concentrated position intends to reduce it — after the next results, above a price, once it recovers. Those are timing decisions, and they are the specific decisions people reliably fail to make, because the position is bound up with how the money was made and often with their own competence.</p>
      <p>So the practice is a fixed schedule, executed regardless of price, with the tax accepted as it falls due. Price-blindness is not a limitation of the method — it is the method.</p>
      <div class="note"><strong>The exception is the business you actively run.</strong> You cannot diversify away an asset you control and work at daily. What makes that defensible is everything around it: diversified non-business assets, a spending reserve held outside the company, and no borrowing secured on the stock.</div>`},
  {h:'Insure the tail, self-insure the rest',
   b:`<p>Insurance is priced so that, on average, you lose money on it. That is not a scandal; it is what paying someone to carry a risk costs. It follows that cover is worth buying only where the loss would be unrecoverable and never where the loss would merely be irritating.</p>
      <p>Most households do the reverse — low deductibles and extended warranties on replaceable objects, and no umbrella liability policy, which costs a few hundred a year and is the one that stops a single accident reaching everything.</p>
      <p>Entity separation does the structural version of the same job. It is also defeated by the same carelessness every time: commingled accounts, personal guarantees, and one insurance policy stretched across everything.</p>`}
  ],
  drill:{kind:'pick', key:'x3'} },

{ tag:'Four', title:'Forced at the wrong moment',
  cards:[
  {h:'Why the order of returns matters',
   b:`<p class="lead">Two portfolios with identical average returns over twenty years can end in very different places, if money is being taken out along the way. Withdraw during a fall and you sell more units to raise the same sum, and those units are permanently gone from the recovery.</p>
      <p>Nothing is wrong with the holdings and nothing is wrong with the average. The damage comes entirely from the requirement to act on a date you did not choose.</p>`},
  {h:'Remove the requirement',
   b:`<table class="k">
      <tr><th>A</th><td><b>Spending during a fall</b> → two to five years of costs in cash and short bonds<span class="tell">So no month’s spending depends on that month’s price.</span></td></tr>
      <tr><th>B</th><td><b>A known bill on a known date</b> → an instrument maturing on that date<span class="tell">No market view required, or taken.</span></td></tr>
      <tr><th>C</th><td><b>Drift, with nothing forcing action</b> → a written rebalancing rule<span class="tell">Decide in advance, when nobody is frightened.</span></td></tr>
      </table>
      <p>And a fourth case worth naming: sometimes the money is already where the liability is, and the correct action is none.</p>`},
  {h:'The reserve is a cost, and that is fine',
   b:`<p>Cash drags in every year that nothing goes wrong, which is most years. People abandon the buffer for exactly this reason, usually after a long calm stretch, and discover its purpose in the year they no longer have it.</p>
      <p>Treat the drag as the premium on an insurance policy against being a forced seller. Judged that way the question is not whether it costs something — it is whether the cover is worth the premium, which for anyone drawing on a portfolio it generally is.</p>
      <div class="warn"><strong>The mirror error is investing money you need soon</strong> to avoid the feeling of it sitting idle. A deposit needed in four months belongs somewhere that cannot fall, whatever the market is doing.</div>`}
  ],
  drill:{kind:'pick', key:'x4'} },

{ tag:'Five', title:'The handover',
  cards:[
  {h:'Where second-generation wealth actually goes',
   b:`<p class="lead">Not usually to markets or to tax. It goes through divorce, through a business run by someone who was never prepared to run it, through a single person with unilateral control making one irreversible decision, and through documents nobody updated.</p>
      <p>None of those are solved by a structure, which is why this unit spends more time on people and paperwork than on tax.</p>`},
  {h:'Five answers, in order of cost',
   b:`<table class="k">
      <tr><th>A</th><td><b>Basic documents current</b> — will, beneficiary forms, power of attorney<span class="tell">An afternoon. The highest return on effort in the course.</span></td></tr>
      <tr><th>B</th><td><b>Lifetime gifting</b> — allowances used every year, starting early<span class="tell">The allowance does not accumulate; a skipped year is gone.</span></td></tr>
      <tr><th>C</th><td><b>Family governance</b> — staged distributions, an outside trustee, prenuptial agreements, heirs in the room<span class="tell">Addresses the failure mode that actually occurs.</span></td></tr>
      <tr><th>D</th><td><b>Trust or holding structure</b> — value moved across while it is small<span class="tell">Timing is the technique. Costs real money to run.</span></td></tr>
      <tr><th>E</th><td><b>Nothing</b> — the estate is simple and current<span class="tell">The correct answer more often than it is given.</span></td></tr>
      </table>`},
  {h:'The beneficiary form beats the will',
   b:`<p>Pensions, life policies and many investment accounts pass by beneficiary nomination, and that nomination generally overrides whatever the will says. A form completed once at the start of a job, never revisited through a divorce and a remarriage, can send the largest single asset to the wrong person entirely.</p>
      <div class="note"><strong>Check every beneficiary nomination you have ever completed.</strong> It costs nothing, takes an hour, and is the most common serious error in this entire course — at every level of wealth, including people with expensive advisers.</div>`},
  {h:'Structure last, and only when it earns its cost',
   b:`<p>Trusts and holding companies are irrevocable in substance, carry annual filing and accountancy costs, and hand control to a trustee. Where the estate is large enough, or a business or a dependant with lifelong needs is involved, they earn all of that comfortably.</p>
      <p>Below that line they are a product, sold early because the sale is profitable and the uselessness takes a decade to become visible. The order of this unit is the order of the work: documents, then gifting, then people, then structure.</p>`}
  ],
  drill:{kind:'pick', key:'x5'} },

{ tag:'Six', title:'What people believe instead',
  cards:[
  {h:'The folklore is expensive in both directions',
   b:`<p class="lead">Money attracts more confident wrong belief than any subject in this app, and it runs in two directions at once. One says the whole thing is a rigged game played offshore, which produces paralysis. The other says a product will fix it, which produces fees.</p>
      <p>Both share a structure: they name no mechanism, so they cannot be checked, and they leave you unable to tell a good arrangement from a bad one.</p>`},
  {h:'Two worth stating plainly',
   b:`<p><b>"Rich people don’t pay tax."</b> Mostly they defer it and locate it, using rules written down and available to anyone with the same assets. Gains never realised are never taxed as income. That is worth understanding precisely, because the understandable version is usable and the folklore version is not.</p>
      <p><b>"You need offshore structures."</b> Below a few million, structures cost more in fees and filing than they save. The practices doing most of the work are free: lower fees, a defined burn rate, current beneficiary forms, a cash buffer.</p>
      <div class="warn"><strong>And one statistic to stop repeating.</strong> "Seventy percent of families lose it in the second generation" traces to a single consulting firm’s survey of its own clients — a self-selected sample, counted by a party selling the solution. The Statistical Claims course has a unit for exactly this.</div>`}
  ],
  drill:{kind:'err'} },

{ tag:'Seven', title:'Full determination',
  cards:[
  {h:'Running the whole key',
   b:`<p class="lead">Now the threats come without labels. Read the situation, decide what is actually threatening the capital, work the two questions under it, and name the practice that answers it.</p>
      <p>Four of the twenty-one specimens resolve to "nothing is needed here." Getting those right matters as much as the rest — a key that always prescribes something is how people end up with a trust, a whole-life policy and a structure they are still paying for in ten years.</p>
      <div class="note">Your name and your route are scored separately. Right practice from the wrong threat counts as a miss, because a practice you cannot trace to a threat is one you will apply where it does nothing.</div>`}
  ],
  drill:{kind:'det'} }
];

const CIVICS_COURSE = [
{ tag:'One', title:'Who decides',
  cards:[
  {h:'One question answers most of them',
   b:`<p class="lead">The naturalisation civics test asks about branches, amendments and dates. Underneath almost every one of those questions is a single practical question: <b>who gets to decide this?</b> Learn to answer that and the list stops being a hundred unrelated facts.</p>
      <p>It is also the most useful thing to know as someone new here. Americans argue constantly about what should be done, and a surprising share of those arguments are really about who is allowed to do it — which is a question with an answer.</p>
      <div class="note">Throughout, a right label reached by the wrong route counts as a miss. If you cannot say <i>which authority</i> decided it, you have memorised an answer rather than understood a system.</div>`},
  {h:'Three branches, and a fourth answer',
   b:`<table class="k">
      <tr><th>N1</th><td><b>Congress</b> — writes the law<span class="tell">Only powers listed in Article I. Naturalisation is one of them.</span></td></tr>
      <tr><th>N2</th><td><b>The President and the agencies</b> — carry it out<span class="tell">May go no further than a statute allows.</span></td></tr>
      <tr><th>N3</th><td><b>The courts</b> — say what it means<span class="tell">Only in a live case brought by someone injured.</span></td></tr>
      <tr><th>N4</th><td><b>The states, or nobody</b> — everything else<span class="tell">The Tenth Amendment, and rights that bind every level.</span></td></tr>
      </table>
      <p>The fourth is the one newcomers underestimate. Most law you will actually meet — driving, marriage, schools, most crime, landlord and tenant — is state law, and it changes when you move.</p>`},
  {h:'Separation of powers, and why it is slow',
   b:`<p>The founders had just fought a war against concentrated authority, and built a system designed to make action difficult rather than efficient. A bill must pass two chambers in identical form and survive a veto that takes two-thirds of both to override. Appointments and treaties need the Senate. Spending needs an appropriation. Courts can void what the other two agree on.</p>
      <p>People often describe this as dysfunction. It is the design, and it is worth understanding before forming a view: a government that cannot act quickly also cannot be captured quickly.</p>
      <div class="warn"><strong>The practical version:</strong> when someone says the government has done something, ask which part. The answer usually tells you how durable it is — a statute outlives an administration, an executive order frequently does not.</div>`},
  {h:'Federalism: two governments over the same ground',
   b:`<p>You live under a state government and a national one at once, each with its own constitution, legislature, courts and police. The federal government holds the powers the Constitution lists; everything else was reserved to the states by the Tenth Amendment.</p>
      <p>Where both have authority, federal law controls any genuine conflict — the Supremacy Clause. Where the federal rule is a floor rather than a ceiling, a state may go further. And where a right is at stake, neither may act.</p>
      <div class="note"><strong>For an immigrant this ordering matters directly.</strong> Immigration and naturalisation are federal, so those rules follow you across state lines unchanged. Licences, benefits, employment rules and schooling are largely state, and do not.</div>`}
  ],
  drill:{kind:'pick', key:'n1'} },

{ tag:'Two', title:'The founding documents',
  cards:[
  {h:'Three documents, three different jobs',
   b:`<p class="lead">They are constantly confused, including by people born here, and the confusion matters because only one of them is law.</p>
      <p>The <b>Declaration of Independence</b> (1776) announced separation from Britain and said why. It created no government and is not enforceable — it is the statement of principle, written mainly by Thomas Jefferson, that people hold unalienable rights and that governments derive their just powers from the consent of the governed.</p>
      <p>The <b>Constitution</b> (written 1787, in force 1789) is the law: it builds the institutions and says what each may do. It opens "We the People" and is the supreme law of the land.</p>
      <p>The <b>Bill of Rights</b> (1791) is the first ten amendments, added because several states would not ratify without written guarantees.</p>`},
  {h:'Eleven years of failure in between',
   b:`<p>Independence in 1776 did not produce the Constitution. The country spent its first years under the Articles of Confederation, which gave the national government no power to tax and no power to regulate trade between the states. It did not work, and the convention of 1787 was called because it was visibly failing.</p>
      <p>That gap explains the document. The taxing power, the commerce power, a single executive and a national judiciary are all answers to specific failures the delegates had just lived through.</p>
      <div class="note">The <b>Federalist Papers</b> — essays by Hamilton, Madison and Jay, published as "Publius" — were written to persuade New York to ratify. They are not law, and are still cited as the best evidence of what the drafters meant.</div>`},
  {h:'Amending it is meant to be hard',
   b:`<p>An amendment needs two-thirds of both houses of Congress to propose and three-quarters of the states to ratify. Thousands have been proposed. <b>Twenty-seven</b> have been adopted, and ten of those arrived together in 1791.</p>
      <p>The difficulty is why so much constitutional change in practice comes through the courts interpreting old text rather than through new text — and why arguments about how judges should read it are a permanent feature of American politics rather than a passing controversy.</p>`},
  {h:'The amendments that changed the country most',
   b:`<table class="k">
      <tr><th>1</th><td><b>First</b> — speech, religion, press, assembly, petition<span class="tell">Five freedoms. Learn the list, not the number.</span></td></tr>
      <tr><th>13</th><td><b>Thirteenth</b> (1865) — abolished slavery</td></tr>
      <tr><th>14</th><td><b>Fourteenth</b> (1868) — citizenship by birth, due process, equal protection, and the rest of the Bill of Rights applied against the states<span class="tell">Arguably the most consequential amendment ever added.</span></td></tr>
      <tr><th>15</th><td><b>Fifteenth</b> (1870) — the vote regardless of race</td></tr>
      <tr><th>19</th><td><b>Nineteenth</b> (1920) — the vote regardless of sex</td></tr>
      <tr><th>26</th><td><b>Twenty-sixth</b> (1971) — the voting age lowered to eighteen</td></tr>
      </table>`}
  ],
  drill:{kind:'pick', key:'n2'} },

{ tag:'Three', title:'How the branches work',
  cards:[
  {h:'Congress: two chambers, built to disagree',
   b:`<p class="lead">The <b>House of Representatives</b> has 435 voting members, apportioned by population, each serving two years. The <b>Senate</b> has 100 — two per state regardless of size — each serving six.</p>
      <p>That difference is the central compromise of 1787: large states got representation by population, small states got equality. It is why a bill must pass two bodies that answer to different constituencies on different clocks, and why so much proposed legislation dies.</p>
      <p>A bill must pass both chambers in identical form before it reaches the President.</p>`},
  {h:'The President: execute, command, negotiate, veto, pardon',
   b:`<p>Four-year term, limited to two terms by the Twenty-second Amendment. The office executes the laws through the agencies, commands the armed forces, conducts relations with other countries, signs or vetoes bills, and pardons federal offences.</p>
      <p>Each has a limit worth memorising: agencies may not exceed their statute, only Congress declares war and funds it, treaties need two-thirds of the Senate, a veto falls to two-thirds of both chambers, and a pardon cannot touch a state conviction.</p>
      <div class="note">The <b>Vice President</b> is President of the Senate, breaks ties there, and is first in the line of succession — followed by the Speaker of the House.</div>`},
  {h:'The courts: nine justices, and one case at a time',
   b:`<p>The Supreme Court has <b>nine</b> justices, a number set by Congress rather than by the Constitution — it has been as low as five and as high as ten. Federal judges are nominated by the President, confirmed by the Senate, and serve during good behaviour, which in practice means for life.</p>
      <p>In <i>Marbury v. Madison</i> (1803) the Court held that it could refuse to apply a statute conflicting with the Constitution. Judicial review is the single most important power in American government that the Constitution never actually mentions.</p>
      <div class="warn"><strong>The limit people forget:</strong> a court needs a live case brought by someone actually injured. It cannot advise, cannot rule on a bill in advance, and cannot strike down a law for being unwise.</div>`},
  {h:'Checks and balances, concretely',
   b:`<ul>
        <li>Congress passes a law — the President can veto it — two-thirds of both chambers can override.</li>
        <li>The President nominates judges and officers — the Senate confirms or refuses.</li>
        <li>The President negotiates treaties — two-thirds of the Senate consents, or they bind nothing.</li>
        <li>The President commands the military — Congress declares war and controls the money.</li>
        <li>Courts may void acts of both — Congress and the states may amend the Constitution over them.</li>
        <li>The House impeaches; the Senate tries and needs two-thirds to remove.</li>
      </ul>
      <p>Memorise two or three of these as pairs rather than as separate facts. Every one of them is a case of one branch holding something another branch needs.</p>`}
  ],
  drill:{kind:'pick', key:'n3'} },

{ tag:'Four', title:'Rights, duties and the oath',
  cards:[
  {h:'Persons, not citizens',
   b:`<p class="lead">The most practically important thing on this list: most constitutional protections apply to <b>persons</b>, not to citizens. Speech, religion, due process, counsel in a criminal case, protection from unreasonable search — all are written as limits on what government may do to anyone present.</p>
      <p>The genuine citizens-only set is small: voting in federal elections, most elected office, and federal jury service. Nearly everything else in the Bill of Rights reaches everyone.</p>
      <div class="warn"><strong>One distinction worth carrying carefully.</strong> Immigration proceedings are civil, not criminal, and several criminal protections — counsel provided at public expense in particular — do not apply there in the same way. This is widely misunderstood and the difference is consequential.</div>`},
  {h:'What the Constitution does not promise',
   b:`<p>It is mostly a list of things government may not do to you, rather than things it must provide. There is no constitutional right to a job, a home, healthcare or an education at the federal level.</p>
      <p>People arriving from countries whose constitutions are written the other way — with guarantees of work, housing or medical care — often misread American political argument badly because of this. Those things are provided, where they are provided, by statute and by the states, which is exactly why they are fought over election by election rather than settled.</p>`},
  {h:'Responsibilities, and the oath',
   b:`<p>The duties conventionally listed: obey the law, pay taxes on income earned here, serve on a jury when summoned, and — for citizens — vote. Men in a defined age range, citizens and many non-citizens alike, must register with the Selective Service.</p>
      <p>Naturalisation ends with the <b>Oath of Allegiance</b>, in which the applicant gives up allegiance to other countries, swears to support and defend the Constitution and the laws, to obey them, and to serve the nation — in the armed forces or in civilian work of national importance — if required.</p>
      <div class="note">Giving up prior allegiance is part of the oath. Whether your country of origin treats that as renouncing its citizenship is a question of <i>that</i> country’s law, and the answer varies a great deal — check it rather than assuming.</div>`},
  {h:'About the test itself',
   b:`<p>The civics test is <b>oral</b>, from a published list of questions you are told in advance, and it comes alongside an English reading, writing and speaking assessment. There are long-standing exemptions and accommodations based on age and years of residence, and for certain medical conditions.</p>
      <div class="note"><strong>Take the question list from uscis.gov, not from here.</strong> How many are asked, how many you need right, and which version of the list applies have all changed more than once, and can depend on when you filed. This course is for understanding the material; the official list is the thing to memorise.</div>
      <p>Several official answers also change with the calendar or your address — the current President and Vice President, the Speaker, the Chief Justice, your own state’s governor, your senators and your representative. Look those up fresh; they are deliberately absent from this course.</p>`}
  ],
  drill:{kind:'pick', key:'n4'} },

{ tag:'Five', title:'The history you are expected to know',
  cards:[
  {h:'Colonies to independence',
   b:`<p class="lead">People came to the colonies for religious freedom, political liberty and economic opportunity, and to escape persecution — and many did not come freely at all, arriving as indentured servants or as enslaved people. Both facts belong in the story.</p>
      <p>The quarrel with Britain was about <b>consent</b>: taxes imposed by a parliament in which the colonists elected nobody. "No taxation without representation" is the compressed version, and the Boston Tea Party of 1773 is its most famous expression.</p>
      <p>The Declaration followed on <b>July 4, 1776</b>. The war ended in 1783; the Constitution was written in <b>1787</b>; the Bill of Rights was ratified in <b>1791</b>. George Washington, the commander of the army, became the first President and is called the Father of Our Country.</p>`},
  {h:'Expansion, and the question it forced',
   b:`<p>The <b>Louisiana Purchase</b> of 1803 roughly doubled the country’s size, and expansion continued west across the century — onto land inhabited by Native nations, who were removed from it by treaty, by purchase and by force. That dispossession is part of the national history and is not seriously disputed.</p>
      <p>Expansion also forced the question the founders had deferred. Each new state raised whether slavery would be permitted there, and every compromise reached — 1820, 1850 — bought time without settling anything.</p>`},
  {h:'Civil War and Reconstruction',
   b:`<p>Eleven states seceded and the war ran from <b>1861 to 1865</b>, killing roughly 600,000 people. Abraham Lincoln was President throughout; the <b>Emancipation Proclamation</b> of 1863 declared enslaved people in the rebelling states free, and the Gettysburg Address of the same year recast the war as a test of whether government of, by and for the people could survive.</p>
      <p>Three amendments followed: the <b>Thirteenth</b> abolished slavery (1865), the <b>Fourteenth</b> made everyone born here a citizen and guaranteed due process and equal protection against the states (1868), and the <b>Fifteenth</b> barred denying the vote on account of race (1870).</p>
      <div class="warn"><strong>On the cause.</strong> The declarations issued by the seceding states name slavery explicitly and at length. "States’ rights" as an explanation leaves out the question it stands in for — a right to do what — which those documents answer directly.</div>`},

      <p>The <b>Cold War</b> that followed — containment of the Soviet Union — organised American foreign policy until about 1991. At home, the <b>civil rights movement</b> dismantled legal segregation: <i>Brown v. Board of Education</i> in 1954, Martin Luther King Jr. and the campaigns of the following decade, the Civil Rights Act of 1964 and the Voting Rights Act of 1965.</p>

  if(subjectStates[subj.id]) return subjectStates[subj.id];

/* ===================== DETERMINATION ENGINE ===================== */
/* A subject's `determination` describes its diagnostic-question flow:
 *   { gateCode: null | 'D1',
 *     steps: [...],                 // always active
 *     stepsByGate: null | {...} }   // per-branch follow-ups
 * Specimens store answers as sub:{ [stepCode]: [acceptableAnswerIds] }.
 */
function detActiveSteps(subject, state){
  const d = subject.determination;
  if(!d.gateCode) return d.steps;
  const gateAns = state.answers[d.gateCode];
  return [...d.steps, ...(gateAns ? (d.stepsByGate[gateAns] || []) : [])];
}
function detCandidates(subject, state){
  let live = subject.outcomes.map(o => o.id);
  detActiveSteps(subject, state).forEach(step => {
    const opt = step.options.find(o => o.id === state.answers[step.code]);
    if(opt && opt.keeps) live = live.filter(id => opt.keeps.includes(id));
  });
  return live;
}
function detReady(subject, state){
  const steps = detActiveSteps(subject, state);
  return steps.length > 0 && steps.every(step => state.answers[step.code]);
}
function nameOptions(subject, state){
  const d = subject.determination;
  if(!d.gateCode) return subject.outcomes;
  return subject.outcomes.filter(o => o.group === state.answers[d.gateCode]);
}
function correctSteps(subject, sp){
  const d = subject.determination;
  if(!d.gateCode) return d.steps;
  const want = sp.sub[d.gateCode];
  return [...d.steps, ...((want && d.stepsByGate[want[0]]) || [])];
}
const outcomeName = (subject, id) => subject.outcomes.find(o => o.id === id).n;

/* Where "resume" actually lands: after a finished unit, the next one. */
function resumePoint(subj){
  const c = st(subj).course;
  if(c.phase === 'unitdone' && c.u < subj.course.length - 1)
    return {ui: c.u + 1, phase: 'read', fresh: true};
  return {ui: c.u, phase: c.phase, fresh: false};
}
function resumeLabel(subj){
  const r = resumePoint(subj), u = subj.course[r.ui], c = st(subj).course;
  if(r.fresh) return 'Start Unit ' + u.tag;
  if(r.phase === 'drill') return 'Resume the drill';
  if(r.phase === 'unitdone') return 'Review Unit ' + u.tag;
  if(c.card === 0 && unitsDone(subj) === 0) return 'Start Unit ' + u.tag;
  return 'Resume the lesson';
}
function resumeSubject(id){
  const s = SUBJECTS.find(x => x.id === id);
  APP.subjectId = id; touch(id);
  const r = resumePoint(s), c = st(s).course;
  if(r.fresh){ c.u = r.ui; c.card = 0; c.phase = 'read'; saveCourse(s); }
  go(r.phase === 'drill' ? 'unitdrill' : (r.phase === 'unitdone' ? 'unitdone' : 'lesson'));
}

function continueCard(s){
  const u = s.course[resumePoint(s).ui];
  const label = resumeLabel(s);
  return `<div class="block"><div class="card" style="--accent:${s.accent}">
    <div class="ch">
      <span class="m a">Continue</span>
      <span class="m" style="letter-spacing:.1em">${unitsDone(s)} / ${s.course.length} units</span>

    <button class="btn sm" data-resume="${s.id}">${label}${icon('arrow')}</button>
  </div></div>`;
}
