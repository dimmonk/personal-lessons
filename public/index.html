<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120F">
<title>Fieldcraft · Pragmatic knowledge</title>
<meta name="description" content="Pragmatic knowledge: learn the questions that decide a call, then drill them on cases that arrive unlabelled.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fieldcraft">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#14120F; --footer:#17140F; --raised:#1A1712; --field:#1D1A15;
  --divider:#241F19; --rule:#2E2820; --border:#3A3226; --disabled:#4A4438;
  --label:#6E6656; --dim:#A89E8D; --bodydim:#C9C1B2; --body:#E4DED2; --text:#F3EEE4;
  --green:#57C48E; --coral:#F0907E; --accent:#DFA83E;
  --sans:'Bricolage Grotesque','Helvetica Neue',Helvetica,sans-serif;
  --serif:Literata,Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark{background:var(--accent);color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.main{flex-grow:1;min-width:0;display:flex;flex-direction:column}
#screen{flex-grow:1;display:flex;flex-direction:column}
.pane{width:100%;max-width:470px;margin:0 auto;padding:0 20px 44px;flex-grow:1;display:flex;flex-direction:column}
#host{display:flex;flex-direction:column;flex-grow:1}
.pane.read{max-width:700px}
.pane.flush{padding-bottom:0}

.rail{display:none}
.tabbar{position:sticky;bottom:0;z-index:5;display:flex;border-top:1px solid var(--rule);background:var(--footer)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:60px;color:var(--label);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button.on{color:var(--text)}
.tabbar span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}

@media(min-width:1000px){
  .app{max-width:1280px;margin:0 auto}
  .rail{display:flex;flex-direction:column;flex:0 0 244px;width:244px;border-right:1px solid var(--divider);
    background:var(--footer);position:sticky;top:0;height:100vh;overflow-y:auto}
  .tabbar{display:none}
  .pane{max-width:680px;padding:0 40px 56px}
  .pane.read{max-width:760px}
}
@media(min-width:1282px){
  .app{border-right:1px solid var(--divider)}
  .rail{border-left:1px solid var(--divider)}
}

/* ---------- rail ---------- */
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 18px 14px}
.rsearch{padding:0 14px 16px}
.rsect{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 18px 8px}
.rlist{display:flex;flex-direction:column;gap:1px;padding:0 8px 16px}
.rrow{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;width:100%;
  color:var(--bodydim);font-size:13.5px;font-weight:500;letter-spacing:-.01em}
.rrow:hover{color:var(--text)}
.rrow.on{background:var(--divider);color:var(--text);font-weight:600}
.rrow .nm{flex-grow:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .ct{font-family:var(--mono);font-size:10px;color:var(--label)}
.dot{flex:0 0 6px;width:6px;height:6px}
.rfoot{margin-top:auto;display:flex;flex-direction:column;border-top:1px solid var(--divider)}
.rfoot button{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;color:var(--dim);font-size:13px}
.rfoot button:hover{color:var(--text)}
.rfoot button.on{color:var(--accent)}

/* ---------- common bits ---------- */
.m{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.m.a{color:var(--accent)}
.m.s{font-size:9.5px;letter-spacing:.09em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:8px 0 0}
.iconbtn{display:flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;color:var(--dim)}
.iconbtn:hover{color:var(--text)}
.back{display:flex;align-items:center;gap:6px;height:44px;padding-right:8px;color:var(--label);
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.back:hover{color:var(--text)}
.spacer{flex:0 0 44px}

.mast{padding:6px 0 20px;display:flex;flex-direction:column;gap:10px}
.mast h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mast p{margin:0;font-size:15px;line-height:1.5;color:var(--dim);max-width:32ch}

.searchfield{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 14px;
  background:var(--field);border:1px solid var(--rule);color:var(--label);font-size:14px;margin-bottom:16px}
.searchfield:hover{border-color:var(--border)}
.searchfield.live{border-color:var(--accent);margin-bottom:0}
.searchfield input{flex-grow:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font:inherit;font-size:15px}
.searchfield input::placeholder{color:var(--label)}
.rsearch .searchfield{height:38px;margin:0;font-size:13px}

.card{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--raised);border:1px solid var(--border)}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .cn{font-size:20px;font-weight:700;letter-spacing:-.02em}
.card .cs{font-size:13px;color:var(--dim)}
.block{padding-bottom:22px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;
  background:var(--accent);color:var(--bg);font-size:15px;font-weight:700;letter-spacing:-.01em}
.btn.neutral{background:var(--text)}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--dim);font-weight:600}
.btn.ghost:hover{border-color:var(--text);color:var(--text)}
.btn[disabled]{background:none;border:1px solid var(--rule);color:var(--disabled);cursor:default}
.btn.sm{height:46px;font-size:14px}
.btn.auto{width:auto;padding:0 22px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{height:0}
.chip{display:flex;align-items:center;flex:0 0 auto;height:44px;padding:0 14px;border:1px solid var(--rule);
  color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.chip:hover{border-color:var(--border);color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 0 8px}
.sect.top{padding-top:26px}
.linkbtn{display:flex;align-items:center;gap:6px;color:var(--dim);font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.linkbtn:hover{color:var(--text)}

.rows{display:flex;flex-direction:column;border-top:1px solid var(--divider)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:13px 0;border-bottom:1px solid var(--divider)}
.row:hover .t{color:var(--accent)}
.row.sm{min-height:60px;padding:12px 0}
.row .grow{display:flex;flex-direction:column;gap:4px;flex-grow:1;min-width:0}
.row .t{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.row.sm .t{font-size:15px}
.row .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--label)}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
.row.done .t{color:var(--dim)}
.row.now{background:var(--raised);padding-left:12px;padding-right:12px;margin:0 -12px;width:calc(100% + 24px)}

.sigil{display:flex;align-items:center;justify-content:center;flex:0 0 34px;width:34px;height:34px;
  border:1px solid var(--accent);font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent)}
.sigil.sm{flex:0 0 22px;width:22px;height:22px;font-size:10px;border-color:var(--border);color:var(--label)}
.sigil.on{border-color:var(--accent);color:var(--accent)}
.sigil.fill{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.pct{font-family:var(--mono);font-size:11px;color:var(--accent)}
.pct.off{color:var(--label)}
.meter{width:46px;height:2px;background:var(--rule)}
.meter i{display:block;height:100%;background:var(--accent)}
.chev{flex:0 0 16px;color:var(--disabled)}

.segs{display:flex;gap:3px}
.segs i{flex:1;height:4px;background:var(--rule)}
.segs i.on{background:var(--accent)}
.segs.thin i{height:2px}

.statrow{display:flex;gap:18px;padding-top:11px;border-top:1px solid var(--rule)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:15px;font-weight:400;color:var(--text)}
.stat span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;width:100%;
  min-height:84px;padding:12px;border:1px solid var(--rule)}
.tile:hover{border-color:var(--border)}
.tile.un{border-style:dashed}
.tile .tt{font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.tile.un .tt{color:var(--dim)}
.tile .tf{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.tile .tf b{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--label)}
.tile .tf b.ok{color:var(--green)}
.tile .tf b.part{color:var(--accent)}

/* ---------- reading ---------- */
.lesson{font-family:var(--serif);font-size:17.5px;line-height:1.62;color:var(--body)}
.lesson p{margin:0 0 16px;text-wrap:pretty}
.lesson .lead{font-size:19px;color:var(--text)}
.lesson h3{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:-.02em;
  color:var(--text);margin:26px 0 10px;line-height:1.15}
.lesson ul,.lesson ol{margin:0 0 16px;padding-left:20px}
.lesson li{margin-bottom:8px}
.lesson b,.lesson strong,.lesson i{color:var(--text)}
.lesson>*:last-child{margin-bottom:0}
.tell{display:block;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--accent);
  margin-top:10px;text-transform:none;letter-spacing:.01em}
.note,.warn{padding:15px 16px;margin:18px 0;font-size:15.5px;line-height:1.55}
.note{background:var(--raised);border-top:2px solid var(--accent);color:var(--bodydim)}
.warn{background:#1F1512;border-top:2px solid var(--coral);color:#D6C9C0}
.warn strong{color:var(--coral)}
table.k{width:100%;border-collapse:collapse;margin:16px 0;font-family:var(--sans);font-size:14.5px;line-height:1.45}
table.k th,table.k td{border:1px solid var(--rule);padding:9px 10px;text-align:left;vertical-align:top;color:var(--bodydim)}
table.k th{background:var(--raised);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--label);white-space:nowrap;width:1%}
table.k td b{color:var(--text)}

.eyebrow-row{display:flex;flex-direction:column;gap:16px;padding:26px 0 30px}
.eyebrow-row h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
@media(min-width:1000px){.eyebrow-row h1{font-size:36px}}

.passage{margin:0 0 20px;padding:16px;background:var(--raised);font-family:var(--serif);
  font-size:17px;line-height:1.58;color:var(--body)}
.passage.plain{font-family:var(--mono);font-size:26px;letter-spacing:.06em;text-align:center;padding:26px 16px}

.hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--disabled);text-align:center;margin:0}

/* ---------- determination ---------- */
.readout{display:flex;flex-direction:column;gap:10px;padding:0 0 24px}
.readhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cands{display:flex;flex-wrap:wrap;gap:5px 10px;margin:0;padding:0;list-style:none}
.cand{font-family:var(--mono);font-size:10.5px;color:var(--accent);transition:color .25s ease}
.cand.out{color:#3E382E;text-decoration:line-through}

.steps{display:flex;flex-direction:column;gap:2px}
.stepdone{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;background:var(--raised)}
.stepdone .grow{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.stepdone .v{font-size:15px;font-weight:600}
.stepopen{display:flex;flex-direction:column;gap:12px;padding:16px 14px;background:var(--raised);border:1px solid var(--accent)}
.stephead{display:flex;align-items:center;gap:12px}
.steplock{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px dashed var(--rule)}
.steplock .grow{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.steplock .v{font-size:15px;font-weight:500;color:var(--disabled)}
.tick{display:flex;align-items:center;justify-content:center;flex:0 0 20px;width:20px;height:20px;background:var(--accent);color:var(--bg)}
.num{display:flex;align-items:center;justify-content:center;flex:0 0 20px;width:20px;height:20px;font-family:var(--mono);font-size:10px}
.num.on{background:var(--accent);color:var(--bg);font-weight:600}
.num.off{border:1px solid var(--border);color:var(--disabled)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;flex-direction:column;justify-content:center;width:100%;min-height:48px;padding:10px 14px;
  border:1px solid var(--border);color:var(--body);font-size:14.5px;line-height:1.3}
.opt:hover{border-color:var(--text);color:var(--text)}
.opt.sel{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.sel){opacity:.42}
.opt[disabled]:hover{border-color:var(--border);color:var(--body)}
.opt.sel[disabled]:hover{color:var(--bg)}
.opt small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;opacity:.62;margin-top:3px;font-weight:400}

.marks{display:flex;gap:8px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--green);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.mark.no{border-color:var(--coral);color:var(--coral)}
.vblock{display:flex;flex-direction:column;gap:9px}
.vblock p{margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--body);text-wrap:pretty}
.vblock.soft p{color:var(--bodydim)}

.score{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:20px;padding-top:12px;border-top:1px solid var(--divider)}

/* ---------- action bar ---------- */
.actbar{position:sticky;bottom:0;z-index:4;display:flex;flex-direction:column;gap:12px;
  margin:24px -20px 0;margin-top:auto;padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--divider);background:var(--footer)}
.actrow{display:flex;gap:10px}
.actrow .btn.ghost{width:92px;flex:0 0 92px}
@media(min-width:1000px){.actbar{margin:24px -40px 0;margin-top:auto;padding:18px 40px 24px}}

/* ---------- reference ---------- */
.fg{border-bottom:1px solid var(--divider)}
.fg summary{display:flex;align-items:center;gap:12px;min-height:54px;cursor:pointer;
  font-size:15px;font-weight:500;list-style:none}
.fg summary::-webkit-details-marker{display:none}
.fg summary::marker{content:''}
.fg[open] summary{color:var(--accent)}
.fg summary .ar{margin-left:auto;color:var(--disabled);transition:transform .2s ease}
.fg[open] summary .ar{transform:rotate(90deg);color:var(--accent)}
.fg-body{padding:4px 0 22px}

/* ---------- search results ---------- */
.resgroup{display:flex;flex-direction:column;gap:4px;padding:0 0 20px}
.res{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:58px;padding:9px 12px;margin:0 -12px}
.res:hover{background:var(--raised)}
.res .grow{display:flex;flex-direction:column;gap:3px;flex-grow:1;min-width:0}
.res .t{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.res .t.q{font-family:var(--serif);font-size:14px;font-weight:400;line-height:1.45;color:var(--body)}
.res .s{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--label)}
.tag{flex:0 0 auto;padding:3px 5px;border:1px solid var(--accent);font-family:var(--mono);
  font-size:9px;letter-spacing:.06em;color:var(--accent);margin-top:2px}
.empty{padding:40px 0;text-align:center;color:var(--label);font-size:14px}

/* ---------- lesson aside (wide) ---------- */
.withaside{display:flex;flex-grow:1;min-width:0}
.aside{display:none}
@media(min-width:1280px){
  .aside{display:flex;flex-direction:column;gap:6px;flex:0 0 280px;width:280px;
    border-right:1px solid var(--divider);padding:24px 20px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .aside .ahead{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--divider);margin-bottom:12px}
  .aside .ahead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .acard{display:flex;gap:10px;width:100%;padding:7px 0;font-size:12.5px;line-height:1.35;color:var(--label)}
  .acard.on{color:var(--accent)}
  .acard:hover{color:var(--text)}
  .acard i{font-family:var(--mono);font-style:normal;font-size:10px;flex:0 0 14px}
}
.done-screen{display:flex;flex-direction:column;align-items:center;gap:18px;padding:60px 0 40px;text-align:center}
.done-screen h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.done-screen p{margin:0;color:var(--dim);font-size:15px;line-height:1.5;max-width:36ch}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <div id="screen"></div>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>

<script>
/* ===================== HELPERS ===================== */

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const screenEl = () => document.getElementById('screen');
const pad2 = n => String(n).padStart(2,'0');

function storageSave(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){} }
function storageLoad(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return Object.assign(fallback, JSON.parse(raw));
  }catch(e){}
  return fallback;
}

const SVG = (d, w) => `<svg width="${w||16}" height="${w||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  chevron: '<path d="M9 6l6 6-6 6"/>',
  back:    '<path d="M15 6l-6 6 6 6"/>',
  caret:   '<path d="M6 9l6 6 6-6"/>',
  arrow:   '<path d="M4 12h15M13 6l6 6-6 6"/>',
  check:   '<path d="M5 13l4 4L19 7"/>',
  cross:   '<path d="M6 6l12 12M18 6L6 18"/>',
  search:  '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  lock:    '<rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  library: '<path d="M4 5h7v14H4zM13 5h7v14h-7z"/>',
  target:  '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',

{ tag:'One', title:'The five questions',
  cards:[
  {h:'Classify by content, never by method',
   b:`<p class="lead">Most misidentification happens because people classify by how a movement <i>behaves</i> rather than what it <i>claims</i>.</p>
      <p>Rallies, censorship, secret police, purges and personality cults appear across regimes with completely opposite beliefs. They travel freely. They tell you almost nothing about ideology.</p>
      <p>What does not travel is the answer to a small set of questions about ownership, allegiance and purpose. Those are the key characters. This course teaches five of them, then drills them.</p>
      <div class="note">Throughout, a right label reached by the wrong route counts as a miss. If you cannot say <i>which question</i> decided it, you have recognised a style, not identified an ideology.</div>`},
  {h:'The five key characters',
   b:`<table class="k">
      <tr><th>Q1</th><td><b>Who owns the means of production?</b><br>private / state / worker-collective / private-but-state-directed<span class="tell">Separates economic left from right, and socialism from fascism.</span></td></tr>
      <tr><th>Q2</th><td><b>What is the primary unit of analysis?</b><br>class / nation / race or identity / individual / tradition &amp; faith / people vs elite<span class="tell">The fastest single discriminator.</span></td></tr>
      <tr><th>Q3</th><td><b>What is the engine of history?</b><br>material conflict / national decline &amp; rebirth / racial struggle / expanding liberty / divine order / people vs elite</td></tr>
      <tr><th>Q4</th><td><b>Attitude to liberal democracy?</b><br>fulfil &amp; expand / transcend / abolish / defend or restore<span class="tell">Separates democratic socialists from Leninists, conservatives from fascists.</span></td></tr>
      <tr><th>Q5</th><td><b>Desired end state?</b><br>classless stateless society / regenerated nation / racial hierarchy / pluralist competition / restored order / open-ended</td></tr>
      </table>
      <p>Q1 and Q2 do most of the work. The other three usually confirm rather than decide.</p>`},
  {h:'Q2 routes you to a family',
   b:`<p>Answer Q2 and you have already eliminated most of the field:</p>
      <ul>
        <li><b>Class</b> → the Marxist and socialist family</li>
        <li><b>Nation</b> → fascism, national populism, reactionary conservatism</li>
        <li><b>Individual</b> → the liberal family</li>
        <li><b>Tradition &amp; faith</b> → reactionary conservatism</li>

      <p>Then Q1 narrows what survives. In practice two questions are often enough to get to one answer, and you will see that happen in the final unit.</p>`},
  {h:'The valence trap',
   b:`<p>Q2 asks <i>which</i> unit. For race and identity you must also ask <i>in which direction</i> — because the same noun points to opposite families.</p>
      <table class="k">
        <tr><th>Valence</th><th>The claim</th><th>Family</th></tr>
        <tr><td>Hierarchical</td><td>The group has an inherent nature and a rightful rank. Hierarchy is natural and must be preserved.</td><td>Nazism, racialist fascism</td></tr>
        <tr><td>Egalitarian</td><td>The group is a category of disadvantage produced by institutions. Hierarchy is unjust and must be dismantled.</td><td>Identity-egalitarianism</td></tr>
      </table>
      <div class="warn"><strong>Both organise politics around race. They are opposites.</strong> Stopping at "this text sorts people by racial category" and jumping to fascism is the single most likely error this key produces — and it fails in both directions, since the mirror mistake is treating a racial-hierarchy claim as merely conservative.</div>
      <p>Run the valence check every time before assigning a family.</p>`}

{ tag:'Two', title:'The socialist family',
  cards:[
  {h:'Ownership, not taxation',
   b:`<p class="lead">Socialism is social ownership or democratic control of the means of production.</p>
      <p>Ownership. Not taxation, not regulation, not spending. If productive assets stay privately owned and the state only taxes and redistributes, that is a welfare state.</p>
      <div class="warn"><strong>The most common error in English-language politics.</strong> "Government does a thing" is not socialism. Public roads, central banks, militaries and food inspection exist in every capitalist state on earth. Always ask Q1: did ownership of productive assets actually change hands?</div>
      <p>The word covers at least four incompatible things. The next cards separate them.</p>`},
  {h:'Marxism and Marxism–Leninism',
   b:`<h3>Marxism</h3>
      <p>An analytical framework more than a programme.</p>
      <ul><li>Historical materialism: economic relations drive history</li>
      <li>Class conflict between owners of capital and sellers of labour</li>
      <li>Surplus value: profit is unpaid labour, extracted as a matter of system rather than malice</li>
      <li>End state: classless, stateless, moneyless</li></ul>
      <span class="tell">Tell: modes of production, class, material conditions, contradictions.</span>
      <h3>Marxism–Leninism</h3>
      <p>Marxism plus a theory of how to seize and hold power: a vanguard party of professionals, democratic centralism, the dictatorship of the proletariat as a transitional stage, a one-party state.</p>
      <span class="tell">Tell: the party, not the class, is the acting subject of history.</span>`},
  {h:'Democratic socialism vs social democracy',
   b:`<p>These two get conflated constantly, and the difference is exactly Q1.</p>
      <h3>Democratic socialism</h3>
      <p>Genuinely wants social ownership of major productive assets — utilities, rail, banks — but pursues it through elections and inside democratic institutions. Rejects vanguardism and revolutionary seizure.</p>
      <h3>Social democracy</h3>
      <p>Not socialism under the ownership definition. Accepts private ownership and markets; constrains capitalism through the welfare state, labour rights, progressive taxation and regulation. Historically it grew out of socialism and then abandoned the ownership demand.</p>
      <span class="tell">Tell: redistribution, floors and rights — never who owns the factory.</span>
      <div class="note">Whether social democracy still "counts as" socialism is a live dispute, not a settled fact. It depends on whether you define socialism by ownership or by egalitarian outcome. This course uses ownership because it discriminates better.</div>`},
  {h:'Anarchism and market socialism',
   b:`<h3>Anarchism / libertarian socialism / syndicalism</h3>
      <p>Socialist economics, but the state is an enemy too. Ownership goes to workers' councils, communes or unions — never to a central state.</p>
      <span class="tell">Tell: anti-capitalist and anti-statist at the same time. No other family holds both.</span>
      <h3>Market socialism</h3>
      <p>Worker-owned or socially-owned firms competing in real markets at real prices. Coherent in theory, rare in durable practice — but it matters for classification, because it is the answer whenever someone accepts markets while moving ownership.</p>`}
  ],
  drill:{kind:'pick', key:'soc'} },

{ tag:'Three', title:'Fascism',
  cards:[
  {h:'A definition with actual content',
   b:`<p class="lead">A mass, anti-liberal, anti-Marxist movement organised around a myth of national decline and rebirth, pursuing regeneration through unity, discipline and often violence, led by a leader who embodies the popular will, in which the individual exists to serve the organic nation.</p>
      <p>This is the most abused word on the list. Used loosely it means "authoritarian and unpleasant," which makes it useless. Used precisely it picks out a specific thing.</p>
      <div class="note">Fascism's definition is genuinely contested among historians. Paxton emphasises process and stages, Griffin the rebirth myth, Eco a family-resemblance list; some restrict the term largely to interwar Europe. Treat what follows as a family resemblance, not a checklist requiring every item.</div>`},
  {h:'The ten markers — look for the cluster',
   b:`<ul>
      <li><b>Palingenetic ultranationalism</b> — the nation is decadent and will be reborn. The ideological core.</li>
      <li><b>Mythic past</b> — a lost golden age, usually historically fictional.</li>
      <li><b>Nation as organism</b> — a body with one will; the individual is a cell.</li>
      <li><b>Enemies both weak and strong</b> — contemptible yet about to overwhelm you.</li>
      <li><b>Cult of action and violence</b> — struggle purifies; deliberation is weakness.</li>
      <li><b>Leader principle</b> — the leader intuits the true will; parliaments are theatre.</li>
      <li><b>Mass mobilisation</b> — uniforms, rallies, paramilitaries, youth wings.</li>
      <li><b>Anti-liberal <i>and</i> anti-Marxist</b> — class struggle denounced as foreign and divisive, replaced by national unity. Critical.</li>
      <li><b>Corporatism</b> — private ownership retained under state-directed bodies; independent unions abolished.</li>
      <li><b>Militarism</b> — expansion as proof of vitality.</li>
      </ul>
      <p>No single item is decisive. The cluster is.</p>`},
  {h:'Three things fascism is not',
   b:`<h3>Not Nazism, exactly</h3>
      <p>Nazism is the variant where biological race, not the nation-state, is the primary unit, with antisemitism as cosmology and extermination as policy. All Nazism is fascist; not all fascism is Nazi.</p>
      <h3>Not ordinary authoritarianism</h3>
      <p>A junta or personalist dictator who wants power and quiet is authoritarian. Fascism demands <i>active participation</i>. Authoritarianism demands passivity. This is why the marker drill matters: repression is shared, mobilisation is not.</p>
      <h3>Not reactionary conservatism</h3>
      <p>The reactionary wants to <i>restore</i> throne, altar and hierarchy. The fascist wants to <i>create something new</i> through national rebirth, and will smash traditional elites to do it. Fascism is revolutionary in method however traditionalist its aesthetics.</p>`},
  {h:'"But the Nazis were socialists"',
   b:`<p>Resolve it with Q1 and Q2, not the party name.</p>
      <p><b>Q1 — ownership.</b> It stayed private. The regime privatised major state holdings in the 1930s, banned independent trade unions, destroyed the workers' parties, and directed private industry through contracts and controls. That is state-directed capitalism, not social ownership.</p>
      <p><b>Q2 — primary unit.</b> Race, constructed in explicit opposition to class. Marxism was the movement's declared mortal enemy.</p>
      <p>The name was a recruitment device aimed at working-class voters.</p>
      <div class="note">Party names are marketing. This is the same reason "Democratic People's Republic" tells you nothing about a state. Always check the answers, never the label.</div>`}
  ],
  drill:{kind:'pick', key:'fasc'} },

{ tag:'Four', title:'Look-alikes',
  cards:[
  {h:'Terms that are not ideologies',
   b:`<p>Several words in common use describe a <i>method</i>, a <i>degree</i>, or a <i>fragment</i> rather than a belief system. Mistaking them for ideologies causes most bad classification.</p>

      <tr><td>Authoritarianism</td><td>A method of rule. Compatible with almost any ideology.</td></tr>
      <tr><td>Totalitarianism</td><td>Ambition to penetrate all of life. A degree of control, not a content.</td></tr>
      <tr><td>Populism</td><td>A thin ideology: pure people vs corrupt elite. Attaches to hosts on left and right.</td></tr>
      <tr><td>Corporatism</td><td>Economy organised into state-recognised blocs of labour and capital. Not "rule by corporations."</td></tr>
      <tr><td>Nationalism</td><td>Prioritisation of the nation. Necessary but far from sufficient for fascism.</td></tr>
      <tr><td>Statism</td><td>A large, active state. A dial, not a doctrine.</td></tr>
      <tr><td>Technocracy</td><td>Rule by credentialed expertise rather than mandate.</td></tr>

  {h:'The horseshoe error',
   b:`<p>Leninism and fascism look alike because they share methods: one-party rule, leader cult, secret police, mobilised masses, mass violence.</p>
      <p>They give <b>opposite</b> answers on both decisive questions. Q1: state ownership versus directed private ownership. Q2: class versus race or nation. One abolished the owning class; the other made an alliance with it against the workers' movement.</p>
      <div class="warn"><strong>Never classify by method.</strong> Methods travel; content does not. Comparable in repression is not the same as comparable in ideology — and noticing that two regimes were both murderous is a moral observation, not a diagnostic one.</div>`},
  {h:'National populism',
   b:`<p>Not a classical ideology — a composite, fusing thin populism onto a nationalist host. Very common now, and very often misnamed fascism.</p>
      <table class="k">
      <tr><th>Q1</th><td>Private, retained — but directed toward national ends</td></tr>

      <tr><th>Q3</th><td>The nation was sold out from above and outside; recover its strength</td></tr>

      <p><b>Separates from fascism by four absences:</b> no palingenetic rebirth myth, no leader-as-embodied-will replacing elections, no paramilitary mobilisation, no cult of purifying violence. Where those appear, the classification changes.</p>
      <span class="tell">Tell: sovereignty, borders, globalists, the establishment, industrial policy — pursued through ballots.</span>`},

      <tr><th>Q4</th><td>Fulfil and expand it — charges liberalism with failing its own promises</td></tr>

{ tag:'One', title:'The diagnostic mindset',

      <p>What actually discriminates isn't how uncomfortable the moment felt. It's a small set of questions about kind, pervasiveness, and function. This course teaches five of them, then drills them.</p>

{ tag:'Two', title:'Cognitive dissonance & self-justification',
  cards:[
  {h:'The mechanism, not just "hypocrisy"',
   b:`<p class="lead">Cognitive dissonance (Festinger): the discomfort of holding two contradictory cognitions, and the drive to resolve it. The resolution does not require honestly changing your mind — there are four moves, and only one of them is that.</p>
      <ol>
        <li><b>Change the belief</b> to match the behaviour — genuine, if it happens.</li>
        <li><b>Change the behaviour</b> to match the belief — also genuine, if it happens.</li>
        <li><b>Add a justifying cognition</b> without changing either — a permission slip written after the fact.</li>
        <li><b>Discredit the source</b> of the contradicting information — the easiest move, and the most damaging.</li>
      </ol>
      <span class="tell">Tell: dissonance reduction shows up after the behaviour, as a repair job. The decision came first; the story came second.</span>`},
  {h:'Confirmation bias',
   b:`<p>Not "believing what you want" in general — specifically <b>asymmetric scrutiny</b>: confirming evidence gets accepted lightly; disconfirming evidence gets picked apart or waved off as an exception.</p>
      <span class="tell">Tell: ask how much scrutiny each type of evidence received. If confirming evidence sailed through and disconfirming evidence got cross-examined, that's the signature.</span>`},
  {h:'Motivated reasoning',
   b:`<p>The conclusion is fixed <b>before</b> the reasoning starts; the reasoning is reverse-engineered to arrive somewhere it was already going. This is the easiest thing in the family to confuse with dissonance reduction.</p>
      <span class="tell">Tell: dissonance reduction responds to discomfort that arrives after a behaviour. Motivated reasoning starts with the destination already chosen — sometimes before any specific behaviour has even happened.</span>`},
  {h:'Sunk cost / escalation of commitment',
   b:`<p>Justifying further investment — money, time, a relationship — by appeal to what's already been spent, rather than by what the future investment is actually worth. Often <i>powered by</i> dissonance: admitting the first four years were wasted is exactly the discomfort avoided by spending a fifth.</p>
      <span class="tell">Tell: the stated reason points backward ("I've already put in so much"), not forward ("this is still worth it").</span>`},
  {h:'Changing your mind is not a bias',
   b:`<p>If someone updates a belief because the evidence genuinely warranted it — and can say what would have moved them the other way too — that's reasoning working correctly, not a distortion.</p>
      <div class="note">The tell is direction: did the evidence lead to the conclusion, or did the conclusion lead the search for evidence? Treating all belief change as suspect is itself a mistake — the mirror image of never updating at all.</div>`}
  ],
  drill:{kind:'pick', key:'u2'} },

{ tag:'Three', title:'The narcissism spectrum',
  cards:[
  {h:'Not one dial',
   b:`<p class="lead">Confidence, self-esteem, and narcissism get used interchangeably. They are three different things.</p>
      <ul>
        <li><b>Confidence</b> — situational belief in your ability to do a specific thing.</li>
        <li><b>Self-esteem</b> — a general, stable sense of your own worth. Compatible with genuine warmth and real empathy.</li>
        <li><b>Narcissism</b> — a self-concept organised around being exceptional, requiring external admiration, structurally low in empathy for anyone whose function isn't to supply that admiration.</li>

      <span class="tell">Tell: the mask cracks outward, as aggression toward whoever threatened it.</span>`},
  {h:'Vulnerable narcissism',
   b:`<p>The one people miss constantly, because it doesn't look like the stereotype at all: covert, hypersensitive to any perceived slight, chronically feels under-appreciated and wronged, avoids risk rather than seeking dominance — but still fundamentally organised around the self, still low in empathy for others' independent reality.</p>
      <span class="tell">Tell: the mask cracks inward, as withdrawal, self-pity, and quiet resentment — the same structure as the grandiose form, turned in on itself.</span>`},

      <div class="warn"><strong>The two words that matter most: pervasive and impairing.</strong> Most people show two or three of these sometimes. That is not the disorder. The disorder requires the pattern to be the person's stable operating mode, not their behaviour under stress, threat, or grief.</div>`}

{ tag:'Four', title:'Look-alikes and false friends',
  cards:[
  {h:'Narcissistic vs. borderline pattern',
   b:`<table class="k">
      <tr><th></th><th>Narcissistic</th><th>Borderline</th></tr>
      <tr><td>Core fear</td><td>Being ordinary / unadmired</td><td>Being abandoned</td></tr>

{ tag:'Five', title:'Manipulation tactics & defense mechanisms',
  cards:[
  {h:'Defense mechanisms, briefly',
   b:`<p>Everyone uses defense mechanisms; the question is which ones, how rigidly, and how much reality-distortion they require.</p>
      <ul>
        <li><b>Denial</b> — refusing to register a fact at all.</li>
        <li><b>Projection</b> — attributing your own unacceptable feeling to someone else.</li>
        <li><b>Rationalization</b> — a plausible but false reason, built after the fact (dissonance reduction's usual delivery mechanism).</li>
        <li><b>Displacement</b> — redirecting an emotion toward a safer target.</li>
        <li><b>Intellectualization</b> — draining the emotion out of something by discussing it purely abstractly.</li>
      </ul>
      <p>None of these, alone, is pathological. Everyone does all five sometimes. The question is always D2: occasional, or the person's only mode?</p>`},
  {h:'Gaslighting',
   b:`<p>Specifically: a <i>pattern</i>, over time, of denying another person's memory, perception, or feelings in order to make them distrust their own judgment — not a single instance of being wrong, and not ordinary disagreement.</p>
      <span class="tell">Tell: repetition + escalation + the functional effect that the other person starts pre-emptively doubting themselves. A single "that's not what happened" is not gaslighting. Years of it, until you stop trusting your own memory, is.</span>`},
  {h:'DARVO',
   b:`<p><b>D</b>eny, <b>A</b>ttack, <b>R</b>everse <b>V</b>ictim and <b>O</b>ffender — deny the act happened, attack the accuser's credibility, reframe the accuser as the real aggressor. Named and studied by psychologist Jennifer Freyd.</p>
      <span class="tell">Tell: it's the sequence, not just defensiveness. All three parts, in that order, in one exchange, is the signature.</span>`},
  {h:'Love-bombing → devaluation',
   b:`<p>Rapid, intense idealization and attention early on — disproportionate to how long or how well the person is actually known — that creates dependency, followed by withdrawal or criticism once the attachment is secured.</p>
      <span class="tell">Tell: speed and intensity relative to actual depth of knowledge, and its conditionality. Genuine early enthusiasm is common and not a red flag by itself; the tell is that it functions as an investment called in later.</span>`},
  {h:'The trap: everything becomes manipulation',

const MATH_COURSE = [
{ tag:'One', title:'Why none of it stuck',
  cards:[
  {h:'You were taught the procedure, not the question',
   b:`<p class="lead">The complaint is almost always true about the procedure and almost always false about the question. Nobody completes the square at the supermarket. But "how much is this actually growing?" and "how many ways can this go?" are ordinary questions, and school handed you the answers to them in a form that hid what they were for.</p>
      <p>So this course runs backwards from how it was taught. Instead of a method looking for a problem, you start with a situation and work out <i>which question it is</i>. Once the question is named, the procedure is looked up — that part was never the skill.</p>
      <div class="note">Throughout, a right answer reached by the wrong route counts as a miss. If you cannot say <i>which question</i> decided it, you have pattern-matched a school exercise, not identified a problem.</div>`},
  {h:'The five questions',
   b:`<table class="k">
      <tr><th>M1</th><td><b>What kind of question is this?</b><br>whole numbers / an unknown quantity / growth &amp; scale / counting &amp; chance / shape &amp; distance<span class="tell">The fastest discriminator — it decides which key you even need.</span></td></tr>
      <tr><th>M2</th><td><b>What exactly is unknown, and what is given?</b><span class="tell">Most people can’t answer this, which is why the sum feels impossible rather than merely unfamiliar.</span></td></tr>
      <tr><th>M3</th><td><b>Does it change by adding, or by multiplying?</b><span class="tell">The single most consequential distinction in everyday numeracy.</span></td></tr>
      <tr><th>M4</th><td><b>What is the nearest look-alike tool, and what separates them?</b></td></tr>
      <tr><th>M5</th><td><b>What would make this the wrong tool?</b><br>keeps a method from being applied out of habit</td></tr>
      </table>
      <p>M1 and M2 do most of the work. M3 catches the most common live error. The last two are what stop a tool being used past the edge of where it holds.</p>`},
  {h:'M1 routes you to a key',
   b:`<p>Answer M1 and you have already chosen which part of this course applies:</p>
      <ul>
        <li><b>Whole numbers</b> — primes, factors, remainders. What divides what. <span class="tell">Lesson Two</span></li>
        <li><b>An unknown quantity</b> — algebra: one relationship, or two, pinning a number down. <span class="tell">Lesson Three</span></li>
        <li><b>Growth &amp; scale</b> — exponentials and logarithms. <span class="tell">Lesson Four</span></li>
        <li><b>Counting &amp; chance</b> — combinatorics and probability. <span class="tell">Lesson Five</span></li>
        <li><b>Shape &amp; distance</b> — Pythagoras, trig, similarity, scaling laws. <span class="tell">Lesson Three</span></li>
      </ul>
      <p>These are genuinely different kinds of question. Treating a growth question as an arithmetic one, or a conditional-probability question as a straight-probability one, is not a slip in the calculation — it is a mis-sort at M1, and no amount of care further down recovers from it.</p>`},
  {h:'The trap: recognising a school exercise',
   b:`<p>The failure mode this course is built against is reaching for the tool the wording resembles rather than the one the situation needs.</p>
      <div class="warn"><strong>"Two trains leave a station" triggers a method; a real situation triggers nothing.</strong> That is the whole gap. School problems were pre-sorted for you — the chapter heading told you which tool to use. Life does not come with chapter headings, and the sorting is the part you were never drilled on.</div>
      <p>So M1 is drilled first, on its own, before any tool at all.</p>`}
  ],
  drill:{kind:'pick', key:'m1'} },

{ tag:'Two', title:'Primes and what divides what',
  cards:[
  {h:'Primes are the atoms',
   b:`<p class="lead">A prime is a whole number above 1 divisible only by 1 and itself. That definition is dull. What makes it load-bearing is the <b>fundamental theorem of arithmetic</b>: every whole number above 1 is a product of primes in exactly one way.</p>
      <p>60 is 2 × 2 × 3 × 5 and there is no second route to it. Not "usually", not "if you factor carefully" — exactly one. That uniqueness is what makes primes the atoms rather than merely an odd category, and it is why 1 is deliberately excluded: admit it, and every number would have infinitely many factorisations.</p>
      <span class="tell">Tell: a question about what a number is <i>built from</i> is a factorisation question. A question about whether it breaks apart <i>at all</i> is a primality question. They feel identical and take different work.</span>`},
  {h:'How you actually test one',
   b:`<p>Trial division, stopping at the square root. To test 91 you try 2, 3, 5, 7 — and stop, because √91 ≈ 9.5.</p>
      <p>Why the square root? If <i>n</i> has a factor above √n, it must also have the matching one below it. Checking past the square root is checking the same pairs a second time from the other end.</p>
      <div class="note">This one bound turns testing 91 from ninety divisions into four, and it is the reason 91 is the standard trap: people test 2, 3 and 5, find nothing, and declare it prime — having stopped one divisor early.</div>`},
  {h:'Where primes are used constantly, and never by hand',
   b:`<p>Multiplying two 300-digit primes takes a computer no time. Recovering those two primes from the product is, as far as anyone has publicly demonstrated, infeasible. That asymmetry — easy one way, hard the other — is the whole of RSA.</p>
      <p>Every HTTPS connection you have ever made has leaned on it. So the honest form of "I never use primes" is: you use them the way you use a gearbox — constantly, and never by hand.</p>
      <span class="tell">Elsewhere: hash tables size themselves to primes to spread collisions; cicadas emerge on 13- and 17-year cycles, which are prime precisely because that minimises coincidence with predator cycles.</span>`},
  {h:'The rest of the whole-number kit',
   b:`<table class="k">
      <tr><th>GCD</th><td>The largest number dividing both. Reducing a fraction; cutting a 96 × 60 cm sheet into the largest equal squares.</td></tr>
      <tr><th>LCM</th><td>The smallest number both divide. When two meshed gears realign; when two schedules of different lengths coincide again.</td></tr>
      <tr><th>mod</th><td>Divide and keep only the remainder. Weekdays, clock arithmetic, IBAN and ISBN check digits, and every hashing scheme in use.</td></tr>
      <tr><th>irrational</th><td>Some quantities are no fraction at all. The diagonal of a 1 × 1 square is √2, and the proof that no fraction equals it is two lines long and about 2,400 years old.</td></tr>
      </table>
      <p>The drill next is primality only, because that is where the early-stopping error lives.</p>`}
  ],
  drill:{kind:'pick', key:'m2'} },

{ tag:'Three', title:'Unknowns and shapes',
  cards:[
  {h:'An equation is a constraint, not a puzzle',
   b:`<p class="lead">An equation says: whatever this number is, it satisfies this. Solving is not cleverness — it is undoing the operations in reverse order until the unknown stands alone.</p>
      <p>What decides which tool you need is not difficulty. It is <b>how many unknowns there are, and how they enter</b>:</p>
      <table class="k">
      <tr><th>Rearrange</th><td>One unknown, entering once. You have the relationship and want it solved for a different letter. <span class="tell">°F to °C; a mortgage formula solved for the payment.</span></td></tr>
      <tr><th>Proportion</th><td>One ratio holding across the problem. <span class="tell">Paint coverage, recipe scaling, unit prices — the one you genuinely use weekly.</span></td></tr>
      <tr><th>Simultaneous</th><td>Two unknowns, two independent facts. <span class="tell">Fifteen notes worth €120. Either fact alone leaves many answers.</span></td></tr>
      <tr><th>Quadratic</th><td>The unknown multiplied by itself. <span class="tell">Anything under gravity; anything where area is fixed and sides are not.</span></td></tr>
      </table>`},
  {h:'The discriminant answers a question worth asking',
   b:`<p>Before solving <i>ax² + bx + c = 0</i>, the quantity <i>b² − 4ac</i> tells you whether any real solution exists at all — positive means two, zero means one, negative means none.</p>
      <p>"Is there any answer?" is a better first question than "what is the answer?", and it is the only part of the quadratic apparatus that generalises into ordinary judgment: knowing that a set of constraints admits no solution is itself the result.</p>
      <div class="note">Two unknowns and one fact is underdetermined — infinitely many answers, and no method fixes that. Recognising an underdetermined problem stops a lot of wasted effort, in and out of mathematics.</div>`},
  {h:'Shape: four things worth keeping',
   b:`<table class="k">
      <tr><th>Pythagoras</th><td>Two sides around a right angle give the third. <span class="tell">Ladders, diagonals, whether the sofa clears the corner.</span></td></tr>
      <tr><th>Trig ratio</th><td>An angle and one side give any other side. <span class="tell">Heights you cannot climb; roof pitch; ramp gradients.</span></td></tr>
      <tr><th>Similar triangles</th><td>Same shape, different size — matching ratios give the missing length. <span class="tell">Measuring a tree by its shadow, with no trigonometry at all.</span></td></tr>
      <tr><th>Square–cube</th><td>Scale a length by n: area scales by n², volume by n³. <span class="tell">Pizza sizes, TV diagonals, doubling a recipe in a pot.</span></td></tr>
      </table>`},
  {h:'The square–cube law is the one that pays',
   b:`<p>It is the least taught and the most used. A 16-inch pizza has four times the area of an 8-inch, not twice. A 65-inch TV has about 45% more screen than a 55-inch, though the number on the box rose by 18%. A pot with every dimension doubled holds eight times as much and takes far longer to heat through.</p>
      <p>It also explains things that look like biology: large animals need disproportionately thick legs because weight grows with volume while bone strength grows with cross-sectional area. Same law, different subject.</p>
      <span class="tell">Tell: any time a single length is quoted for something you care about by area or volume — screens, pizzas, pipes, tanks — the quoted number is understating the difference.</span>`}
  ],
  drill:{kind:'pick', key:'m3'} },

{ tag:'Four', title:'Growth you cannot picture',
  cards:[
  {h:'Adding versus multiplying',
   b:`<p class="lead">This is the distinction that matters most and gets confused most. <b>Linear:</b> the same amount is added each period. <b>Exponential:</b> the same factor multiplies it each period, so the increase itself grows.</p>
      <p>€200 a month into a shoebox is linear, however impressive the total. A balance rising 7% a year is exponential, however dull the percentage. In everyday speech "exponential" has come to mean "fast", which is why people call the shoebox exponential and a debt at 19% merely expensive.</p>
      <span class="tell">Tell: ask what happens between two consecutive periods. If the difference is constant, it is linear. If the ratio is constant, it is exponential.</span>`},
  {h:'Doubling time, and the rule of 72',
   b:`<p>Human intuition about exponentials is bad, reliably and in one direction: we underestimate. The repair is not a better feel for curves; it is a number — <b>the doubling time</b>.</p>
      <p>Divide 72 by the percentage rate and you get roughly the years to double. At 7%, about ten years. At 3%, about twenty-four. At 19% on an unpaid card, under four.</p>
      <div class="note">The rule of 72 is a logarithm rounded for mental arithmetic: the exact answer is log 2 / log(1 + r). It is accurate to within a few percent for any rate you meet in ordinary life.</div>`},
  {h:'A logarithm is a question, not a button',
   b:`<p>The question is: <b>what exponent gets me there?</b> If growth is ×1.07 a year and you want to know when the money doubles, you are solving 1.07ⁿ = 2 — and n is the logarithm.</p>
      <p>Exponentials answer "how big after n steps". Logarithms answer "how many steps to reach that size". They are the same relationship read from opposite ends, and school taught them a year apart, which is most of why they feel unrelated.</p>`},
  {h:'Log scales, and how they mislead',
   b:`<p>When numbers span orders of magnitude, plotting them raw is useless — the small ones flatten to nothing. A log scale gives each ×10 the same width.</p>
      <p>You have been reading them for years: Richter (7.0 releases about 32× the energy of 6.0), decibels, pH, star magnitudes, film speed.</p>
      <div class="warn"><strong>The cost is that a log axis makes explosive growth look like a gentle straight line.</strong> A chart of a doubling quantity looks alarming on a linear axis and calm on a log one. Neither is dishonest; you just have to know which you are reading, and a great many published charts do not label it prominently.</div>`}
  ],
  drill:{kind:'pick', key:'m4'} },

{ tag:'Five', title:'Counting and chance',
  cards:[
  {h:'Count the slots, then ask whether order matters',
   b:`<table class="k">
      <tr><th>Slots</th><td><b>Multiplication principle</b> — independent choices, each with its own menu. 4 starters × 6 mains × 3 desserts = 72. <span class="tell">Tell: picking one thing never removes an option elsewhere.</span></td></tr>
      <tr><th>Order matters</th><td><b>Permutations</b> — gold, silver, bronze from 8 runners: 8 × 7 × 6 = 336.</td></tr>
      <tr><th>Order doesn’t</th><td><b>Combinations</b> — 6 lottery balls from 49: 13,983,816. Order irrelevant to whether you won, so divide out the 720 orderings.</td></tr>
      </table>
      <p>Nearly every counting mistake is answering one of these with the method for another. Ask the order question explicitly, out loud, before counting anything.</p>`},
  {h:'The complement trick',
   b:`<p class="lead">When a question asks for the chance of <b>at least one</b>, count the opposite instead and subtract from 1. "At least one" is an enormous number of cases; "none at all" is usually a single product.</p>
      <p>Twenty-three people, any shared birthday: computing it directly is a nightmare, and computing "all birthdays different" is one clean chain — 365/365 × 364/365 × … — which comes to about 0.493. So the answer is 50.7%, and it surprises people every time.</p>
      <span class="tell">Tell: the words "at least one" in a probability question are an instruction to flip it.</span>`},
  {h:'Base rates',
   b:`<p>A test is 99% accurate. The condition affects 1 in 10,000. You test positive. Most people say 99%. The answer is about 1%.</p>
      <p>Take a million people: about 100 have it, of whom 99 test positive. About 999,900 do not, of whom roughly 9,999 test positive anyway. Your positive is one of about 10,098 — of which 99 are real.</p>
      <div class="warn"><strong>"99% accurate" answers P(positive given ill). You are asking P(ill given positive).</strong> They are different numbers and the gap between them is the base rate. This same inversion drives false confidence in DNA matches, security screening, and any rare-event alarm.</div>`},
  {h:'Independence, and the fallacy that follows it',
   b:`<p>Six reds in a row does not make black due. The wheel has no memory, and each spin is independent.</p>
      <p>The mirror error: "1 in 4 people are X, there are four of us, so one of us is." A rate over a population is not a quota over a sample. Four independent draws at 1/4 gives about a 68% chance of at least one — and 32% of none. Which is, again, the complement rule.</p>
      <span class="tell">Tell: before combining probabilities, say whether the events are independent. If you cannot say, you cannot multiply.</span>`}
  ],
  drill:{kind:'pick', key:'m5'} },

{ tag:'Six', title:'Faulty claims',
  cards:[
  {h:'Where the errors actually happen',
   b:`<p class="lead">Almost none of the numerical errors people make in ordinary life are arithmetic. They are mis-sorts at M1, or a tool applied past its edge.</p>
      <p>The six claims in this drill are the ones you will meet most often. Each fails at a specific question — usually M3 (adding versus multiplying) or the base rate — and none of them fails because someone got a sum wrong.</p>
      <p>For each one, state the fault out loud before revealing it. Name the question the claim skipped.</p>`}
  ],
  drill:{kind:'err'} },

{ tag:'Seven', title:'Full determination',
  cards:[
  {h:'Running the whole key',
   b:`<p class="lead">Everything so far has drilled one branch at a time. Now you run the full sequence on unlabelled situations, none of which announce which chapter they came from.</p>
      <p>For each: answer M1, then the two questions specific to that branch, and only then name the tool. A readout between the situation and the questions crosses off tools your answers have eliminated.</p>
      <h3>How this is scored</h3>
      <p>Your <b>name</b> and your <b>route</b> are counted separately. Getting the right tool from the wrong answers is flagged and counts as a miss — because recognising a familiar-looking problem is exactly the habit this course is trying to replace.</p>
      <div class="note">Naming the tool is where this stops. Executing it is a lookup, and always was.</div>`}
  ],
  drill:{kind:'det'} }
];

    <li><b>This is a sorting key, not a syllabus.</b> It teaches you which question a situation is, and stops there. Executing the method — the long division, the algebra, the actual integral — is a separate skill and mostly a lookup.</li>
    <li><b>"Never used in daily life" is half true.</b> The procedures genuinely are unused by hand. The questions are not, and several of these — proportion, compounding, base rates, the square–cube law — are used against you commercially whether or not you use them yourself.</li>
    <li><b>The rules of thumb are approximations.</b> The rule of 72 is a rounded logarithm; it drifts at high rates. The birthday figure assumes uniform birthdays, which is very slightly false.</li>
    <li><b>Real probability problems are usually about the model, not the arithmetic.</b> Whether events are independent, whether a sample is representative, whether the base rate quoted applies to you — those are judgment calls that the formula cannot make and will silently assume.</li>

const STATS_COURSE = [
{ tag:'One', title:'The pipeline',
  cards:[
  {h:'Audit the pipeline, not the number',
   b:`<p class="lead">Almost nobody lies with statistics by inventing a figure. The number is usually correct. What goes wrong happened before the number existed — in who was counted, in what was counted, in what it was set against, and in what it was said to prove.</p>
      <p>So arguing with the figure is the wrong move, and so is the reflex of distrusting anything numerical. Both leave you unable to tell a good claim from a bad one, which is the only skill worth having here.</p>
      <p>Every statistical claim is the output of a pipeline with four stages. This course walks the pipeline in order and asks one question at each stage.</p>
      <div class="note">Throughout, a right label reached by the wrong route counts as a miss. If you cannot say <i>which stage</i> broke, you have registered a smell, not diagnosed a claim.</div>`},
  {h:'The four stages',
   b:`<table class="k">
      <tr><th>S1</th><td><b>Who got counted?</b><br>which cases made it into the data at all<span class="tell">Faults here cannot be repaired downstream.</span></td></tr>
      <tr><th>S2</th><td><b>What does the number count?</b><br>the definition, the instrument, the effort spent looking<span class="tell">Ask what would have to change in the world for this number to move.</span></td></tr>
      <tr><th>S3</th><td><b>What is it set against?</b><br>the contrast, the denominator, the base rate<span class="tell">A number alone carries no information.</span></td></tr>
      <tr><th>S4</th><td><b>What does it say caused what?</b><br>the leap from a pattern to an explanation<span class="tell">The famous stage, and the least often decisive.</span></td></tr>
      </table>
      <p>Run them in that order. They are not a menu.</p>`},
  {h:'Stop at the first break',
   b:`<p>The stages are sequential, and a fault upstream contaminates everything after it. If the sample was assembled out of survivors, there is no point debating whether the correlation is causal — you are reasoning about a population that does not exist.</p>
      <p>So the diagnostic question is not <i>what is wrong with this claim</i>, which usually has several answers. It is <b>where does it first break</b>, which has one.</p>
      <div class="warn"><strong>This is the discipline the key enforces.</strong> A claim can be guilty at three stages at once. Name the earliest, because that is the one that decides whether anything downstream is worth examining.</div>`},
  {h:'"No fault" is a real answer',
   b:`<p>Every stage in this course has a sound option, and roughly one specimen in five is clean. This is deliberate.</p>
      <p>A key that only ever outputs faults is not a diagnostic instrument, it is a mood. The person who can say <i>this one is fine, and here is why</i> is the one whose objections are worth listening to when they do object.</p>
      <p>Learn the shape of a sound claim — random frame with non-response chased, a stable definition, a like-for-like contrast, randomised assignment — so that its absence is something you notice rather than something you argue yourself into.</p>`}
  ],
  drill:{kind:'pick', key:'v1'} },

{ tag:'Two', title:'Who got counted',
  cards:[
  {h:'The move: picture who is missing',
   b:`<p class="lead">Sampling faults share one shape. The data was assembled by a process that had opinions about which cases to include, and the excluded cases are the ones that would change the answer.</p>
      <p>The move is always the same: describe the cases that are not in front of you, then ask what they would do to the conclusion. If you cannot answer, you do not yet know what the number means.</p>`},
  {h:'The four sampling faults',
   b:`<table class="k">
      <tr><th>A</th><td><b>Survivorship</b> — the population was defined at the end of the window<span class="tell">The failures were removed by the act of assembling the data.</span></td></tr>
      <tr><th>B</th><td><b>Self-selection</b> — subjects put themselves in<span class="tell">Whatever motivated them to join also predicts their answer.</span></td></tr>
      <tr><th>C</th><td><b>Non-response</b> — the frame was right, the returns were not<span class="tell">The silent differ from the responders in the direction of the question.</span></td></tr>
      <tr><th>D</th><td><b>Small-number volatility</b> — nobody is missing, the denominator is tiny<span class="tell">Extremes at both ends of the table are the same phenomenon.</span></td></tr>
      </table>
      <p>The first three are about who is absent. The fourth is about how few are present — no bias at all, just arithmetic.</p>`},
  {h:'Small numbers deserve their own reflex',
   b:`<p>Give a rate a denominator of a few thousand and it will swing violently on one or two cases. This produces league tables in which the very best and the very worst entries are both small, and it produces "clusters" that are the expected clumping of random points.</p>
      <div class="note"><strong>The check takes five seconds:</strong> look at the other end of the same table. If small units dominate the top <i>and</i> the bottom, size is producing the ranking, not quality.</div>
      <p>Percentages hide this completely. "Up 200%" is three cases where there was one.</p>`},
  {h:'Size does not fix selection',
   b:`<p>The most persistent error in this stage is believing that a big enough sample repairs a bad one. It does not, and it never has.</p>
      <p>Two thousand self-selected website respondents are worse than four hundred randomly drawn ones, because increasing n reduces random error while leaving the systematic error exactly where it was. A large biased sample is a precise estimate of the wrong quantity.</p>
      <div class="warn"><strong>Watch for size cited as a defence.</strong> "We surveyed forty thousand people" answers a question nobody asked if all forty thousand opted in.</div>`}
  ],
  drill:{kind:'pick', key:'v2'} },

{ tag:'Three', title:'What the number counts',
  cards:[
  {h:'The counterfactual test',
   b:`<p class="lead">At this stage the sample is fine and the arithmetic is fine. The question is whether the number is still attached to the thing it is supposed to represent.</p>
      <p>One question does most of the work here: <b>if the underlying reality had not moved at all, could this number still have moved?</b> Three answers say yes, and each names a different fault.</p>`},
  {h:'Three ways a number detaches',
   b:`<table class="k">
      <tr><th>A</th><td><b>Proxy failure</b> — the measure became the target<span class="tell">Goodhart: a measure that becomes a target stops being a good measure.</span></td></tr>
      <tr><th>B</th><td><b>Definition changed</b> — same word, new counting rule<span class="tell">The ruler was rewritten mid-series.</span></td></tr>
      <tr><th>C</th><td><b>Detection effect</b> — more looking, not more happening<span class="tell">Screening, reporting drives, new awareness campaigns.</span></td></tr>
      </table>
      <p>All three produce a moving series over a still world. They are told apart by what moved: the incentive, the rule, or the effort.</p>`},
  {h:'Proxies are not lies, they are load-bearing approximations',
   b:`<p>Waiting times stand in for good emergency care. Test scores stand in for learning. Tickets closed stand in for support quality. Every one of these is a reasonable proxy right up until someone is paid on it.</p>
      <p>Then effort flows to the number rather than the thing, the two come apart, and the series improves while the world does not. The improvement is real — as a measurement of the measurement.</p>
      <div class="note"><strong>The tell is a target announced.</strong> Whenever a passage says a metric became the central measure, ask what happened to the parts of the job the metric does not see.</div>`},
  {h:'Detection: the mortality check',
   b:`<p>Detection effects are the hardest of the three to see, because a genuine rise and a rise in looking produce the same headline.</p>
      <p>The check is to find a downstream measure that harder looking cannot inflate. For disease, that is deaths and advanced-stage presentations. If diagnoses rise fifteen-fold and deaths are flat, the extra fourteen-fold was always there, unfound and mostly harmless.</p>
      <p>The same trick generalises. For crime, ask about homicides or hospital admissions for assault — the offences whose recording barely depends on whether anyone was asked to look.</p>`}
  ],
  drill:{kind:'pick', key:'v3'} },

{ tag:'Four', title:'What it is set against',
  cards:[
  {h:'A number alone carries no information',
   b:`<p class="lead">Ninety percent improved. Risk up 18%. Mortality 3.1%. None of these means anything until you know the quantity it is being held against — and the most effective way to mislead with a true number is to publish it without its comparison.</p>
      <p>Four faults live here, and each is repaired by supplying one specific missing quantity.</p>`},
  {h:'What each one is missing',
   b:`<table class="k">
      <tr><th>A</th><td><b>No comparison group</b> → supply an untreated group<span class="tell">Most conditions improve on their own; that rate is the floor.</span></td></tr>
      <tr><th>B</th><td><b>Relative risk alone</b> → supply the absolute numbers<span class="tell">18% of a 6% baseline is one extra case per hundred.</span></td></tr>
      <tr><th>C</th><td><b>Base-rate neglect</b> → supply the prevalence<span class="tell">Test accuracy is not the probability you are ill.</span></td></tr>
      <tr><th>D</th><td><b>Simpson’s paradox</b> → split the total back into subgroups<span class="tell">The aggregate can reverse every subgroup at once.</span></td></tr>
      </table>`},
  {h:'Base rates: the hundred-people move',
   b:`<p>Conditional probability defeats intuition reliably enough that you should stop trying to reason about it in percentages and just count bodies.</p>
      <p>Ten thousand people. One in ten thousand has the condition, so one person has it, and the test finds them. The test also wrongly flags 1% of the 9,999 who do not — about a hundred people. So a hundred and one positives, of whom one is real.</p>
      <div class="note"><strong>A 99% accurate test yielded a positive result that is roughly 99% likely to be wrong.</strong> Nothing about the test is faulty. The prevalence was doing the work all along.</div>`},
  {h:'Simpson’s paradox is not an exotic case',
   b:`<p>It appears wherever a total is computed across subgroups of different sizes and different underlying rates — hospital mortality, university admissions, batting averages, treatment success by clinic.</p>
      <p>The referral hospital takes the hardest cases. Its combined mortality is worse than the district general even when it is better in every category. Both numbers are correct; only one answers the question a patient is asking.</p>
      <p>Whenever a comparison rests on two totals, ask what the totals are averaging over — and whether the mix differs between them.</p>`}
  ],
  drill:{kind:'pick', key:'v4'} },

{ tag:'Five', title:'What caused what',
  cards:[
  {h:'Three alternatives, not one slogan',
   b:`<p class="lead">"Correlation does not imply causation" is where most people stop, and stopping there is nearly as bad as not knowing it. It names no alternative, so it cannot be checked, and it dismisses good and bad studies at exactly the same cost.</p>
      <p>There are three specific alternatives to a causal reading. Name the one you mean, and say which way it would push.</p>`},
  {h:'The three alternatives',
   b:`<table class="k">
      <tr><th>A</th><td><b>Confounding</b> — a third thing drives both<span class="tell">Name the variable. "Income" is an argument; "confound" is not.</span></td></tr>
      <tr><th>B</th><td><b>Reverse causation</b> — the effect is producing the cause<span class="tell">Settled by sequence: which one moved first?</span></td></tr>
      <tr><th>C</th><td><b>Regression to the mean</b> — the group was selected for being extreme<span class="tell">Needs no mechanism and no third variable. Pure measurement.</span></td></tr>
      </table>`},
  {h:'Regression to the mean is the one you will miss',
   b:`<p>Any measurement is part real signal and part noise on the day. Select a group for having the most extreme scores and you have selected, among other things, for the ones whose noise ran hardest in one direction. Measure again and that component averages out.</p>
      <p>The group improves. Nothing caused it. Whatever you did in between gets the credit.</p>
      <div class="warn"><strong>This is why "we treated the worst cases and they improved" is not evidence.</strong> It is also why praise appears to backfire and criticism appears to work: both are administered after extreme performances, and both are followed by ordinary ones.</div>`},
  {h:'What randomisation actually buys',
   b:`<p>Random assignment closes off confounding and reverse causation by construction — unmeasured third variables land in both arms by chance, and an assignment made before any outcome exists cannot have been caused by one.</p>
      <p>That is why the sound specimens in this course are almost all randomised. It is also why the check does not end there: broken blinding, differential dropout, or outcomes ascertained more keenly in one arm reopen the questions randomisation was meant to close.</p>
      <div class="note"><strong>Observational evidence is not worthless.</strong> A named confound that has been measured and adjusted for, a dose-response relationship, and a plausible mechanism together can carry a causal claim. Demanding a trial for everything is a way of never updating.</div>`}
  ],
  drill:{kind:'pick', key:'v5'} },

{ tag:'Six', title:'Claims that engage nothing',
  cards:[
  {h:'The residual category',
   b:`<p class="lead">Some claims cannot be run through the key at all. There is no sample to describe, no definition to check, no contrast to supply — just a number-shaped object doing rhetorical work.</p>
      <p>These are not hard cases. They are the most common ones, and the failure mode is treating them as though they deserve the full procedure.</p>`},
  {h:'Two symmetrical errors',
   b:`<p>The first is the credulous one: a figure is quoted, it sounds specific, and specificity is mistaken for evidence. Nine out of ten dentists.</p>
      <p>The second is the corrosive one: <i>correlation is not causation</i>, <i>you can prove anything with statistics</i>, <i>that study was funded by someone</i> — deployed to dismiss without engaging a single stage of the pipeline.</p>
      <div class="warn"><strong>Both errors have the same structure.</strong> Neither asks a question that could come back with an answer. The drill below is practice at saying exactly which question a claim refuses to engage.</div>`}
  ],
  drill:{kind:'err'} },

{ tag:'Seven', title:'Full determination',

      <p>The readout crosses off what your answers have ruled out. Your name and your route are scored separately, and a right name from the wrong route counts as a miss — because a fault you cannot locate is one you will not find again in an unfamiliar claim.</p>
      <div class="note">Roughly one specimen in five is sound. Naming it sound is a determination, not a pass.</div>`}

  drill:{kind:'det'} }

  caveats:`<ul>
    <li><b>Naming a fault is not refuting a claim.</b> "Confound" on its own is a noise. Name the variable, say which direction it would push, and estimate whether it is big enough to account for the effect — otherwise you have raised a possibility, not an objection.</li>
    <li><b>Real claims often break at several stages at once.</b> "Where does it first break" is a teaching convention that forces a single defensible answer; it is not a law about how claims fail.</li>
    <li><b>Professional statistics has tools for all of these</b> — weighting, adjustment, instrumental variables, sensitivity analysis, inverse-probability weighting for non-response. A confound that has been measured and handled is in a different category from one that was never mentioned.</li>

{ tag:'One', title:'The current ask',
  cards:[
  {h:'Classify the ask, not the story',
   b:`<p class="lead">The stories are infinite and cost nothing to replace. The frozen tax refund, the offshore engineer, the parcel fee, the recruiter — these are surfaces, regenerated as fast as anyone learns them.</p>
      <p>Underneath, there are only four things a stranger can want from you: your money, a credential, a foothold on your device, or information. Every pattern in this course is one of those four with a story wrapped round it, and the story is the part you should ignore first.</p>
      <div class="note">Throughout, a right label reached by the wrong route counts as a miss. If you cannot say <i>which ask</i> you were answering, you have recognised a story you happen to have heard of — which is no protection against the next one.</div>`},
  {h:'The four asks',
   b:`<table class="k">
      <tr><th>G1</th><td><b>Move money</b><br>transfer, card, crypto, vouchers<span class="tell">The only one where the loss is immediate and usually final.</span></td></tr>
      <tr><th>G2</th><td><b>Hand over a credential</b><br>password, one-time code, app permission<span class="tell">Survives being noticed — access persists after the conversation ends.</span></td></tr>
      <tr><th>G3</th><td><b>Let something onto your device</b><br>installer, attachment, screen-share<span class="tell">Converts one contact into standing access.</span></td></tr>
      <tr><th>G4</th><td><b>Give information, or nothing yet</b><br>documents, details, or only conversation<span class="tell">The stage most often mistaken for safety.</span></td></tr>
      </table>`},
  {h:'The ask now, not the goal eventually',
   b:`<p>A caller who wants to screen-share to sort out a refund is after your money. But the thing being asked for <i>now</i> is access to your device, and that is what you can still refuse.</p>
      <p>So the key classifies by the current ask, always. This is not a technicality — it is where the intervention lives. By the time the refund scam reaches the money, you are watching a manipulated screen and being asked to correct someone’s payroll error, which is a much harder moment to think in.</p>
      <div class="warn"><strong>Name the step in front of you.</strong> The goal is what they get if nothing stops it. The ask is what you are being invited to do in the next sixty seconds.</div>`},
  {h:'The channel is not the classification',
   b:`<p>Email, SMS, a phone call, WhatsApp, a dating app, a LinkedIn message, a QR code on a parking meter — these are delivery, and any pattern here arrives down any of them.</p>
      <p>"Smishing" and "vishing" name the pipe, not the mechanism, and sorting by pipe produces a list that grows forever and predicts nothing. Sorting by the ask produces four categories that have stayed stable for decades.</p>
      <p>The same goes for polish. Spoofed sender IDs, cloned websites, correct logos and synthesised voices are all cheap now. Nothing about how a message looks or sounds belongs in the determination.</p>`}
