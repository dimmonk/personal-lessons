    <div style="display:flex;flex-direction:column;gap:12px;padding:10px 0 22px">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="sigil" style="width:30px;height:30px;flex:0 0 30px">${subj.keyNo}</span>
        <span class="m">Key ${subj.keyNo} &middot; Revision ${esc(subj.rev)}</span>
      </div>
      <h1 style="margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1">${esc(subj.name)}</h1>
      <p style="margin:0;font-size:15px;line-height:1.5;color:var(--dim);max-width:34ch">${esc(subj.blurb)}</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;padding-bottom:20px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span class="m">Progress</span>
        <span class="m" style="letter-spacing:.08em">${done} of ${total} units</span>
      </div>
      <div class="segs">${subj.course.map((_,i) => `<i class="${c.done[i]?'on':''}"></i>`).join('')}</div>
    </div>

    <div class="block"><button class="btn" id="resume">${resumeText}${icon('arrow',17)}</button></div>

    <div class="block"><div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <span class="m a">The key</span>
          <span style="font-size:19px;font-weight:700;letter-spacing:-.02em">Full determination</span>
        </div>
        <span style="color:var(--accent);display:flex">${icon('target',26)}</span>
      </div>
      <p style="margin:0;font-size:14px;line-height:1.5;color:var(--dim)">${esc(detBlurb(subj))}</p>
      <div class="statrow">
        <span class="stat"><b>${d.n}/${subj.specimens.length}</b><span>Determined</span></span>
        <span class="stat"><b>${d.n ? d.label : '&mdash;'}</b><span>Name</span></span>
        <span class="stat"><b>${d.n ? d.frame : '&mdash;'}</b><span>Route</span></span>
      </div>
      <button class="btn ghost sm" data-v="det">${d.n ? 'Continue the determination' : 'Run the determination'}</button>
    </div></div>

    <div class="sect"><span class="m">Course</span>
      <span class="m s">${total} units &middot; ${subj.cardCount} cards</span></div>
    <div class="rows">${subj.course.map((u,i) => {
      const isDone = c.done[i], isNow = !isDone && i === c.u;
      const badge = isDone
        ? `<span class="sigil sm fill">${icon('check',13)}</span>`
        : `<span class="sigil sm ${isNow?'on':''}">${i+1}</span>`;
      const meta = isNow && (c.card > 0 || c.phase !== 'read')
        ? `Card ${c.card+1} of ${u.cards.length} &middot; in progress`
        : `${u.cards.length} card${u.cards.length===1?'':'s'} &middot; ${drillOf(u, subj)}`;
      return `<button class="row sm ${isDone?'done':''} ${isNow?'now':''}" data-u="${i}">
        ${badge}
        <span class="grow"><span class="t">${esc(u.title)}</span>
          <span class="s" ${isNow?'style="color:var(--accent)"':''}>${meta}</span></span>
        ${icon('chevron')}
      </button>`;
    }).join('')}</div>

    <div class="sect top"><span class="m">Drills</span>
      <span class="m s">${subj.quickDrills.length} scored &middot; 1 not</span></div>
    <div class="grid">
      ${subj.quickDrills.map(q => {
        const sc = S.stats[q.key];
        const cls = !sc.n ? '' : (sc.ok === q.items.length ? 'ok' : 'part');
        return `<button class="tile" data-d="${q.key}">
          <span class="tt">${esc(q.title)}</span>
          <span class="tf"><span class="m s">${q.items.length} items</span>
            <b class="${cls}">${sc.n ? sc.ok + '/' + sc.n : '&mdash;'}</b></span>
        </button>`;
      }).join('')}
      <button class="tile un" data-v="err">
        <span class="tt">Faulty claims</span>
        <span class="tf"><span class="m s">${subj.errDrill.length} claims</span>
          <b>${S.stats.err.seen ? S.stats.err.seen + ' seen' : 'unscored'}</b></span>
      </button>
    </div>

    <div style="padding-top:26px">
      <button class="row sm" data-ref="units">
        <span style="color:var(--label);display:flex">${icon('book',18)}</span>
        <span class="grow"><span class="t" style="font-weight:500">Reference &mdash; everything condensed</span></span>
        ${icon('chevron')}
      </button>
      <button class="row sm" data-ref="caveats">
        <span style="color:var(--label);display:flex">${icon('alert',18)}</span>
        <span class="grow"><span class="t" style="font-weight:500">Where this key stops</span></span>
        ${icon('chevron')}
      </button>
    </div>
  </div>`;

  on('[data-v]', el => go(el.dataset.v));
  on('[data-u]', el => openUnit(subj, +el.dataset.u));
  on('[data-d]', el => go('drill', {drillKey: el.dataset.d}));
  on('[data-ref]', el => go('reference', {refMode: el.dataset.ref}));
  on('#resume', () => resumeSubject(subj.id));
}

function detBlurb(subj){
  const d = subj.determination;
  const nSteps = d.gateCode
    ? 1 + Math.max(...Object.values(d.stepsByGate).map(a => a.length))
    : d.steps.length;
  return `${nSteps} question${nSteps===1?'':'s'} narrow ${subj.outcomes.length} tools to one. `
       + `${cap(numWord(subj.specimens.length))} unlabelled cases.`;
}

/* ===================== LESSON ===================== */

function renderLesson(subj){
  const c = st(subj).course, u = subj.course[c.u], card = u.cards[c.card];
  const last = c.card === u.cards.length - 1;

  screenEl().innerHTML = `<div class="withaside" style="--accent:${subj.accent}">
    <aside class="aside">
      <div class="ahead">
        <span class="m">Unit ${esc(u.tag)}</span>
        <h2>${esc(u.title)}</h2>
      </div>
      ${u.cards.map((cc,i) => `<button class="acard ${i===c.card?'on':''}" data-c="${i}">
        <i>${i+1}</i><span>${esc(cc.h)}</span></button>`).join('')}
      <div style="padding-top:14px;margin-top:10px;border-top:1px solid var(--divider)">
        <span class="m s">Then: ${esc(drillOf(u, subj))}</span>
      </div>
    </aside>

    <div class="pane read flush">
      <div class="topbar">
        <button class="iconbtn" data-v="subject">${icon('back',20)}</button>
        <span class="m">Unit ${esc(u.tag)} &middot; Card ${c.card+1} of ${u.cards.length}</span>
        <button class="iconbtn" data-v="subject">${icon('list',19)}</button>
      </div>
      <div class="segs thin" style="margin:14px 0 0">
        ${u.cards.map((_,i) => `<i class="${i<=c.card?'on':''}"></i>`).join('')}</div>

      <div class="eyebrow-row">
        <span class="m a">${esc(u.title)}</span>
        <h1>${esc(card.h)}</h1>
      </div>
      <div class="lesson">${card.b}</div>

      <div class="actbar">
        <div class="actrow">
          ${c.card > 0 ? `<button class="btn ghost" id="back">Back</button>` : ''}
          <button class="btn neutral" id="fwd">${last ? 'Start the drill' : 'Next card'}${icon('arrow')}</button>
        </div>
        <p class="hint">${last ? esc(drillOf(u, subj)) :
          (u.cards.length - c.card - 1) + ' more card' + (u.cards.length - c.card - 1 === 1 ? '' : 's') + ', then the drill'}</p>
      </div>
    </div>
  </div>`;

  on('[data-v]', el => go(el.dataset.v));
  on('[data-c]', el => { c.card = +el.dataset.c; saveCourse(subj); renderLesson(subj); window.scrollTo(0,0); });
  on('#back', () => { c.card--; saveCourse(subj); renderLesson(subj); window.scrollTo(0,0); });
  on('#fwd', () => {
    if(!last){ c.card++; saveCourse(subj); renderLesson(subj); window.scrollTo(0,0); }
    else startUnitDrill(subj);
  });
}

function startUnitDrill(subj){
  const S = st(subj), u = subj.course[S.course.u];
  if(u.drill.kind === 'det')      S.detState = freshDet();
  else if(u.drill.kind === 'err') S.errState = {i:0, picked:null};
  else                            S.drill[u.drill.key] = {i:0, picked:null};
  S.course.phase = 'drill'; saveCourse(subj);
  go('unitdrill');
}

/* ===================== DRILL: PICK ===================== */

const answerOf = (q, it) => q.answer ? q.answer(it) : it.a;

function mountPick(host, subj, q, state, stats, storageKey, finish){
  if(state.i >= q.items.length) return finish();
  const it = q.items[state.i], ans = answerOf(q, it);
  const answered = state.picked !== null, ok = answered && state.picked === ans;
  const left = q.items.length - state.i - (answered ? 1 : 0);

  host.innerHTML = `
    <div class="readhead" style="padding:16px 0">
      <span class="m">Item ${pad2(state.i+1)} / ${q.items.length}</span>
      <span class="m s">${esc(q.title)}</span>
    </div>
    <blockquote class="passage ${q.plain?'plain':''}">${esc(it.q)}</blockquote>
    <div style="display:flex;flex-direction:column;gap:12px">
      <span class="m">${esc(q.prompt)}</span>
      <div class="opts" id="opts">${q.opts.map(o =>
        `<button class="opt ${state.picked===o?'sel':''}" data-o="${esc(o)}" ${answered?'disabled':''}>${esc(o)}</button>`).join('')}</div>
    </div>
    ${answered ? `<div style="display:flex;flex-direction:column;gap:18px;padding-top:22px">
      <div class="marks"><span class="mark ${ok?'':'no'}">${icon(ok?'check':'cross',13)}${ok?'Correct':'Missed &mdash; ' + esc(ans)}</span></div>
      <div class="vblock"><span class="m">Why</span><p>${esc(it.w)}</p></div>
    </div>` : ''}
    <div class="score">
      <span class="stat"><b>${stats.n}</b><span>Answered</span></span>
      <span class="stat"><b>${stats.ok}</b><span>Correct</span></span>
      <span class="stat"><b>${left}</b><span>Left</span></span>
    </div>
    ${answered ? `<div class="actbar"><button class="btn" id="next">${state.i===q.items.length-1?'Finish':'Next item'}${icon('arrow')}</button></div>` : ''}`;

  on('#opts .opt', el => {
    if(state.picked !== null) return;
    state.picked = el.dataset.o;
    stats.n++; if(state.picked === ans) stats.ok++;
    if(storageKey) storageSave(storageKey, stats);
    mountPick(host, subj, q, state, stats, storageKey, finish);
  }, host);
  on('#next', () => { state.i++; state.picked = null; mountPick(host, subj, q, state, stats, storageKey, finish); window.scrollTo(0,0); }, host);
}

/* ===================== DRILL: FAULTY CLAIMS ===================== */

function mountErr(host, subj, state, finish){
  if(state.i >= subj.errDrill.length) return finish();
  const it = subj.errDrill[state.i], stats = st(subj).stats.err;

  host.innerHTML = `
    <div class="readhead" style="padding:16px 0">
      <span class="m">Claim ${pad2(state.i+1)} / ${subj.errDrill.length}</span>
      <span class="m s">Faulty claims</span>
    </div>
    <blockquote class="passage">${esc(it.q)}</blockquote>
    ${state.picked ? `<div class="vblock" style="padding-top:6px"><span class="m">The fault</span><p>${esc(it.w)}</p></div>`
      : `<p style="margin:0;font-size:14px;line-height:1.55;color:var(--dim)">State the fault out loud or in writing before revealing it. Name which diagnostic question the claim fails to engage.</p>`}
    <div class="actbar">
      <button class="btn ${state.picked?'':'ghost'}" id="act">${state.picked
        ? (state.i === subj.errDrill.length-1 ? 'Finish' : 'Next claim') + icon('arrow')
        : 'Show the fault'}</button>
    </div>`;

  on('#act', () => {
    if(!state.picked){ state.picked = 'x'; stats.seen++; storageSave(`pl:${subj.id}:stats:err`, stats); }
    else { state.i++; state.picked = null; window.scrollTo(0,0); }
    mountErr(host, subj, state, finish);
  }, host);
}

/* ===================== DRILL: DETERMINATION ===================== */

function mountDet(host, subj, state, finish){
  const stats = st(subj).stats.det;
  if(state.i >= subj.specimens.length) return finish();
  const sp = subj.specimens[state.i];
  if(state.revealed) return mountVerdict(host, subj, state, sp, stats, finish);

  const steps = detActiveSteps(subj, state);
  const live  = detCandidates(subj, state);
  let openIdx = steps.findIndex(x => !state.answers[x.code]);
  if(state.editing){
    const ei = steps.findIndex(x => x.code === state.editing);
    if(ei >= 0) openIdx = ei;
  }
  const ready = openIdx === -1;

  const stepsHTML = steps.map((step, i) => {
    const ansId = state.answers[step.code];
    if(i === openIdx) return `<div class="stepopen">
      <div class="stephead"><span class="num on">${i+1}</span><span class="m a">${esc(step.code)} &middot; ${esc(step.label)}</span></div>
      <div class="opts" data-step="${esc(step.code)}">${step.options.map(o =>
        `<button class="opt ${ansId===o.id?'sel':''}" data-o="${esc(o.id)}">${esc(o.n)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</button>`).join('')}</div>
    </div>`;
    if(ansId){
      const opt = step.options.find(o => o.id === ansId);
      return `<button class="stepdone" data-edit="${esc(step.code)}">
        <span class="tick">${icon('check',12)}</span>
        <span class="grow"><span class="m s">${esc(step.code)} &middot; ${esc(step.label)}</span><span class="v">${esc(opt.n)}</span></span>
        <span class="m s">Change</span></button>`;
    }
    return `<div class="steplock">
      <span class="num off">${i+1}</span>
      <span class="grow"><span class="m s">${esc(step.code)} &middot; ${esc(step.label)}</span>
        <span class="v">Answer the step above</span></span>
      <span style="color:var(--disabled);display:flex">${icon('lock',15)}</span></div>`;
  }).join('');

  const nameHTML = ready
    ? `<div class="stepopen">
        <div class="stephead"><span class="num on">${steps.length+1}</span><span class="m a">ID &middot; Name it</span></div>
        <div class="opts" id="nameOpts">${nameOptions(subj, state).map(o =>
          `<button class="opt ${state.outcome===o.id?'sel':''}" data-n="${esc(o.id)}">${esc(o.n)}</button>`).join('')}</div>
      </div>`
    : `<div class="steplock">
        <span class="num off">${steps.length+1}</span>
        <span class="grow"><span class="m s">ID &middot; Name it</span>
          <span class="v">Answer every step first</span></span>
        <span style="color:var(--disabled);display:flex">${icon('lock',15)}</span></div>`;

  host.innerHTML = `
    <div class="readhead" style="padding:16px 0">
      <span class="m">Specimen ${pad2(state.i+1)} / ${subj.specimens.length}</span>
      <span class="m s">${live.length} of ${subj.outcomes.length} left</span>
    </div>
    <blockquote class="passage">${esc(sp.q)}</blockquote>
    <div class="readout">
      <div class="readhead"><span class="m s">Readout &middot; nothing to tap</span></div>
      <ul class="cands">${subj.outcomes.map(o =>
        `<li class="cand ${live.includes(o.id)?'':'out'}">${esc(o.n)}</li>`).join('')}</ul>
    </div>
    <div class="steps">${stepsHTML}${nameHTML}</div>
    <div class="score">
      <span class="stat"><b>${stats.n}</b><span>Determined</span></span>
      <span class="stat"><b>${stats.label}</b><span>Name</span></span>
      <span class="stat"><b>${stats.frame}</b><span>Route</span></span>
    </div>
    <div class="actbar">
      <div class="actrow">
        <button class="btn ghost" id="skip" style="width:92px;flex:0 0 92px">Skip</button>
        <button class="btn" id="record" ${state.outcome?'':'disabled'}>Record determination</button>
      </div>
      <p class="hint">Right name by the wrong route counts as a miss</p>
    </div>`;

  on('[data-step] .opt', el => {
    const code = el.parentElement.dataset.step;
    const idx = steps.findIndex(x => x.code === code);
    state.answers[code] = el.dataset.o;
    state.outcome = null;
    state.editing = null;
    // re-answering a step invalidates every step after it
    if(subj.determination.gateCode === code) state.answers = {[code]: state.answers[code]};
    else steps.slice(idx + 1).forEach(s2 => delete state.answers[s2.code]);
    mountDet(host, subj, state, finish);
  }, host);
  on('[data-edit]', el => { state.editing = el.dataset.edit; mountDet(host, subj, state, finish); }, host);
  on('#nameOpts .opt', el => { state.outcome = el.dataset.n; mountDet(host, subj, state, finish); }, host);
  on('#record', () => {
    if(!state.outcome) return;
    const cs = correctSteps(subj, sp);
    const routeOk = cs.every(step => (sp.sub[step.code]||[]).includes(state.answers[step.code]));
    stats.n++;
    if(state.outcome === sp.outcome) stats.label++;
    if(routeOk) stats.frame++;
    state.revealed = true;
    storageSave(`pl:${subj.id}:stats:det`, stats);
    mountDet(host, subj, state, finish); window.scrollTo(0,0);
  }, host);
  on('#skip', () => { nextSpecimen(state); mountDet(host, subj, state, finish); window.scrollTo(0,0); }, host);
}

function nextSpecimen(state){ state.i++; state.answers = {}; state.outcome = null; state.revealed = false; state.editing = null; }

function mountVerdict(host, subj, state, sp, stats, finish){
  const steps = correctSteps(subj, sp);
  const routeOk = steps.every(step => (sp.sub[step.code]||[]).includes(state.answers[step.code]));
  const okO = state.outcome === sp.outcome;
  const bad = routeOk ? null : steps.find(step => !(sp.sub[step.code]||[]).includes(state.answers[step.code]));
  const want = bad ? bad.options.filter(o => (sp.sub[bad.code]||[]).includes(o.id)).map(o => o.n).join(' or ') : '';
  const last = state.i === subj.specimens.length - 1;

  host.innerHTML = `
    <div class="readhead" style="padding:16px 0">
      <span class="m">Specimen ${pad2(state.i+1)} / ${subj.specimens.length}</span>
      <span class="m s">Recorded</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;padding-bottom:24px">
      <span class="m">The answer was</span>
      <h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.02;color:var(--accent)">${esc(outcomeName(subj, sp.outcome))}</h1>
      <div class="marks">
        <span class="mark ${okO?'':'no'}">${icon(okO?'check':'cross',13)}Name ${okO?'correct':'missed'}</span>
        <span class="mark ${routeOk?'':'no'}">${icon(routeOk?'check':'cross',13)}Route ${routeOk?'correct':'missed'}</span>
      </div>
    </div>
    ${(okO && !routeOk) ? `<div class="warn" style="margin:0 0 24px">
      <strong>Right name, wrong route.</strong> Scored as a miss. Step ${esc(bad.code)} wanted
      <b style="color:var(--text)">${esc(want)}</b>. A label you cannot derive from the key will not survive an unfamiliar case.</div>` : ''}
    ${(!okO && !routeOk && bad) ? `<div class="warn" style="margin:0 0 24px">
      <strong>Step ${esc(bad.code)} went wrong.</strong> It wanted <b style="color:var(--text)">${esc(want)}</b>.</div>` : ''}
    <div style="display:flex;flex-direction:column;gap:24px;padding-bottom:4px">
      <div class="vblock"><span class="m">Why</span><p>${esc(sp.why)}</p></div>
      <div class="vblock soft"><span class="m">${esc(subj.falsLabel || 'What would falsify this reading')}</span><p>${esc(sp.fals)}</p></div>
    </div>
    <div class="score">
      <span class="stat"><b>${stats.n}</b><span>Determined</span></span>
      <span class="stat"><b style="color:var(--green)">${stats.label}</b><span>Name</span></span>
      <span class="stat"><b style="color:${stats.frame===stats.n?'var(--green)':'var(--coral)'}">${stats.frame}</b><span>Route</span></span>
    </div>
    <div class="actbar"><button class="btn" id="next">${last?'Finish':'Next specimen'}${icon('arrow')}</button></div>`;

  on('#next', () => { nextSpecimen(state); mountDet(host, subj, state, finish); window.scrollTo(0,0); }, host);
}

/* ===================== DRILL SHELLS ===================== */

function drillShell(subj, label, build){
  screenEl().innerHTML = `<div class="pane" style="--accent:${subj.accent}">
    <div class="topbar">
      <button class="iconbtn" data-v="subject">${icon('back',20)}</button>
      <span class="m">${label}</span>
      <span class="spacer"></span>
    </div>
    <div id="host"></div>
  </div>`;
  on('[data-v]', el => go(el.dataset.v));
  build(document.getElementById('host'));
}

function renderUnitDrill(subj){
  const S = st(subj), u = subj.course[S.course.u];
  drillShell(subj, `Unit ${esc(u.tag)} &middot; Drill`, host => {
    const finish = () => finishUnit(subj);
    if(u.drill.kind === 'det')      mountDet(host, subj, S.detState, finish);
    else if(u.drill.kind === 'err') mountErr(host, subj, S.errState, finish);
    else {
      const q = subj.quickDrills.find(x => x.key === u.drill.key);
      mountPick(host, subj, q, S.drill[q.key], S.stats[q.key], `pl:${subj.id}:stats:${q.key}`, finish);
    }
  });
}

function renderDrill(subj){
  const q = subj.quickDrills.find(x => x.key === APP.drillKey);
  if(!q) return go('subject');
  const S = st(subj);
  drillShell(subj, 'Drill', host => mountPick(host, subj, q, S.drill[q.key], S.stats[q.key],
    `pl:${subj.id}:stats:${q.key}`,
    () => doneScreen(subj, 'Set complete', `<b>${S.stats[q.key].ok}</b> correct of <b>${S.stats[q.key].n}</b> answered.`,
      () => { S.drill[q.key] = {i:0, picked:null}; render(); })));
}

function renderErr(subj){
  const S = st(subj);
  drillShell(subj, 'Faulty claims', host => mountErr(host, subj, S.errState,
    () => doneScreen(subj, 'Set complete', `All ${subj.errDrill.length} faults reviewed.`,
      () => { S.errState = {i:0, picked:null}; render(); })));
}

function renderDet(subj){
  const S = st(subj), d = S.stats.det;
  drillShell(subj, 'Determination', host => mountDet(host, subj, S.detState,
    () => doneScreen(subj, 'Determination complete',
      `Names correct <b>${d.label}</b> &middot; routes correct <b>${d.frame}</b> of <b>${d.n}</b> recorded.`,
      () => { S.detState = freshDet(); render(); })));
}

function doneScreen(subj, title, line, again){
  screenEl().innerHTML = `<div class="pane" style="--accent:${subj.accent}">
    <div class="topbar"><button class="back" data-v="subject">${icon('back',18)}${esc(subj.name)}</button></div>
    <div class="done-screen">
      <span style="color:var(--accent);display:flex">${icon('check',34)}</span>
      <h2>${esc(title)}</h2>
      <p>${line}</p>
      <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;padding-top:6px">
        <button class="btn" id="again">Run it again</button>
        <button class="btn ghost" data-v="subject">Back to ${esc(subj.name)}</button>
      </div>
    </div>
  </div>`;
  on('[data-v]', el => go(el.dataset.v));
  on('#again', () => again());
}

function finishUnit(subj){
  const S = st(subj);
  S.course.done[S.course.u] = true;
  S.course.phase = 'unitdone';
  saveCourse(subj);
  go('unitdone');
}

function renderUnitDone(subj){
  const S = st(subj), c = S.course, u = subj.course[c.u], last = c.u === subj.course.length - 1;
  const key = u.drill.kind === 'det' ? 'det' : (u.drill.kind === 'err' ? 'err' : u.drill.key);
  const s = S.stats[key];
  const line = u.drill.kind === 'det'
    ? `Names correct <b>${s.label}</b> &middot; routes correct <b>${s.frame}</b> of <b>${s.n}</b>.`
    : (u.drill.kind === 'err' ? `All ${subj.errDrill.length} faults reviewed.`
                              : `<b>${s.ok}</b> correct of <b>${s.n}</b> answered.`);

  screenEl().innerHTML = `<div class="pane" style="--accent:${subj.accent}">
    <div class="topbar"><button class="back" data-v="subject">${icon('back',18)}${esc(subj.name)}</button></div>
    <div class="done-screen">
      <span style="color:var(--accent);display:flex">${icon('check',34)}</span>
      <h2>Unit ${esc(u.tag)} complete</h2>
      <p>${line}</p>
      <div class="segs" style="width:100%;max-width:300px">${subj.course.map((_,i) =>
        `<i class="${c.done[i]?'on':''}"></i>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;padding-top:6px">
        ${last ? '' : `<button class="btn" id="on">Continue to Unit ${esc(subj.course[c.u+1].tag)}${icon('arrow')}</button>`}
        <button class="btn ghost" id="redo">Redo the drill</button>
        <button class="btn ghost" id="reread">Reread the lesson</button>
      </div>
      ${last ? `<p style="padding-top:8px">Every unit is run. The reference keeps all of it, plus where this key stops.</p>` : ''}
    </div>
  </div>`;

  on('[data-v]', el => go(el.dataset.v));
  on('#on', () => { c.u++; c.card = 0; c.phase = 'read'; saveCourse(subj); go('lesson'); });
  on('#redo', () => startUnitDrill(subj));
  on('#reread', () => { c.card = 0; c.phase = 'read'; saveCourse(subj); go('lesson'); });
}

/* ===================== REFERENCE ===================== */

function renderReference(subj){
  const units = APP.refMode !== 'caveats';
  screenEl().innerHTML = `<div class="pane read" style="--accent:${subj.accent}">
    <div class="topbar"><button class="back" data-v="subject">${icon('back',18)}${esc(subj.name)}</button></div>
    <div class="eyebrow-row">
      <span class="m a">${esc(subj.name)}</span>
      <h1>${units ? 'Reference' : 'Where this key stops'}</h1>
    </div>
    ${units
      ? subj.course.map(u => `<details class="fg"><summary>Unit ${esc(u.tag)} &mdash; ${esc(u.title)}
          <span class="ar" style="display:flex">${icon('chevron',16)}</span></summary>
          <div class="fg-body lesson">${u.cards.map(c => `<h3>${esc(c.h)}</h3>${c.b}`).join('')}</div></details>`).join('')
      : `<div class="lesson">${subj.caveats}</div>`}
  </div>`;
  on('[data-v]', el => go(el.dataset.v));
}

/* ===================== MIXED DRILL ===================== */

const MIXED = storageLoad('pl:mixed', {n:0, ok:0});

function buildMixed(n){
  const pool = [];
  SUBJECTS.forEach(s => s.quickDrills.forEach(q => q.items.forEach(it => pool.push({s, q, it}))));
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return {items: pool.slice(0, Math.min(n, pool.length)), i:0, picked:null, n:0, ok:0};
}

function renderMixed(){
  if(!APP.mixed) APP.mixed = buildMixed(12);
  const M = APP.mixed;

  if(M.i >= M.items.length){
    screenEl().innerHTML = `<div class="pane">
      <div class="topbar"><span class="m">Mixed drill</span></div>
      <div class="done-screen">
        <span style="color:var(--accent);display:flex">${icon('check',34)}</span>
        <h2>Round complete</h2>
        <p><b>${M.ok}</b> correct of <b>${M.n}</b>, drawn from ${SUBJECTS.length} subjects. Lifetime: ${MIXED.ok}/${MIXED.n}.</p>
        <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;padding-top:6px">
          <button class="btn" id="again">New round</button>
          <button class="btn ghost" data-v="library">Back to the library</button>
        </div>
      </div></div>`;
    on('#again', () => { APP.mixed = buildMixed(12); render(); });
    on('[data-v]', el => go(el.dataset.v));
    return;
  }

  const {s: subj, q, it} = M.items[M.i];
  const ans = answerOf(q, it), answered = M.picked !== null, ok = answered && M.picked === ans;

  screenEl().innerHTML = `<div class="pane" style="--accent:${subj.accent}">
    <div class="topbar">
      <span class="m">Mixed drill</span>
      <span class="m s">${pad2(M.i+1)} / ${M.items.length}</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:18px 0 14px">
      <span class="sigil" style="width:26px;height:26px;flex:0 0 26px;font-size:10px">${subj.keyNo}</span>
      <span class="m a">${esc(subj.name)} &middot; ${esc(q.title)}</span>
    </div>
    <blockquote class="passage ${q.plain?'plain':''}">${esc(it.q)}</blockquote>
    <div style="display:flex;flex-direction:column;gap:12px">
      <span class="m">${esc(q.prompt)}</span>
      <div class="opts" id="opts">${q.opts.map(o =>
        `<button class="opt ${M.picked===o?'sel':''}" data-o="${esc(o)}" ${answered?'disabled':''}>${esc(o)}</button>`).join('')}</div>
    </div>
    ${answered ? `<div style="display:flex;flex-direction:column;gap:18px;padding-top:22px">
      <div class="marks"><span class="mark ${ok?'':'no'}">${icon(ok?'check':'cross',13)}${ok?'Correct':'Missed &mdash; ' + esc(ans)}</span></div>
      <div class="vblock"><span class="m">Why</span><p>${esc(it.w)}</p></div>
    </div>` : ''}
    <div class="score">
      <span class="stat"><b>${M.n}</b><span>This round</span></span>
      <span class="stat"><b>${M.ok}</b><span>Correct</span></span>
      <span class="stat"><b>${MIXED.n ? MIXED.ok + '/' + MIXED.n : '&mdash;'}</b><span>Lifetime</span></span>
    </div>
    ${answered ? `<div class="actbar"><button class="btn" id="next">${M.i===M.items.length-1?'Finish':'Next item'}${icon('arrow')}</button></div>` : ''}
  </div>`;

  on('#opts .opt', el => {
    if(M.picked !== null) return;
    M.picked = el.dataset.o; M.n++; MIXED.n++;
    if(M.picked === ans){ M.ok++; MIXED.ok++; }
    storageSave('pl:mixed', MIXED);
    render();
  });
  on('#next', () => { M.i++; M.picked = null; render(); window.scrollTo(0,0); });
}

/* ===================== PROGRESS ===================== */

function renderProgress(){
  const totalUnits = SUBJECTS.reduce((a,s) => a + s.course.length, 0);
  const doneUnits  = SUBJECTS.reduce((a,s) => a + unitsDone(s), 0);
  const det = SUBJECTS.reduce((a,s) => { const d = st(s).stats.det; a.n += d.n; a.label += d.label; a.frame += d.frame; return a; }, {n:0,label:0,frame:0});

  screenEl().innerHTML = `<div class="pane">
    <div class="topbar"><span class="m">Progress</span></div>
    <div class="mast">
      <h1>${doneUnits} of ${totalUnits}</h1>
      <p>units run across ${numWord(SUBJECTS.length)} subject${SUBJECTS.length===1?'':'s'}. Determinations are the measure that matters &mdash; a name is only earned when the route is too.</p>
    </div>
    <div class="block"><div class="card">
      <span class="m a">Determinations</span>
      <div class="statrow" style="border-top:none;padding-top:0">
        <span class="stat"><b>${det.n}</b><span>Recorded</span></span>
        <span class="stat"><b style="color:${det.label?'var(--green)':'inherit'}">${det.label}</b><span>Name right</span></span>
        <span class="stat"><b style="color:${det.frame?'var(--green)':'inherit'}">${det.frame}</b><span>Route right</span></span>
        <span class="stat"><b>${det.n ? Math.round(100*det.frame/det.n) + '%' : '&mdash;'}</b><span>Both</span></span>
      </div>
    </div></div>
    <div class="sect"><span class="m">By subject</span><span class="m s">${MIXED.n ? 'Mixed: ' + MIXED.ok + '/' + MIXED.n : ''}</span></div>
    <div class="rows">${SUBJECTS.map(s => {
      const S = st(s), scored = s.quickDrills.map(q => S.stats[q.key]).filter(x => x.n);
      const ok = scored.reduce((a,x) => a + x.ok, 0), n = scored.reduce((a,x) => a + x.n, 0);
      return `<button class="row" data-s="${s.id}" style="--accent:${s.accent}">
        <span class="sigil">${s.keyNo}</span>
        <span class="grow">
          <span class="t">${esc(s.name)}</span>
          <span class="s">${unitsDone(s)}/${s.course.length} units &middot; drills ${n ? ok + '/' + n : '&mdash;'} &middot; det ${S.stats.det.n}/${s.specimens.length}</span>
          <span class="segs" style="margin-top:6px">${s.course.map((_,i) =>
            `<i class="${S.course.done[i]?'on':''}"></i>`).join('')}</span>
        </span>
        ${icon('chevron')}
      </button>`;
    }).join('')}</div>
  </div>`;
  on('[data-s]', el => openSubject(el.dataset.s));
}

/* ===================== SEARCH ===================== */

let INDEX = null;
function searchIndex(){
  if(INDEX) return INDEX;
  INDEX = [];
  SUBJECTS.forEach(s => {
    INDEX.push({g:'Subjects', s, t:s.name, sub:`${s.course.length} units · ${s.quickDrills.length} drills`,
      go:() => openSubject(s.id)});
    s.course.forEach((u,i) => INDEX.push({g:'Units', s, t:u.title,
      sub:`${s.name} · Unit ${u.tag} · ${u.cards.length} cards`, go:() => openUnit(s, i)}));
    s.outcomes.forEach(o => INDEX.push({g:'Tools', s, t:o.n,
      sub:`${s.name} · one of ${s.outcomes.length} outcomes`, go:() => openSubject(s.id)}));
    s.quickDrills.forEach(q => INDEX.push({g:'Drills', s, t:q.title,
      sub:`${s.name} · ${q.items.length} items`,
      go:() => { APP.subjectId = s.id; touch(s.id); go('drill', {drillKey:q.key}); }}));
    s.specimens.forEach((sp,i) => INDEX.push({g:'Specimens', s, t:sp.q, quote:true,
      sub:`${s.name} · specimen ${pad2(i+1)}`,
      go:() => { APP.subjectId = s.id; touch(s.id); st(s).detState = Object.assign(freshDet(), {i}); go('det'); }}));
    s.errDrill.forEach((e,i) => INDEX.push({g:'Faulty claims', s, t:e.q, quote:true,
      sub:`${s.name} · claim ${pad2(i+1)}`,
      go:() => { APP.subjectId = s.id; touch(s.id); st(s).errState = {i, picked:null}; go('err'); }}));
  });
  return INDEX;
}

function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}
const clip = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/,'') + '…' : s;

function renderSearch(){
  screenEl().innerHTML = `<div class="pane">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 0 12px">
      <label class="searchfield live" style="flex-grow:1;min-width:0">${icon('search',16)}
        <input id="q" type="search" placeholder="Search subjects, units, drills" autocomplete="off" spellcheck="false">
      </label>
      <button class="linkbtn" data-v="library" style="font-family:var(--sans);font-size:15px;letter-spacing:0;text-transform:none">Cancel</button>
    </div>
    <div id="results"></div>
  </div>`;
  on('[data-v]', el => go(el.dataset.v));
  const input = document.getElementById('q');
  input.value = APP.query;
  input.oninput = () => { APP.query = input.value; paintResults(); };
  paintResults();
  input.focus();
}

function paintResults(){
  const box = document.getElementById('results');
  if(!box) return;
  const q = APP.query.trim();
  if(!q){
    box.innerHTML = `<p class="empty">Everything is searchable &mdash; subject names, unit titles,
      the tools in each key, drill items and the specimens themselves.</p>`;
    return;
  }
  const hits = searchIndex().filter(e => e.t.toLowerCase().includes(q.toLowerCase()));
  if(!hits.length){ box.innerHTML = `<p class="empty">Nothing matches &ldquo;${esc(q)}&rdquo;.</p>`; return; }

  const order = ['Subjects','Units','Tools','Drills','Specimens','Faulty claims'];
  const groups = order.map(g => [g, hits.filter(h => h.g === g)]).filter(([,list]) => list.length);
  let n = 0;

  box.innerHTML = `<div style="padding:0 0 16px"><span class="m s">${hits.length} result${hits.length===1?'':'s'}
      across ${new Set(hits.map(h => h.s.id)).size} subject${new Set(hits.map(h => h.s.id)).size===1?'':'s'}</span></div>`
    + groups.map(([g, list]) => `<div class="resgroup">
      <span class="m s" style="padding-bottom:6px">${esc(g)}</span>
      ${list.slice(0,6).map(h => {
        const idx = n++;
        return `<button class="res" data-i="${idx}" style="--accent:${h.s.accent}">
          <span class="tag">${h.s.keyNo}</span>
          <span class="grow">
            <span class="t ${h.quote?'q':''}">${h.quote ? '&ldquo;' + hl(clip(h.t,96), q) + '&rdquo;' : hl(h.t, q)}</span>
            <span class="s">${esc(h.sub)}</span>
          </span>
          ${icon('chevron',15)}
        </button>`;
      }).join('')}
      ${list.length > 6 ? `<span class="m s" style="padding:6px 0">+ ${list.length-6} more</span>` : ''}
    </div>`).join('');

  const flat = groups.flatMap(([,list]) => list.slice(0,6));
  on('[data-i]', el => flat[+el.dataset.i].go(), box);
}

/* ===================== INIT ===================== */

document.addEventListener('keydown', e => {
  if(e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); go('search');
  }
  if(e.key === 'Escape' && APP.view === 'search') go('library');
});

render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(err => console.error('Service worker registration failed', err));
}
</script>
