# The test tiers run on every push, where no session can skip a hook: at the pushed head, npm test; and for every commit of the push (a new
# branch's or a force-push's commits are those not on main), the lesson tier measured against that commit's first parent (what "since the
# last commit" means for the lock's history). So a lesson changed or a rule weakened with the hooks off shows on push, merge commits included.
# A push that creates main (an all-zero before) is checked at its head by npm test alone; any other push whose old head is not in the clone
# falls to the range against main.
name: lesson tier
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: each commit against its parent
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then echo "a push that creates main: checked at its head by npm test"; exit 0
          elif [ -n "$BEFORE" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD; then RANGE="$BEFORE..HEAD"
          else RANGE="$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)..HEAD"; fi
          echo "checking $RANGE"
          COMMITS=$(git rev-list --reverse "$RANGE") || { echo "the range cannot be listed"; exit 1; }
          if [ -z "$COMMITS" ]; then
            if [ "${{ github.event.forced }}" = "true" ]; then echo "a forced push after which nothing is new against main: history was rewritten, and nothing was checked"; exit 1; fi
            echo "nothing new to check"; exit 0
          fi
          for c in $COMMITS; do
            git checkout -q "$c"
            parent=$(git rev-parse -q --verify "$c^" || true)
            echo "== $c against ${parent:-nothing}"
            if [ -n "$parent" ]; then node tests/validate-lessons.mjs --base "$parent"; else node tests/validate-lessons.mjs; fi
            node tests/lessons/negative-controls.mjs >/dev/null
          done
