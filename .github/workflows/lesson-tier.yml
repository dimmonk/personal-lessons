# The fast tiers run on every push, where no session can skip a hook: at the pushed head, npm test; and for every commit of the push (a new
# branch's or a force-push's commits are those not on main), the lesson tier measured against that commit's first parent (what "since the
# last commit" means) and the owner's word on a commit that changes the gates. So an ask removed, an owner entry edited, a record deleted or
# a gate changed with the hooks off shows on push, merge commits included (build-subject skill, "How it runs").
name: lesson tier
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: each commit against its parent, with the owner's word where the gates changed
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "$BEFORE" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD; then RANGE="$BEFORE..HEAD"
          else RANGE="$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)..HEAD"; fi
          echo "checking $RANGE"
          for c in $(git rev-list --reverse "$RANGE"); do
            git checkout -q "$c"
            parent=$(git rev-parse -q --verify "$c^" || true)
            echo "== $c against ${parent:-nothing}"
            if [ -n "$parent" ]; then node tests/validate-lessons.mjs --base "$parent"; else node tests/validate-lessons.mjs; fi
            node tests/lessons/negative-controls.mjs >/dev/null
            node tests/design-pure.mjs >/dev/null
            git show -s --format=%B "$c" > /tmp/msg && node tools/design/owner-line.mjs /tmp/msg --commit "$c"
          done
