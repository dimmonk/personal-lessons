# The fast tiers run on every push, where no session can skip a hook: at the pushed head, npm test; and for every commit of the push (a new
# branch's or a force-push's commits are those not on main; commits from before the commit where the gates start are skipped), the lesson
# tier measured against that commit's first parent (what "since the last commit" means) and the owner's word on a commit that changes the
# gates, read with the copy of the check that main held (never the pushed commit's). So an ask removed, an owner entry edited, a record
# deleted or a gate changed with the hooks off shows on push, merge commits included; a merge of more than two parents is refused
# (build-subject skill, "How it runs").
name: lesson tier
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: each commit against its parent, with the owner's word where the gates changed
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "$BEFORE" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD; then RANGE="$BEFORE..HEAD"
          else RANGE="$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)..HEAD"; fi
          echo "checking $RANGE"
          COMMITS=$(git rev-list --reverse "$RANGE") || { echo "the range cannot be listed"; exit 1; }
          if [ -z "$COMMITS" ]; then
            if [ "${{ github.event.forced }}" = "true" ]; then echo "a forced push after which nothing is new against main: history was rewritten, and nothing was checked"; exit 1; fi
            echo "nothing new to check"; exit 0
          fi
          # the gates start at this commit (the record tools, --base and the owner-line check). A commit that is its ancestor predates
          # them and is checked by npm test at the head only; the start itself and its descendants are checked here; a commit that is
          # neither (a fork from before the gates) fails. The owner-line check is never a commit's own copy: it is the copy on the branch
          # before this push (what main held), or the start's when that has none.
          GATES_START=21da9cf36e71329fea154dcaf51721ab8539c8d2
          git rev-parse -q --verify "$GATES_START^{commit}" >/dev/null || { echo "the commit where the gates start is not in this clone"; exit 1; }
          # the copy of the check that judges this push: on a push to main, what main held before it (BEFORE); on any other push or a pull
          # request, main's; the start commit's when that ref has none. Never the pushed head's.
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then CHECK_REF="$BEFORE"; else CHECK_REF="origin/main"; fi
          # when that ref has no copy (the landing push of the gates), the fallback is the named commit whose readings are the current ones
          FALLBACK_CHECK=2d0027d
          git rev-parse -q --verify "$CHECK_REF^{commit}" >/dev/null 2>&1 && git cat-file -e "$CHECK_REF:tools/design/owner-line.mjs" 2>/dev/null || CHECK_REF="$FALLBACK_CHECK"
          git show "$CHECK_REF:tools/design/owner-line.mjs" > /tmp/owner-line.mjs
          echo "the owner-line check is the copy at $CHECK_REF"
          for c in $COMMITS; do
            git checkout -q "$c"
            if [ "$c" != "$GATES_START" ] && git merge-base --is-ancestor "$c" "$GATES_START"; then echo "== $c predates the gates: skipped"; continue; fi
            git merge-base --is-ancestor "$GATES_START" "$c" || { echo "== $c is neither before nor after the commit where the gates start: a fork from before the gates is rebased or dropped"; exit 1; }
            parent=$(git rev-parse -q --verify "$c^" || true)
            echo "== $c against ${parent:-nothing}"
            if [ -n "$parent" ]; then node tests/validate-lessons.mjs --base "$parent"; else node tests/validate-lessons.mjs; fi
            node tests/lessons/negative-controls.mjs >/dev/null
            node tests/design-pure.mjs >/dev/null
            git show -s --format=%B "$c" > /tmp/msg
            BROUGHT=""
            if [ "$(git rev-list --parents -n 1 "$c" | wc -w)" -gt 3 ]; then echo "== $c is a merge of more than two parents: refused; merge one branch at a time"; exit 1; fi
            if [ "$(git rev-list --parents -n 1 "$c" | wc -w)" -gt 2 ]; then
              for b in $(git rev-list "$parent..$c"); do if ! git merge-base --is-ancestor "$GATES_START" "$b"; then BROUGHT="--brought $parent"; break; fi; done
            fi
            node /tmp/owner-line.mjs /tmp/msg --commit "$c" $BROUGHT
          done
