<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#d5d9d1; --sheet:#f3f2ed; --sheet-2:#e9e8e1;
  --ink:#14181d; --ink-soft:#4c545a; --rule:#aab0a6; --rule-fine:#c6cabf;
  --brass:#7a6636; --herb:#3a5c46; --iron:#8c3a2e;
  --shadow:0 1px 0 rgba(20,24,29,.10), 0 10px 24px -18px rgba(20,24,29,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--board);
  background-image:linear-gradient(rgba(20,24,29,.025) 1px,transparent 1px);
  background-size:100% 3px;
  color:var(--ink); font-family:'Spectral',Georgia,serif; font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px}

.mast{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.mast .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.mast h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:clamp(25px,5.8vw,37px);
  line-height:1.02;margin:0;letter-spacing:-.015em}
.mast p{margin:8px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:52ch}
.mast .eyebrow{max-width:none}

/* ---------- shelf (subject library) ---------- */
.shelf{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:18px 0 0}
.card{display:flex;flex-direction:column;gap:9px;text-align:left;cursor:pointer;
  background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);
  padding:16px 16px 14px;border-radius:3px;font:inherit;color:inherit;
  transition:transform .16s ease, box-shadow .16s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(20,24,29,.10),0 16px 30px -18px rgba(20,24,29,.6)}
.card .c-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);display:flex;justify-content:space-between;gap:10px}
.card .c-title{display:block;font-family:'Zilla Slab',serif;font-weight:700;font-size:22px;line-height:1.08;letter-spacing:-.01em}
.card .c-blurb{display:block;font-size:14.5px;color:var(--ink-soft);line-height:1.45}
.card .c-topics{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;
  color:var(--ink-soft);opacity:.8;line-height:1.5}
.card .c-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule-fine);
  display:flex;align-items:center;gap:10px}
.meter{flex:1;height:4px;background:var(--sheet-2);border:1px solid var(--rule-fine);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--herb)}
.card .c-prog{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.card .c-go{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600;white-space:nowrap}
.shelf-note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-soft);margin:18px 0 0;text-align:center}

/* ---------- subject header ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:2px}
.topbar .t-left{min-width:0}
.topbar h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:clamp(22px,5vw,30px);
  line-height:1.05;margin:2px 0 0;letter-spacing:-.015em}
.topbar .t-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin:0}
.backlink{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink-soft);
  cursor:pointer;border-radius:3px;padding:7px 11px}
.backlink:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:nowrap;gap:5px;margin:12px 0 11px;overflow-x:auto;
  padding:2px 1px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{height:0}
.tabs.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 38px),transparent 100%);
  mask-image:linear-gradient(to right,#000 calc(100% - 38px),transparent 100%)}
.tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 26px,#000 calc(100% - 38px),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 26px,#000 calc(100% - 38px),transparent 100%)}
.tabs.fade-l:not(.fade-r){-webkit-mask-image:linear-gradient(to right,transparent 0,#000 26px);
  mask-image:linear-gradient(to right,transparent 0,#000 26px)}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 11px 7px;border:1px solid var(--rule);background:var(--sheet-2);white-space:nowrap;
  color:var(--ink-soft);cursor:pointer;border-radius:3px;flex:0 0 auto}
.tab:hover{background:var(--sheet);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet);font-weight:600;border-color:var(--ink)}

.sheet{background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);
  padding:20px 18px 22px;border-radius:3px}

.ladder{display:flex;gap:0;margin:0 0 20px;border:1px solid var(--rule-fine);border-radius:2px;overflow:hidden;flex-wrap:wrap}
.rung{flex:1;padding:7px 4px 6px;text-align:center;background:var(--sheet-2);min-width:60px;
  border-right:1px solid var(--rule-fine);font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;line-height:1.3}
.rung:last-child{border-right:none}
.rung b{display:block;font-size:12px;color:var(--ink);font-weight:600}
.rung:hover{background:var(--sheet)}
.rung.now{background:var(--ink);color:var(--sheet)}
.rung.now b{color:var(--sheet)}
.rung.done b::after{content:' \2713';color:var(--herb)}
.rung.now.done b::after{color:#9fd0b0}

.crumb{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule-fine);padding-bottom:8px;margin-bottom:16px}
.crumb .where{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.crumb .of{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}

.lesson h2{font-family:'Zilla Slab',serif;font-size:clamp(21px,4.6vw,27px);margin:0 0 12px;letter-spacing:-.01em;line-height:1.12}
.lesson h3{font-family:'Zilla Slab',serif;font-size:17px;margin:18px 0 6px}
.lesson p{margin:0 0 12px}
.lesson ul,.lesson ol{margin:0 0 12px;padding-left:19px}
.lesson li{margin-bottom:6px}
.lesson .lead{font-size:18px;color:var(--ink)}
.tell{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--brass);display:block;margin-top:5px}
.warn{border:1px solid rgba(140,58,46,.35);background:rgba(140,58,46,.07);border-radius:3px;padding:12px 14px;margin:14px 0}
.warn strong{color:var(--iron)}
.note{border:1px solid rgba(122,102,54,.3);background:rgba(122,102,54,.08);border-radius:3px;padding:12px 14px;margin:14px 0}
table.k{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
table.k th,table.k td{border:1px solid var(--rule-fine);padding:8px 9px;text-align:left;vertical-align:top}
table.k th{background:var(--sheet-2);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}

.dots{display:flex;gap:5px;margin:18px 0 0}
.dot{width:22px;height:3px;background:var(--rule);border-radius:2px}
.dot.on{background:var(--ink)}

.spec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule-fine);padding-bottom:8px;margin-bottom:16px}
.spec-no{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.spec-set{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}

blockquote.passage{margin:0 0 20px;padding:14px 16px;background:var(--sheet-2);border-radius:3px;
  font-size:18px;line-height:1.6;font-style:italic}
blockquote.passage.plain{font-style:normal;font-size:17px}
.step{margin:0 0 18px}
.step.locked{opacity:.55;pointer-events:none}
.step-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--brass);display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.step-label .code{background:var(--ink);color:var(--sheet);padding:2px 5px;border-radius:2px;font-weight:600;letter-spacing:.06em}
.step-label .num{width:19px;height:19px;flex:0 0 19px;border-radius:50%;background:var(--brass);color:var(--sheet);
  display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:10.5px;letter-spacing:0}
.step.locked .step-label .num{background:var(--rule)}
.lockmsg{margin-left:auto;font-style:normal;color:var(--ink-soft);letter-spacing:.06em;border:1px dashed var(--rule);
  padding:2px 7px;border-radius:2px;text-transform:none;font-size:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-family:'Zilla Slab',serif;font-size:14.5px;font-weight:500;padding:8px 12px;
  background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink);cursor:pointer;
  border-radius:2px;text-align:left;line-height:1.25}
.opt:hover{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.05em;
  opacity:.62;font-weight:400;margin-top:2px;text-transform:uppercase}

.intro{border:1px solid var(--ink);background:var(--sheet-2);padding:15px 15px 13px;margin:0 0 18px;border-radius:2px}
.intro h2{font-family:'Zilla Slab',serif;font-size:17px;margin:0 0 9px}
.intro ol{margin:0 0 10px;padding-left:19px;font-size:15px}
.intro ol li{margin-bottom:5px}
.intro p{margin:0 0 10px;font-size:14.5px;color:var(--ink-soft)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--brass);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

.rail{border:1px solid var(--rule);background:var(--sheet-2);padding:12px 13px;margin:0 0 18px;
  border-radius:2px;cursor:default;user-select:none}
.rail-head{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rail-count{color:var(--brass);font-weight:600}
.cands{display:flex;flex-wrap:wrap;gap:5px 9px;margin:0;padding:0;list-style:none}
.cand{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);transition:color .28s ease,opacity .28s ease}
.cand.out{color:var(--ink-soft);opacity:.4;text-decoration:line-through;text-decoration-thickness:1px}

.verdict{border-top:2px solid var(--ink);margin-top:20px;padding-top:16px}
.verdict h3{font-family:'Zilla Slab',serif;font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.mark{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;border:1px solid}
.mark.ok{color:var(--herb);border-color:var(--herb);background:rgba(58,92,70,.07)}
.mark.no{color:var(--iron);border-color:var(--iron);background:rgba(140,58,46,.07)}
.vblock{margin:0 0 12px}
.vlab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brass);margin-bottom:3px}
.vblock p{margin:0;font-size:16px;line-height:1.55}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:11px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);
  cursor:pointer;border-radius:2px}
.btn:hover{background:#000}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sheet-2)}

.score{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  border-top:1px solid var(--rule-fine);margin-top:18px;padding-top:11px}
.score b{color:var(--ink);font-weight:600}
.hint{font-size:14px;color:var(--ink-soft);margin:10px 0 0}
.done{text-align:center;padding:22px 6px}
.done h2{font-family:'Zilla Slab',serif;font-size:24px;margin:0 0 8px}
.done p{color:var(--ink-soft);max-width:46ch;margin:0 auto 8px;font-size:15.5px}

details.fg{border-bottom:1px solid var(--rule-fine)}
details.fg:last-of-type{border-bottom:none}
details.fg summary{cursor:pointer;padding:13px 2px;font-family:'Zilla Slab',serif;font-weight:600;
  font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fg summary::-webkit-details-marker{display:none}
details.fg summary::after{content:'+';font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:16px}
details.fg[open] summary::after{content:'\2212'}
.fg-body{padding:0 2px 16px;font-size:15.5px}
.fg-body p{margin:0 0 10px}
.fg-body ul{margin:0 0 10px;padding-left:18px}
.fg-body li{margin-bottom:5px}
.fg-body h4{font-family:'Zilla Slab',serif;font-size:15.5px;margin:16px 0 5px}

:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .wrap{padding:16px 12px 80px}
  .sheet{padding:16px 13px 18px}
  blockquote.passage{font-size:16.5px;padding-left:13px}
  .opt{font-size:14px;padding:8px 10px}
  .rung{font-size:8.5px;padding:6px 2px}
  .rung b{font-size:11px}
  table.k{font-size:13.5px}
  table.k th,table.k td{padding:6px 7px}
  .shelf{grid-template-columns:1fr;gap:10px}
  .card{padding:14px 14px 12px}
  .card .c-title{font-size:20px}
  .mast h1{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <main id="stage"></main>
</div>

<script>
/* ===================== SHARED ENGINE ===================== */

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage = () => document.getElementById('stage');

function storageSave(key, obj){
  try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){}
}
function storageLoad(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return Object.assign(fallback, JSON.parse(raw));
  }catch(e){}
  return fallback;
}

/* ---- generic pick drill ---- */
function pickAnswerOf(it, cfg){ return cfg.answer ? cfg.answer(it) : it.a; }

function mountPickDrill(hostEl, cfg, state, onAllDone){
  if(state.i >= cfg.items.length) return onAllDone();
  const it = cfg.items[state.i], st = state.stats;

  hostEl.innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Item ${String(state.i+1).padStart(2,'0')} / ${cfg.items.length}</span>
      <span class="spec-set">${esc(cfg.title)}</span>
    </div>
    <blockquote class="passage ${cfg.plain?'plain':''}">${esc(it.q)}</blockquote>
    <div class="step ${state.picked!==null?'locked':''}">
      <div class="step-label"><span class="code">?</span> ${esc(cfg.prompt)}</div>
      <div class="opts" id="pickOpts">
        ${cfg.opts.map(o=>`<button class="opt" data-v="${esc(o)}" aria-pressed="${state.picked===o}">${esc(o)}</button>`).join('')}
      </div>
    </div>
    ${state.picked!==null ? `
      <div class="verdict">
        <div class="marks"><span class="mark ${state.picked===pickAnswerOf(it,cfg)?'ok':'no'}">${state.picked===pickAnswerOf(it,cfg)?'Correct':'Missed — '+esc(pickAnswerOf(it,cfg))}</span></div>
        <div class="vblock"><div class="vlab">Why</div><p>${esc(it.w)}</p></div>
        <div class="row"><button class="btn" id="pickNext">${state.i===cfg.items.length-1?'Finish':'Next item'}</button></div>
      </div>` : ''}
    <div class="score"><span>Answered <b>${st.n}</b></span><span>Correct <b>${st.ok}</b></span></div>`;

  hostEl.querySelectorAll('#pickOpts .opt').forEach(b=>b.onclick=()=>{
    state.picked = b.dataset.v;
    st.n++; if(state.picked===pickAnswerOf(it,cfg)) st.ok++;
    if(cfg.storageKey) storageSave(cfg.storageKey, state.stats);
    mountPickDrill(hostEl, cfg, state, onAllDone);
  });
  const nx = hostEl.querySelector('#pickNext');
  if(nx) nx.onclick=()=>{ state.i++; state.picked=null; mountPickDrill(hostEl, cfg, state, onAllDone); };
}

/* ---- generic faulty-claims drill ---- */
function mountErrDrill(hostEl, items, state, storageKey, onAllDone){
  if(state.i >= items.length) return onAllDone();
  const it = items[state.i];

  hostEl.innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Claim ${String(state.i+1).padStart(2,'0')} / ${items.length}</span>
      <span class="spec-set">Faulty claims</span>
    </div>
    <blockquote class="passage">${esc(it.q)}</blockquote>
    <p class="hint" style="margin-bottom:14px">State the fault out loud or in writing before revealing. Name which diagnostic question the claim fails to engage.</p>
    ${state.picked ? `<div class="verdict"><div class="vblock"><div class="vlab">The fault</div><p>${esc(it.w)}</p></div>
      <div class="row"><button class="btn" id="errNext">${state.i===items.length-1?'Finish':'Next claim'}</button></div></div>`
    : `<div class="row"><button class="btn" id="errShow">Show the fault</button></div>`}`;

  const sh = hostEl.querySelector('#errShow');
  if(sh) sh.onclick=()=>{ state.picked='x'; state.stats.seen++; storageSave(storageKey, state.stats); mountErrDrill(hostEl, items, state, storageKey, onAllDone); };
  const nx = hostEl.querySelector('#errNext');
  if(nx) nx.onclick=()=>{ state.i++; state.picked=null; mountErrDrill(hostEl, items, state, storageKey, onAllDone); };
}

/* ---- generic determination engine ----
 * A subject's `determination` describes its diagnostic-question flow:
 *   { gateCode: null | 'D1',
 *     steps: [ {code,label,options:[{id,n,sub?,keeps}]} , ... ],   // always active
 *     stepsByGate: null | { [gateOptionId]: [ {code,label,options} , ... ] } }
 * Subjects with no gate (flat multi-question keys, e.g. political ideologies)
 * set gateCode:null and put every question in `steps`.
 * Subjects with a gate (branching keys, e.g. psychology) put just the gate
 * question in `steps` and the per-branch follow-ups in `stepsByGate`.
 * Specimens store answers as `sub:{ [stepCode]: [acceptableAnswerIds] }`,
 * covering the gate code too when there is one.
 */

function outcomeName(subject, id){ return subject.outcomes.find(o=>o.id===id).n; }

function detActiveSteps(subject, state){
  const d = subject.determination;
  if(!d.gateCode) return d.steps;
  const gateAns = state.answers[d.gateCode];
  const extra = gateAns ? (d.stepsByGate[gateAns]||[]) : [];
  return [...d.steps, ...extra];
}

function detCandidates(subject, state){
  let live = subject.outcomes.map(o=>o.id);
  detActiveSteps(subject, state).forEach(step=>{
    const ans = state.answers[step.code];
    if(!ans) return;
    const opt = step.options.find(o=>o.id===ans);
    if(opt && opt.keeps) live = live.filter(id=>opt.keeps.includes(id));
  });
  return live;
}

function detReady(subject, state){
  const steps = detActiveSteps(subject, state);
  return steps.length>0 && steps.every(step=>state.answers[step.code]);
}

function nameOptions(subject, state){
  const d = subject.determination;
  if(!d.gateCode) return subject.outcomes;
  const gateAns = state.answers[d.gateCode];
  return subject.outcomes.filter(o=>o.group===gateAns);
}

function correctSteps(subject, sp){
  const d = subject.determination;
  if(!d.gateCode) return d.steps;
  const gateWant = sp.sub[d.gateCode];
  const extra = (gateWant && d.stepsByGate[gateWant[0]]) || [];
  return [...d.steps, ...extra];
}

function detStepsHTML(subject, state){
  const steps = detActiveSteps(subject, state);
  let html = '';
  steps.forEach((step, idx)=>{
    const unlocked = idx===0 ? true : !!state.answers[steps[idx-1].code];
    html += `<div class="step ${unlocked?'':'locked'} ${state.revealed?'locked':''}">
      <div class="step-label"><span class="num">${idx+1}</span><span class="code">${esc(step.code)}</span> ${esc(step.label)}${unlocked?'':'<span class="lockmsg">Answer the previous step to unlock</span>'}</div>
      <div class="opts" data-step="${step.code}">${step.options.map(o=>
        `<button class="opt" data-v="${o.id}" aria-pressed="${state.answers[step.code]===o.id}">${esc(o.n)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</button>`).join('')}</div>
    </div>`;
  });
  const ready = detReady(subject, state);
  html += `<div class="step ${ready?'':'locked'} ${state.revealed?'locked':''}">
    <div class="step-label"><span class="num">${steps.length+1}</span><span class="code">ID</span> Name it${ready?'':'<span class="lockmsg">Answer the previous step to unlock</span>'}</div>
    <div class="opts" id="outcomeOpts">${nameOptions(subject,state).map(o=>
      `<button class="opt" data-o="${o.id}" aria-pressed="${state.outcome===o.id}">${esc(o.n)}</button>`).join('')}</div>
  </div>`;
  return html;
}

function detVerdictHTML(subject, sp, state){
  const steps = correctSteps(subject, sp);
  const routeOk = steps.every(step => (sp.sub[step.code]||[]).includes(state.answers[step.code]));
  const okO = state.outcome === sp.outcome;
  const name = outcomeName(subject, sp.outcome);

  const wantLine = () => {
    if(routeOk) return '';
    const bad = steps.find(step => !(sp.sub[step.code]||[]).includes(state.answers[step.code]));
    if(!bad) return '';
    const opts = bad.options.filter(o=>(sp.sub[bad.code]||[]).includes(o.id)).map(o=>o.n);
    return ' → ' + esc(opts.join(' or '));
  };

  return `<div class="verdict">
    <h3>${esc(name)}</h3>
    <div class="marks">
      <span class="mark ${okO?'ok':'no'}">Name ${okO?'correct':'missed'}</span>
      <span class="mark ${routeOk?'ok':'no'}">Route ${routeOk?'correct':'missed'+wantLine()}</span>
    </div>
    ${(okO && !routeOk) ? `<div class="warn"><strong>Right name, wrong route.</strong> Scored as a miss. A label you can’t derive from the diagnostic questions won’t survive an unfamiliar situation.</div>` : ''}
    <div class="vblock"><div class="vlab">Why</div><p>${esc(sp.why)}</p></div>
    <div class="vblock"><div class="vlab">${esc(subject.falsLabel || 'What would falsify this reading')}</div><p>${esc(sp.fals)}</p></div>
    <div class="row"><button class="btn" id="detNext">Next specimen</button></div>
  </div>`;
}

function mountDetermination(subject, hostEl, state, storageKey, onAllDone){
  const specimens = subject.specimens;
  if(state.i >= specimens.length) return onAllDone();
  const sp = specimens[state.i];
  const live = detCandidates(subject, state);
  const st = state.stats;

  hostEl.innerHTML = `
    ${state.intro ? `<div class="intro">
      <h2>How this works</h2>
      ${subject.determinationIntro}
      <div class="row" style="margin-top:4px"><button class="btn" id="introGo">Start</button></div>
    </div>` : ''}
    <div class="spec-head">
      <span class="spec-no">Specimen ${String(state.i+1).padStart(2,'0')} / ${specimens.length}</span>
      ${state.intro ? '<span class="spec-set">Full determination</span>' : '<button class="linkbtn" id="introOpen">How this works</button>'}
    </div>
    <blockquote class="passage">${esc(sp.q)}</blockquote>

    <div class="rail">
      <div class="rail-head"><span>Readout · updates automatically · nothing to tap</span><span class="rail-count">${live.length} of ${subject.outcomes.length} left</span></div>
      <ul class="cands">${subject.outcomes.map(o=>`<li class="cand ${live.includes(o.id)?'':'out'}">${esc(o.n)}</li>`).join('')}</ul>
    </div>

    ${detStepsHTML(subject, state)}

    ${state.revealed ? detVerdictHTML(subject, sp, state) : `
      <div class="row">
        <button class="btn" id="detRecord" ${state.outcome?'':'disabled'}>Record determination</button>
        <button class="btn ghost" id="detSkip">Skip</button>
      </div>
      <p class="hint">Answer every step above, then name it. Right name by the wrong route counts as a miss.</p>`}

    <div class="score">
      <span>Determined <b>${st.n}</b></span>
      <span>Name correct <b>${st.label}</b></span>
      <span>Route correct <b>${st.frame}</b></span>
    </div>`;

  hostEl.querySelectorAll('[data-step] .opt').forEach(b=>b.onclick=(e)=>{
    const code = e.currentTarget.parentElement.dataset.step;
    const d = subject.determination;
    state.answers[code] = b.dataset.v;
    state.outcome = null;
    if(d.gateCode === code){
      state.answers = { [code]: state.answers[code] };
    }
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  });
  const outcomeOpts = hostEl.querySelector('#outcomeOpts');
  if(outcomeOpts) outcomeOpts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    state.outcome = b.dataset.o;
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  });

  const ig = hostEl.querySelector('#introGo');
  if(ig) ig.onclick = ()=>{
    state.intro=false;
    try{ localStorage.setItem(storageKey+':intro','done'); }catch(e){}
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  };
  const io = hostEl.querySelector('#introOpen');
  if(io) io.onclick = ()=>{ state.intro=true; mountDetermination(subject, hostEl, state, storageKey, onAllDone); };

  const rv = hostEl.querySelector('#detRecord');
  if(rv) rv.onclick = ()=>{
    const steps = correctSteps(subject, sp);
    const routeOk = steps.every(step => (sp.sub[step.code]||[]).includes(state.answers[step.code]));
    const okO = state.outcome === sp.outcome;
    st.n++; if(okO) st.label++; if(routeOk) st.frame++;
    state.revealed = true; storageSave(storageKey, st);
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  };
  const sk = hostEl.querySelector('#detSkip');
  if(sk) sk.onclick = ()=>{ nextSpecimen(state); mountDetermination(subject, hostEl, state, storageKey, onAllDone); };
  const nxBtn = hostEl.querySelector('#detNext');
  if(nxBtn) nxBtn.onclick = ()=>{ nextSpecimen(state); mountDetermination(subject, hostEl, state, storageKey, onAllDone); };
}

function nextSpecimen(state){ state.i++; state.answers={}; state.outcome=null; state.revealed=false; }
function introSeen(storageKey){
  try{ return localStorage.getItem(storageKey+':intro')==='done'; }catch(e){ return false; }
}

  {h:'A definition with actual content',
   b:`<p class="lead">A mass, anti-liberal, anti-Marxist movement organised around a myth of national decline and rebirth, pursuing regeneration through unity, discipline and often violence, led by a leader who embodies the popular will, in which the individual exists to serve the organic nation.</p>
      <p>This is the most abused word on the list. Used loosely it means "authoritarian and unpleasant," which makes it useless. Used precisely it picks out a specific thing.</p>
      <div class="note">Fascism's definition is genuinely contested among historians. Paxton emphasises process and stages, Griffin the rebirth myth, Eco a family-resemblance list; some restrict the term largely to interwar Europe. Treat what follows as a family resemblance, not a checklist requiring every item.</div>`},
  {h:'The ten markers — look for the cluster',
   b:`<ul>
      <li><b>Palingenetic ultranationalism</b> — the nation is decadent and will be reborn. The ideological core.</li>
      <li><b>Mythic past</b> — a lost golden age, usually historically fictional.</li>
      <li><b>Nation as organism</b> — a body with one will; the individual is a cell.</li>
      <li><b>Enemies both weak and strong</b> — contemptible yet about to overwhelm you.</li>
      <li><b>Cult of action and violence</b> — struggle purifies; deliberation is weakness.</li>
      <li><b>Leader principle</b> — the leader intuits the true will; parliaments are theatre.</li>
      <li><b>Mass mobilisation</b> — uniforms, rallies, paramilitaries, youth wings.</li>
      <li><b>Anti-liberal <i>and</i> anti-Marxist</b> — class struggle denounced as foreign and divisive, replaced by national unity. Critical.</li>
      <li><b>Corporatism</b> — private ownership retained under state-directed bodies; independent unions abolished.</li>
      <li><b>Militarism</b> — expansion as proof of vitality.</li>
      </ul>
      <p>No single item is decisive. The cluster is.</p>`},
  {h:'Three things fascism is not',
   b:`<h3>Not Nazism, exactly</h3>
      <p>Nazism is the variant where biological race, not the nation-state, is the primary unit, with antisemitism as cosmology and extermination as policy. All Nazism is fascist; not all fascism is Nazi.</p>
      <h3>Not ordinary authoritarianism</h3>
      <p>A junta or personalist dictator who wants power and quiet is authoritarian. Fascism demands <i>active participation</i>. Authoritarianism demands passivity. This is why the marker drill matters: repression is shared, mobilisation is not.</p>
      <h3>Not reactionary conservatism</h3>
      <p>The reactionary wants to <i>restore</i> throne, altar and hierarchy. The fascist wants to <i>create something new</i> through national rebirth, and will smash traditional elites to do it. Fascism is revolutionary in method however traditionalist its aesthetics.</p>`},
  {h:'"But the Nazis were socialists"',
   b:`<p>Resolve it with Q1 and Q2, not the party name.</p>
      <p><b>Q1 — ownership.</b> It stayed private. The regime privatised major state holdings in the 1930s, banned independent trade unions, destroyed the workers' parties, and directed private industry through contracts and controls. That is state-directed capitalism, not social ownership.</p>
      <p><b>Q2 — primary unit.</b> Race, constructed in explicit opposition to class. Marxism was the movement's declared mortal enemy.</p>
      <p>The name was a recruitment device aimed at working-class voters.</p>
      <div class="note">Party names are marketing. This is the same reason "Democratic People's Republic" tells you nothing about a state. Always check the answers, never the label.</div>`}
  ],
  drill:{kind:'pick', key:'fasc'} },

{ tag:'Four', title:'Look-alikes',
  cards:[
  {h:'Terms that are not ideologies',
   b:`<p>Several words in common use describe a <i>method</i>, a <i>degree</i>, or a <i>fragment</i> rather than a belief system. Mistaking them for ideologies causes most bad classification.</p>
      <table class="k">
      <tr><th>Term</th><th>What it actually is</th></tr>
      <tr><td>Authoritarianism</td><td>A method of rule. Compatible with almost any ideology.</td></tr>
      <tr><td>Totalitarianism</td><td>Ambition to penetrate all of life. A degree of control, not a content.</td></tr>
      <tr><td>Populism</td><td>A thin ideology: pure people vs corrupt elite. Attaches to hosts on left and right.</td></tr>
      <tr><td>Corporatism</td><td>Economy organised into state-recognised blocs of labour and capital. Not "rule by corporations."</td></tr>
      <tr><td>Nationalism</td><td>Prioritisation of the nation. Necessary but far from sufficient for fascism.</td></tr>
      <tr><td>Statism</td><td>A large, active state. A dial, not a doctrine.</td></tr>
      <tr><td>Technocracy</td><td>Rule by credentialed expertise rather than mandate.</td></tr>
      </table>`},
  {h:'The horseshoe error',
   b:`<p>Leninism and fascism look alike because they share methods: one-party rule, leader cult, secret police, mobilised masses, mass violence.</p>
      <p>They give <b>opposite</b> answers on both decisive questions. Q1: state ownership versus directed private ownership. Q2: class versus race or nation. One abolished the owning class; the other made an alliance with it against the workers' movement.</p>
      <div class="warn"><strong>Never classify by method.</strong> Methods travel; content does not. Comparable in repression is not the same as comparable in ideology — and noticing that two regimes were both murderous is a moral observation, not a diagnostic one.</div>`},
  {h:'National populism',
   b:`<p>Not a classical ideology — a composite, fusing thin populism onto a nationalist host. Very common now, and very often misnamed fascism.</p>
      <table class="k">
      <tr><th>Q1</th><td>Private, retained — but directed toward national ends</td></tr>
      <tr><th>Q2</th><td>The "real people" against a cosmopolitan elite</td></tr>
      <tr><th>Q3</th><td>The nation was sold out from above and outside; recover its strength</td></tr>
      <tr><th>Q4</th><td>Works inside elections; attacks courts, press and bureaucracy as unrepresentative without abolishing the vote</td></tr>
      <tr><th>Q5</th><td>A sovereign, culturally cohesive nation — restored, not transfigured</td></tr>
      </table>
      <p><b>Separates from fascism by four absences:</b> no palingenetic rebirth myth, no leader-as-embodied-will replacing elections, no paramilitary mobilisation, no cult of purifying violence. Where those appear, the classification changes.</p>
      <span class="tell">Tell: sovereignty, borders, globalists, the establishment, industrial policy — pursued through ballots.</span>`},
  {h:'Identity-egalitarianism',
   b:`<p>The other common composite, and the one the valence trap was built for.</p>
      <table class="k">
      <tr><th>Q1</th><td>Markets and private ownership largely accepted; the demand is on distribution and institutional design</td></tr>
      <tr><th>Q2</th><td>Identity categories as structurally positioned groups — <b>egalitarian valence</b></td></tr>
      <tr><th>Q3</th><td>Formally neutral institutions reproduce inherited disadvantage</td></tr>
      <tr><th>Q4</th><td>Fulfil and expand it — charges liberalism with failing its own promises</td></tr>
      <tr><th>Q5</th><td>Equitable outcomes across groups; open-ended</td></tr>
      </table>
      <p><b>Separates from Marxism by:</b> class and ownership are not the root analytic, so Q1 goes largely untouched. <b>From classical liberalism by:</b> rejecting formal equality as sufficient.</p>
      <span class="tell">Tell: structural, systemic, disparate outcomes, equity distinct from equality, colour-blindness as insufficient.</span>
      <div class="note">Genuinely contested: whether this descends from the Marxist and critical-theory lineage or is an independent liberal-egalitarian development is disputed among scholars. The five questions classify it without requiring you to settle that.</div>`},
  {h:'Both of these are also insults',
   b:`<p>The two formations you just learned are, in live political speech, more often used to condemn than to describe. So is "fascist." So is "socialist."</p>
      <p>Analytic use and rhetorical use are different activities. The drill you are about to do is six statements that fail as analysis — most of them because they never engage Q1 or Q2 at all.</p>
      <p>For each one, say the fault out loud before revealing it. Name the question the claim skipped.</p>`}
  ],
  drill:{kind:'err'} },

{ tag:'Five', title:'Full determination',

  {h:'Running the whole key',
   b:`<p class="lead">Everything so far has drilled one character at a time. Now you run the full sequence on unlabelled passages.</p>
      <p>For each specimen: answer Q2, then Q1, then name the family. A readout between the passage and the questions crosses off families your answers have eliminated — watch it, because on some specimens two questions get you to a single survivor.</p>
      <h3>How this is scored</h3>
      <p>Your <b>name</b> and your <b>route</b> are counted separately. Getting the right family from the wrong Q1/Q2 answers is flagged and counts as a miss, because a label you cannot derive from the key will not survive an unfamiliar passage.</p>
      <div class="note">Two of the twelve are traps for over-classification: the honest answer is that the passage does not contain enough to name a full ideology. Withholding is a skill, not a failure.</div>`}
  ],
  drill:{kind:'det'} }
];

{ tag:'One', title:'The diagnostic mindset',
  cards:[
  {h:'Classify by pattern, never by a single moment',
   b:`<p class="lead">Most misreads in this territory happen because someone skips straight to a label. A tense exchange becomes "he's gaslighting me." One boastful moment becomes "total narcissist."</p>
      <p>What actually discriminates isn't how uncomfortable the moment felt. It's a small set of questions about kind, pervasiveness, and function. This course teaches five of them, then drills them.</p>

{ tag:'Two', title:'Cognitive dissonance & self-justification',
  cards:[
  {h:'The mechanism, not just "hypocrisy"',
   b:`<p class="lead">Cognitive dissonance (Festinger): the discomfort of holding two contradictory cognitions, and the drive to resolve it. The resolution does not require honestly changing your mind — there are four moves, and only one of them is that.</p>
      <ol>
        <li><b>Change the belief</b> to match the behaviour — genuine, if it happens.</li>
        <li><b>Change the behaviour</b> to match the belief — also genuine, if it happens.</li>
        <li><b>Add a justifying cognition</b> without changing either — a permission slip written after the fact.</li>
        <li><b>Discredit the source</b> of the contradicting information — the easiest move, and the most damaging.</li>
      </ol>
      <span class="tell">Tell: dissonance reduction shows up after the behaviour, as a repair job. The decision came first; the story came second.</span>`},
  {h:'Confirmation bias',
   b:`<p>Not "believing what you want" in general — specifically <b>asymmetric scrutiny</b>: confirming evidence gets accepted lightly; disconfirming evidence gets picked apart or waved off as an exception.</p>
      <span class="tell">Tell: ask how much scrutiny each type of evidence received. If confirming evidence sailed through and disconfirming evidence got cross-examined, that's the signature.</span>`},
  {h:'Motivated reasoning',
   b:`<p>The conclusion is fixed <b>before</b> the reasoning starts; the reasoning is reverse-engineered to arrive somewhere it was already going. This is the easiest thing in the family to confuse with dissonance reduction.</p>

  {h:'Sunk cost / escalation of commitment',

{ tag:'Three', title:'The narcissism spectrum',

  {h:'Not one dial',
   b:`<p class="lead">Confidence, self-esteem, and narcissism get used interchangeably. They are three different things.</p>

        <li><b>Confidence</b> — situational belief in your ability to do a specific thing.</li>
        <li><b>Self-esteem</b> — a general, stable sense of your own worth. Compatible with genuine warmth and real empathy.</li>

{ tag:'Four', title:'Look-alikes and false friends',
  cards:[
  {h:'Narcissistic vs. borderline pattern',
   b:`<table class="k">
      <tr><th></th><th>Narcissistic</th><th>Borderline</th></tr>
      <tr><td>Core fear</td><td>Being ordinary / unadmired</td><td>Being abandoned</td></tr>

{ tag:'Five', title:'Manipulation tactics & defense mechanisms',
  cards:[
  {h:'Defense mechanisms, briefly',
   b:`<p>Everyone uses defense mechanisms; the question is which ones, how rigidly, and how much reality-distortion they require.</p>
      <ul>
        <li><b>Denial</b> — refusing to register a fact at all.</li>
        <li><b>Projection</b> — attributing your own unacceptable feeling to someone else.</li>
        <li><b>Rationalization</b> — a plausible but false reason, built after the fact (dissonance reduction's usual delivery mechanism).</li>
        <li><b>Displacement</b> — redirecting an emotion toward a safer target.</li>
        <li><b>Intellectualization</b> — draining the emotion out of something by discussing it purely abstractly.</li>
      </ul>
      <p>None of these, alone, is pathological. Everyone does all five sometimes. The question is always D2: occasional, or the person's only mode?</p>`},

      <span class="tell">Tell: repetition + escalation + the functional effect that the other person starts pre-emptively doubting themselves. A single "that's not what happened" is not gaslighting. Years of it, until you stop trusting your own memory, is.</span>`},

      <span class="tell">Tell: it's the sequence, not just defensiveness. All three parts, in that order, in one exchange, is the signature.</span>`},

const MATH_COURSE = [
{ tag:'One', title:'Why none of it stuck',
  cards:[
  {h:'You were taught the procedure, not the question',
   b:`<p class="lead">The complaint is almost always true about the procedure and almost always false about the question. Nobody completes the square at the supermarket. But "how much is this actually growing?" and "how many ways can this go?" are ordinary questions, and school handed you the answers to them in a form that hid what they were for.</p>
      <p>So this course runs backwards from how it was taught. Instead of a method looking for a problem, you start with a situation and work out <i>which question it is</i>. Once the question is named, the procedure is looked up — that part was never the skill.</p>
      <div class="note">Throughout, a right answer reached by the wrong route counts as a miss. If you cannot say <i>which question</i> decided it, you have pattern-matched a school exercise, not identified a problem.</div>`},
  {h:'The five questions',
   b:`<table class="k">
      <tr><th>M1</th><td><b>What kind of question is this?</b><br>whole numbers / an unknown quantity / growth &amp; scale / counting &amp; chance / shape &amp; distance<span class="tell">The fastest discriminator — it decides which key you even need.</span></td></tr>
      <tr><th>M2</th><td><b>What exactly is unknown, and what is given?</b><span class="tell">Most people can’t answer this, which is why the sum feels impossible rather than merely unfamiliar.</span></td></tr>
      <tr><th>M3</th><td><b>Does it change by adding, or by multiplying?</b><span class="tell">The single most consequential distinction in everyday numeracy.</span></td></tr>
      <tr><th>M4</th><td><b>What is the nearest look-alike tool, and what separates them?</b></td></tr>
      <tr><th>M5</th><td><b>What would make this the wrong tool?</b><br>keeps a method from being applied out of habit</td></tr>
      </table>
      <p>M1 and M2 do most of the work. M3 catches the most common live error. The last two are what stop a tool being used past the edge of where it holds.</p>`},
  {h:'M1 routes you to a key',
   b:`<p>Answer M1 and you have already chosen which part of this course applies:</p>
      <ul>
        <li><b>Whole numbers</b> — primes, factors, remainders. What divides what. <span class="tell">Lesson Two</span></li>
        <li><b>An unknown quantity</b> — algebra: one relationship, or two, pinning a number down. <span class="tell">Lesson Three</span></li>
        <li><b>Growth &amp; scale</b> — exponentials and logarithms. <span class="tell">Lesson Four</span></li>

      <p>These are genuinely different kinds of question. Treating a growth question as an arithmetic one, or a conditional-probability question as a straight-probability one, is not a slip in the calculation — it is a mis-sort at M1, and no amount of care further down recovers from it.</p>`},

{ tag:'Two', title:'Primes and what divides what',
  cards:[
  {h:'Primes are the atoms',
   b:`<p class="lead">A prime is a whole number above 1 divisible only by 1 and itself. That definition is dull. What makes it load-bearing is the <b>fundamental theorem of arithmetic</b>: every whole number above 1 is a product of primes in exactly one way.</p>
      <p>60 is 2 × 2 × 3 × 5 and there is no second route to it. Not "usually", not "if you factor carefully" — exactly one. That uniqueness is what makes primes the atoms rather than merely an odd category, and it is why 1 is deliberately excluded: admit it, and every number would have infinitely many factorisations.</p>
      <span class="tell">Tell: a question about what a number is <i>built from</i> is a factorisation question. A question about whether it breaks apart <i>at all</i> is a primality question. They feel identical and take different work.</span>`},
  {h:'How you actually test one',
   b:`<p>Trial division, stopping at the square root. To test 91 you try 2, 3, 5, 7 — and stop, because √91 ≈ 9.5.</p>
      <p>Why the square root? If <i>n</i> has a factor above √n, it must also have the matching one below it. Checking past the square root is checking the same pairs a second time from the other end.</p>
      <div class="note">This one bound turns testing 91 from ninety divisions into four, and it is the reason 91 is the standard trap: people test 2, 3 and 5, find nothing, and declare it prime — having stopped one divisor early.</div>`},
  {h:'Where primes are used constantly, and never by hand',
   b:`<p>Multiplying two 300-digit primes takes a computer no time. Recovering those two primes from the product is, as far as anyone has publicly demonstrated, infeasible. That asymmetry — easy one way, hard the other — is the whole of RSA.</p>
      <p>Every HTTPS connection you have ever made has leaned on it. So the honest form of "I never use primes" is: you use them the way you use a gearbox — constantly, and never by hand.</p>
      <span class="tell">Elsewhere: hash tables size themselves to primes to spread collisions; cicadas emerge on 13- and 17-year cycles, which are prime precisely because that minimises coincidence with predator cycles.</span>`},
  {h:'The rest of the whole-number kit',
   b:`<table class="k">
      <tr><th>GCD</th><td>The largest number dividing both. Reducing a fraction; cutting a 96 × 60 cm sheet into the largest equal squares.</td></tr>
      <tr><th>LCM</th><td>The smallest number both divide. When two meshed gears realign; when two schedules of different lengths coincide again.</td></tr>
      <tr><th>mod</th><td>Divide and keep only the remainder. Weekdays, clock arithmetic, IBAN and ISBN check digits, and every hashing scheme in use.</td></tr>
      <tr><th>irrational</th><td>Some quantities are no fraction at all. The diagonal of a 1 × 1 square is √2, and the proof that no fraction equals it is two lines long and about 2,400 years old.</td></tr>
      </table>
      <p>The drill next is primality only, because that is where the early-stopping error lives.</p>`}
  ],
  drill:{kind:'pick', key:'m2'} },

{ tag:'Three', title:'Unknowns and shapes',
  cards:[
  {h:'An equation is a constraint, not a puzzle',
   b:`<p class="lead">An equation says: whatever this number is, it satisfies this. Solving is not cleverness — it is undoing the operations in reverse order until the unknown stands alone.</p>
      <p>What decides which tool you need is not difficulty. It is <b>how many unknowns there are, and how they enter</b>:</p>
      <table class="k">
      <tr><th>Rearrange</th><td>One unknown, entering once. You have the relationship and want it solved for a different letter. <span class="tell">°F to °C; a mortgage formula solved for the payment.</span></td></tr>
      <tr><th>Proportion</th><td>One ratio holding across the problem. <span class="tell">Paint coverage, recipe scaling, unit prices — the one you genuinely use weekly.</span></td></tr>
      <tr><th>Simultaneous</th><td>Two unknowns, two independent facts. <span class="tell">Fifteen notes worth €120. Either fact alone leaves many answers.</span></td></tr>
      <tr><th>Quadratic</th><td>The unknown multiplied by itself. <span class="tell">Anything under gravity; anything where area is fixed and sides are not.</span></td></tr>
      </table>`},
  {h:'The discriminant answers a question worth asking',
   b:`<p>Before solving <i>ax² + bx + c = 0</i>, the quantity <i>b² − 4ac</i> tells you whether any real solution exists at all — positive means two, zero means one, negative means none.</p>
      <p>"Is there any answer?" is a better first question than "what is the answer?", and it is the only part of the quadratic apparatus that generalises into ordinary judgment: knowing that a set of constraints admits no solution is itself the result.</p>
      <div class="note">Two unknowns and one fact is underdetermined — infinitely many answers, and no method fixes that. Recognising an underdetermined problem stops a lot of wasted effort, in and out of mathematics.</div>`},
  {h:'Shape: four things worth keeping',
   b:`<table class="k">
      <tr><th>Pythagoras</th><td>Two sides around a right angle give the third. <span class="tell">Ladders, diagonals, whether the sofa clears the corner.</span></td></tr>
      <tr><th>Trig ratio</th><td>An angle and one side give any other side. <span class="tell">Heights you cannot climb; roof pitch; ramp gradients.</span></td></tr>
      <tr><th>Similar triangles</th><td>Same shape, different size — matching ratios give the missing length. <span class="tell">Measuring a tree by its shadow, with no trigonometry at all.</span></td></tr>
      <tr><th>Square–cube</th><td>Scale a length by n: area scales by n², volume by n³. <span class="tell">Pizza sizes, TV diagonals, doubling a recipe in a pot.</span></td></tr>
      </table>`},
  {h:'The square–cube law is the one that pays',
   b:`<p>It is the least taught and the most used. A 16-inch pizza has four times the area of an 8-inch, not twice. A 65-inch TV has about 45% more screen than a 55-inch, though the number on the box rose by 18%. A pot with every dimension doubled holds eight times as much and takes far longer to heat through.</p>
      <p>It also explains things that look like biology: large animals need disproportionately thick legs because weight grows with volume while bone strength grows with cross-sectional area. Same law, different subject.</p>
      <span class="tell">Tell: any time a single length is quoted for something you care about by area or volume — screens, pizzas, pipes, tanks — the quoted number is understating the difference.</span>`}
  ],
  drill:{kind:'pick', key:'m3'} },

{ tag:'Four', title:'Growth you cannot picture',
  cards:[
  {h:'Adding versus multiplying',
   b:`<p class="lead">This is the distinction that matters most and gets confused most. <b>Linear:</b> the same amount is added each period. <b>Exponential:</b> the same factor multiplies it each period, so the increase itself grows.</p>
      <p>€200 a month into a shoebox is linear, however impressive the total. A balance rising 7% a year is exponential, however dull the percentage. In everyday speech "exponential" has come to mean "fast", which is why people call the shoebox exponential and a debt at 19% merely expensive.</p>
      <span class="tell">Tell: ask what happens between two consecutive periods. If the difference is constant, it is linear. If the ratio is constant, it is exponential.</span>`},
  {h:'Doubling time, and the rule of 72',
   b:`<p>Human intuition about exponentials is bad, reliably and in one direction: we underestimate. The repair is not a better feel for curves; it is a number — <b>the doubling time</b>.</p>
      <p>Divide 72 by the percentage rate and you get roughly the years to double. At 7%, about ten years. At 3%, about twenty-four. At 19% on an unpaid card, under four.</p>
      <div class="note">The rule of 72 is a logarithm rounded for mental arithmetic: the exact answer is log 2 / log(1 + r). It is accurate to within a few percent for any rate you meet in ordinary life.</div>`},
  {h:'A logarithm is a question, not a button',
   b:`<p>The question is: <b>what exponent gets me there?</b> If growth is ×1.07 a year and you want to know when the money doubles, you are solving 1.07ⁿ = 2 — and n is the logarithm.</p>
      <p>Exponentials answer "how big after n steps". Logarithms answer "how many steps to reach that size". They are the same relationship read from opposite ends, and school taught them a year apart, which is most of why they feel unrelated.</p>`},
  {h:'Log scales, and how they mislead',
   b:`<p>When numbers span orders of magnitude, plotting them raw is useless — the small ones flatten to nothing. A log scale gives each ×10 the same width.</p>
      <p>You have been reading them for years: Richter (7.0 releases about 32× the energy of 6.0), decibels, pH, star magnitudes, film speed.</p>
      <div class="warn"><strong>The cost is that a log axis makes explosive growth look like a gentle straight line.</strong> A chart of a doubling quantity looks alarming on a linear axis and calm on a log one. Neither is dishonest; you just have to know which you are reading, and a great many published charts do not label it prominently.</div>`}
  ],
  drill:{kind:'pick', key:'m4'} },

{ tag:'Five', title:'Counting and chance',
  cards:[
  {h:'Count the slots, then ask whether order matters',
   b:`<table class="k">
      <tr><th>Slots</th><td><b>Multiplication principle</b> — independent choices, each with its own menu. 4 starters × 6 mains × 3 desserts = 72. <span class="tell">Tell: picking one thing never removes an option elsewhere.</span></td></tr>
      <tr><th>Order matters</th><td><b>Permutations</b> — gold, silver, bronze from 8 runners: 8 × 7 × 6 = 336.</td></tr>
      <tr><th>Order doesn’t</th><td><b>Combinations</b> — 6 lottery balls from 49: 13,983,816. Order irrelevant to whether you won, so divide out the 720 orderings.</td></tr>
      </table>
      <p>Nearly every counting mistake is answering one of these with the method for another. Ask the order question explicitly, out loud, before counting anything.</p>`},
  {h:'The complement trick',
   b:`<p class="lead">When a question asks for the chance of <b>at least one</b>, count the opposite instead and subtract from 1. "At least one" is an enormous number of cases; "none at all" is usually a single product.</p>
      <p>Twenty-three people, any shared birthday: computing it directly is a nightmare, and computing "all birthdays different" is one clean chain — 365/365 × 364/365 × … — which comes to about 0.493. So the answer is 50.7%, and it surprises people every time.</p>
      <span class="tell">Tell: the words "at least one" in a probability question are an instruction to flip it.</span>`},
  {h:'Base rates',
   b:`<p>A test is 99% accurate. The condition affects 1 in 10,000. You test positive. Most people say 99%. The answer is about 1%.</p>
      <p>Take a million people: about 100 have it, of whom 99 test positive. About 999,900 do not, of whom roughly 9,999 test positive anyway. Your positive is one of about 10,098 — of which 99 are real.</p>
      <div class="warn"><strong>"99% accurate" answers P(positive given ill). You are asking P(ill given positive).</strong> They are different numbers and the gap between them is the base rate. This same inversion drives false confidence in DNA matches, security screening, and any rare-event alarm.</div>`},
  {h:'Independence, and the fallacy that follows it',
   b:`<p>Six reds in a row does not make black due. The wheel has no memory, and each spin is independent.</p>
      <p>The mirror error: "1 in 4 people are X, there are four of us, so one of us is." A rate over a population is not a quota over a sample. Four independent draws at 1/4 gives about a 68% chance of at least one — and 32% of none. Which is, again, the complement rule.</p>
      <span class="tell">Tell: before combining probabilities, say whether the events are independent. If you cannot say, you cannot multiply.</span>`}
  ],
  drill:{kind:'pick', key:'m5'} },

{ tag:'Six', title:'Faulty claims',
  cards:[
  {h:'Where the errors actually happen',
   b:`<p class="lead">Almost none of the numerical errors people make in ordinary life are arithmetic. They are mis-sorts at M1, or a tool applied past its edge.</p>
      <p>The six claims in this drill are the ones you will meet most often. Each fails at a specific question — usually M3 (adding versus multiplying) or the base rate — and none of them fails because someone got a sum wrong.</p>
      <p>For each one, state the fault out loud before revealing it. Name the question the claim skipped.</p>`}
  ],
  drill:{kind:'err'} },

{ tag:'Seven', title:'Full determination',
  cards:[
  {h:'Running the whole key',
   b:`<p class="lead">Everything so far has drilled one branch at a time. Now you run the full sequence on unlabelled situations, none of which announce which chapter they came from.</p>
      <p>For each: answer M1, then the two questions specific to that branch, and only then name the tool. A readout between the situation and the questions crosses off tools your answers have eliminated.</p>
      <h3>How this is scored</h3>
      <p>Your <b>name</b> and your <b>route</b> are counted separately. Getting the right tool from the wrong answers is flagged and counts as a miss — because recognising a familiar-looking problem is exactly the habit this course is trying to replace.</p>
      <div class="note">Naming the tool is where this stops. Executing it is a lookup, and always was.</div>`}
  ],
  drill:{kind:'det'} }
];

const MATH = {
  id:'math', name:'Basic Math', eyebrow:'Diagnostic instrument · Rev. 1',
  blurb:'The high-school syllabus, sorted by the question each piece answers rather than the procedure it uses — primes, growth, chance, and the scaling law nobody taught you.',
  topics:'Primes · Growth & logs · Counting & chance · Scaling laws',
  intro:'Work out which question a situation is before reaching for a method. A right tool named by the wrong route is scored as a miss.',
  falsLabel:'What would change the tool',
  outcomes: MATH_OUTCOMES,
  determination: { gateCode:'M1', steps:[MATH_GATE], stepsByGate:MATH_STEPS_BY_GATE },
  determinationIntro:`<p>You are running each situation through the key. Sort it first, work the two questions for that branch, and name the tool last.</p>
      <ol>
        <li>Read the situation.</li>
        <li><b>Step 1</b> — which kind of question is this? The later steps unlock in order, and change depending on this answer.</li>
        <li><b>Steps 2–3</b> — the two questions specific to that branch.</li>
        <li><b>Step 4</b> — now name the tool, and record your determination.</li>
      </ol>
      <p>The strip between the situation and step 1 is a readout, not a control. It crosses off tools your answers have ruled out. Nothing there is tappable.</p>
      <p>Your name and your route are scored separately. Right tool from the wrong steps counts as a miss.</p>`,
  specimens: MATH_SPECIMENS,
  quickDrills: [
    {key:'m1', title:'Which branch',    prompt:'Which kind of question is this (M1)?', items:M1_DRILL, opts:M1_OPTS},
    {key:'m2', title:'Prime or not',    prompt:'Prime, composite, or neither?',        items:M2_DRILL, opts:M2_OPTS, plain:true},
    {key:'m3', title:'Which tool',      prompt:'Which tool settles it?',               items:M3_DRILL, opts:M3_OPTS},
    {key:'m4', title:'Growth check',    prompt:'Linear, exponential, or neither?',     items:M4_DRILL, opts:M4_OPTS},
    {key:'m5', title:'Counting rule',   prompt:'Which counting rule applies?',         items:M5_DRILL, opts:M5_OPTS}
  ],
  errDrill: MATH_ERR,
  course: MATH_COURSE,
  tabs: [
    {key:'course', label:'Course'}, {key:'det', label:'Determination'},
    {key:'m1', label:'Which branch'}, {key:'m2', label:'Prime or not'}, {key:'m3', label:'Which tool'},
    {key:'m4', label:'Growth check'}, {key:'m5', label:'Counting rule'},
    {key:'err', label:'Faulty claims'}, {key:'reference', label:'Reference'}
  ],
  caveats:`<ul>
    <li><b>This is a sorting key, not a syllabus.</b> It teaches you which question a situation is, and stops there. Executing the method — the long division, the algebra, the actual integral — is a separate skill and mostly a lookup.</li>
    <li><b>"Never used in daily life" is half true.</b> The procedures genuinely are unused by hand. The questions are not, and several of these — proportion, compounding, base rates, the square–cube law — are used against you commercially whether or not you use them yourself.</li>
    <li><b>The rules of thumb are approximations.</b> The rule of 72 is a rounded logarithm; it drifts at high rates. The birthday figure assumes uniform birthdays, which is very slightly false.</li>
    <li><b>Real probability problems are usually about the model, not the arithmetic.</b> Whether events are independent, whether a sample is representative, whether the base rate quoted applies to you — those are judgment calls that the formula cannot make and will silently assume.</li>
    <li><b>Exponential models always break.</b> Nothing compounds forever; rumours run out of listeners, bacteria run out of sugar. A model that projects past its own assumptions is wrong even when the arithmetic is right.</li>
    <li><b>School mathematics is a small and old corner of the subject.</b> Almost none of what working mathematicians do resembles anything in this key, and "I was bad at maths at school" is evidence about a curriculum more than about a mind.</li>
    <li><b>Numeracy is not a personality.</b> The point of a key like this is to make the sorting explicit so it can be learned deliberately, not to sort people into those who see it and those who don’t.</li>
  </ul>`
};

const SUBJECTS = [IDEOLOGY, PSYCHOLOGY, MATH];

/* ===================== APP SHELL ===================== */

const SAVED_APP = storageLoad('pl:app', {subjectId:null, view:'library'});
const APP = {
  subjectId: SUBJECTS.some(s=>s.id===SAVED_APP.subjectId) ? SAVED_APP.subjectId : null,
  view: 'library',
  tab: 'course'
};
if(SAVED_APP.view==='subject' && APP.subjectId) APP.view='subject';
const subjectStates = {};

function saveApp(){ storageSave('pl:app', {subjectId:APP.subjectId, view:APP.view}); }
function currentSubject(){ return SUBJECTS.find(s=>s.id===APP.subjectId); }

function getSubjectState(subj){
  if(subjectStates[subj.id]) return subjectStates[subj.id];
  const st = {
    course: { u:0, card:0, phase:'read', done: subj.course.map(()=>false) },
    stats: {},
    drillCache: {}
  };
  subj.quickDrills.forEach(q => st.stats[q.key] = {n:0, ok:0});
  st.stats.det = {n:0, label:0, frame:0};
  st.stats.err = {seen:0};
  storageLoad(`pl:${subj.id}:course`, st.course);
  subj.quickDrills.forEach(q => storageLoad(`pl:${subj.id}:stats:${q.key}`, st.stats[q.key]));
  storageLoad(`pl:${subj.id}:stats:det`, st.stats.det);
  storageLoad(`pl:${subj.id}:stats:err`, st.stats.err);
  subjectStates[subj.id] = st;
  return st;
}

function saveCourseProgress(subj, st){ storageSave(`pl:${subj.id}:course`, {u:st.course.u, card:st.course.card, phase:st.course.phase, done:st.course.done}); }

function pickCfgFor(subj, key){
  const q = subj.quickDrills.find(q=>q.key===key);
  return { items:q.items, opts:q.opts, title:q.title, prompt:q.prompt, plain:q.plain, answer:q.answer,
           storageKey:`pl:${subj.id}:stats:${key}` };
}

function render(){
  const subj = currentSubject();
  if(APP.view!=='subject' || !subj) return renderLibrary();
  const st = getSubjectState(subj);
  renderSubjectHead(subj);
  renderTabs(subj);
  stage().className = 'sheet';
  renderView(subj, st);
}

/* ---- Library: the shelf of subjects ---- */

function subjectProgress(subj){
  const done = getSubjectState(subj).course.done.filter(Boolean).length;
  return { done, total: subj.course.length };
}

function openSubject(id){
  APP.subjectId = id; APP.view = 'subject'; APP.tab = 'course';
  saveApp(); render(); window.scrollTo(0,0);
}

function renderLibrary(){
  stage().className = '';
  document.getElementById('head').innerHTML = `<header class="mast">
      <p class="eyebrow">Practical courses · read the lesson, then run the drill</p>
      <h1>Personal Lessons</h1>
      <p>Diagnostic keys for things people name confidently and identify badly. Each subject teaches a short set of questions, then drills them on unlabelled cases until naming the thing stops being a guess.</p>
    </header>`;

  stage().innerHTML = `<div class="shelf">${SUBJECTS.map(s=>{
      const p = subjectProgress(s);
      const pct = p.total ? Math.round(100*p.done/p.total) : 0;
      const go = p.done===0 ? 'Start' : (p.done===p.total ? 'Review' : 'Resume');
      return `<button class="card" data-s="${s.id}">
        <span class="c-eyebrow"><span>${esc(s.eyebrow)}</span><span>${p.total} units</span></span>
        <span class="c-title">${esc(s.name)}</span>
        <span class="c-blurb">${esc(s.blurb)}</span>
        <span class="c-topics">${esc(s.topics)}</span>
        <span class="c-foot">
          <span class="meter"><i style="width:${pct}%"></i></span>
          <span class="c-prog">${p.done}/${p.total}</span>
          <span class="c-go">${go} &rarr;</span>
        </span>
      </button>`;
    }).join('')}</div>
    <p class="shelf-note">Progress is stored in this browser only &middot; nothing leaves the device</p>`;

  stage().querySelectorAll('.card').forEach(b=>b.onclick=()=>openSubject(b.dataset.s));
}

/* ---- Subject header + tabs ---- */

function renderSubjectHead(subj){
  document.getElementById('head').innerHTML = `
    <div class="topbar">
      <div class="t-left">
        <p class="t-eyebrow">${esc(subj.eyebrow)}</p>
        <h1>${esc(subj.name)}</h1>
      </div>
      <button class="backlink" id="backHome">&larr; All subjects</button>
    </div>
    <div class="tabs" role="tablist" id="tabBar"></div>`;
  document.getElementById('backHome').onclick = ()=>{
    APP.view='library'; saveApp(); render(); window.scrollTo(0,0);
  };
}

function renderTabs(subj){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = subj.tabs.map(t=>
    `<button class="tab" role="tab" data-t="${t.key}" aria-selected="${APP.tab===t.key}">${esc(t.label)}</button>`).join('');
  bar.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    APP.tab = b.dataset.t; render();
  });
  const sel = bar.querySelector('.tab[aria-selected="true"]');
  if(sel && bar.scrollWidth > bar.clientWidth) sel.scrollIntoView({block:'nearest', inline:'center'});
  const fades = ()=>{
    bar.classList.toggle('fade-l', bar.scrollLeft > 4);
    bar.classList.toggle('fade-r', bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 4);
  };
  bar.onscroll = fades;
  fades();
  window.onresize = fades;
}

function renderView(subj, st){
  if(APP.tab==='course') return renderCourse(subj, st);
  if(APP.tab==='reference') return renderReference(subj);
  if(APP.tab==='det'){
    const key = 'det';
    if(!st.drillCache[key]) st.drillCache[key] = {i:0, answers:{}, outcome:null, revealed:false, intro:!introSeen(`pl:${subj.id}:stats:det`), stats:st.stats.det};
    return mountDetermination(subj, stage(), st.drillCache[key], `pl:${subj.id}:stats:det`, ()=>renderDone(subj, st, 'det'));
  }
  if(APP.tab==='err'){
    if(!st.drillCache.err) st.drillCache.err = {i:0, picked:null, stats:st.stats.err};
    return mountErrDrill(stage(), subj.errDrill, st.drillCache.err, `pl:${subj.id}:stats:err`, ()=>renderDone(subj, st, 'err'));
  }
  // quick drill tab
  const key = APP.tab;
  if(!st.drillCache[key]) st.drillCache[key] = {i:0, picked:null, stats:st.stats[key]};
  mountPickDrill(stage(), pickCfgFor(subj, key), st.drillCache[key], ()=>renderDone(subj, st, key));
}

function renderDone(subj, st, key){
  if(key==='det'){
    const s=st.stats.det;
    stage().innerHTML = `<div class="done"><h2>Determination set complete</h2>
      <p style="color:var(--ink-soft);max-width:44ch;margin:0 auto 18px">Names correct: <b>${s.label}</b> · routes correct: <b>${s.frame}</b> · of <b>${s.n}</b> recorded.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Run the set again</button></div></div>`;
    document.getElementById('again').onclick=()=>{ delete st.drillCache.det; render(); };
    return;
  }
  if(key==='err'){
    stage().innerHTML = `<div class="done"><h2>Set complete</h2>
      <p style="color:var(--ink-soft);margin:0 0 18px">All ${subj.errDrill.length} faults reviewed.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Run again</button></div></div>`;
    document.getElementById('again').onclick=()=>{ delete st.drillCache.err; render(); };
    return;
  }
  const s=st.stats[key];
  stage().innerHTML = `<div class="done"><h2>Set complete</h2>
    <p style="color:var(--ink-soft);margin:0 0 18px"><b>${s.ok}</b> correct of <b>${s.n}</b> answered.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Run again</button></div></div>`;
  document.getElementById('again').onclick=()=>{ delete st.drillCache[key]; render(); };
}

/* ---- Course mode (ladder + lesson cards + per-unit drill) ---- */

function ladder(subj, cst){
  return `<div class="ladder">${subj.course.map((u,i)=>
    `<div class="rung ${i===cst.u?'now':''} ${cst.done[i]?'done':''}" data-u="${i}"><b>${u.tag}</b>${esc(u.title)}</div>`
  ).join('')}</div>`;
}
function wireLadder(subj, cst){
  stage().querySelectorAll('.rung').forEach(r=>r.onclick=()=>{
    cst.u=+r.dataset.u; cst.card=0; cst.phase='read'; renderCourse(subj, getSubjectState(subj));
  });
}

function renderCourse(subj, st){
  const cst = st.course;
  if(cst.phase==='read') return renderLessonCard(subj, st);
  if(cst.phase==='unitdone') return renderUnitDone(subj, st);
  return renderUnitDrill(subj, st);
}

function renderLessonCard(subj, st){
  const cst = st.course, u = subj.course[cst.u], c = u.cards[cst.card];
  stage().innerHTML = ladder(subj, cst) + `
    <div class="crumb">
      <span class="where">Unit ${u.tag} · Lesson</span>
      <span class="of">Card ${cst.card+1} of ${u.cards.length}</span>
    </div>
    <div class="lesson"><h2>${esc(c.h)}</h2>${c.b}</div>
    <div class="dots">${u.cards.map((_,i)=>`<span class="dot ${i<=cst.card?'on':''}"></span>`).join('')}</div>
    <div class="row">
      ${cst.card>0?'<button class="btn ghost" id="back">Back</button>':''}
      <button class="btn" id="fwd">${cst.card < u.cards.length-1 ? 'Next' : 'Start the drill'}</button>
    </div>`;
  wireLadder(subj, cst);
  const b=document.getElementById('back'); if(b) b.onclick=()=>{cst.card--;renderCourse(subj, st);};
  document.getElementById('fwd').onclick=()=>{
    if(cst.card < u.cards.length-1){ cst.card++; }
    else { cst.phase='drill'; resetUnitDrill(subj, st, u); }
    renderCourse(subj, st);
  };
}

function resetUnitDrill(subj, st, u){
  const cst = st.course;
  if(u.drill.kind==='det'){
    cst.drillState = {i:0, answers:{}, outcome:null, revealed:false, intro:!introSeen(`pl:${subj.id}:stats:det`), stats:st.stats.det};
  } else if(u.drill.kind==='err'){
    cst.drillState = {i:0, picked:null, stats:st.stats.err};
  } else {
    cst.drillState = {i:0, picked:null, stats:st.stats[u.drill.key]};
  }
}

function renderUnitDrill(subj, st){
  const cst = st.course, u = subj.course[cst.u];
  stage().innerHTML = ladder(subj, cst) + `
    <div class="crumb">
      <span class="where">Unit ${u.tag} · Drill</span>
      <span class="of">${esc(u.drill.kind==='det' ? 'Full determination' : (u.drill.kind==='err' ? 'Faulty claims' : subj.quickDrills.find(q=>q.key===u.drill.key).title))}</span>
    </div>
    <div id="drillHost"></div>`;
  wireLadder(subj, cst);
  const host = document.getElementById('drillHost');
  const finish = ()=>finishUnit(subj, st);
  if(u.drill.kind==='det'){
    mountDetermination(subj, host, cst.drillState, `pl:${subj.id}:stats:det`, finish);
  } else if(u.drill.kind==='err'){
    mountErrDrill(host, subj.errDrill, cst.drillState, `pl:${subj.id}:stats:err`, finish);
  } else {
    mountPickDrill(host, pickCfgFor(subj, u.drill.key), cst.drillState, finish);
  }
}

function finishUnit(subj, st){
  const cst = st.course;
  cst.done[cst.u]=true; cst.phase='unitdone'; saveCourseProgress(subj, st); renderCourse(subj, st);
}

function renderUnitDone(subj, st){
  const cst = st.course, u=subj.course[cst.u], last = cst.u===subj.course.length-1;
  const key = u.drill.kind==='det' ? 'det' : (u.drill.kind==='err' ? 'err' : u.drill.key);
  const s = st.stats[key];
  const line = u.drill.kind==='det'
    ? `Names correct <b>${s.label}</b> · routes correct <b>${s.frame}</b> · of <b>${s.n}</b>.`
    : (u.drill.kind==='err' ? `All ${subj.errDrill.length} faults reviewed.` : `<b>${s.ok}</b> correct of <b>${s.n}</b> answered.`);
  stage().innerHTML = ladder(subj, cst) + `<div class="done">
    <h2>Unit ${u.tag} complete</h2>
    <p>${line}</p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="redo">Redo the drill</button>
      <button class="btn ghost" id="reread">Reread the lesson</button>
      ${last?'':'<button class="btn" id="on">Continue to Unit '+subj.course[cst.u+1].tag+'</button>'}
    </div>
    ${last?'<p style="margin-top:18px">You have run every unit. The Reference tab keeps all of it, plus the caveats about where this course stops.</p>':''}
  </div>`;
  wireLadder(subj, cst);
  document.getElementById('redo').onclick=()=>{cst.phase='drill';resetUnitDrill(subj, st, u);renderCourse(subj, st);};
  document.getElementById('reread').onclick=()=>{cst.phase='read';cst.card=0;renderCourse(subj, st);};
  const on=document.getElementById('on');
  if(on) on.onclick=()=>{cst.u++;cst.card=0;cst.phase='read';saveCourseProgress(subj, st);renderCourse(subj, st);};
}

/* ---- Reference ---- */

function renderReference(subj){
  stage().innerHTML = `
    <div class="crumb"><span class="where">Reference</span><span class="of">Everything taught, condensed</span></div>
    ${subj.course.map(u=>`<details class="fg"><summary>Unit ${u.tag} — ${esc(u.title)}</summary>
      <div class="fg-body lesson">${u.cards.map(c=>`<h3>${esc(c.h)}</h3>${c.b}`).join('')}</div></details>`).join('')}
    <details class="fg"><summary>Honest caveats</summary><div class="fg-body">${subj.caveats}</div></details>`;
}

/* ===================== INIT ===================== */

render();
</script>
</body>
</html>
