<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#d5d9d1; --sheet:#f3f2ed; --sheet-2:#e9e8e1;
  --ink:#14181d; --ink-soft:#4c545a; --rule:#aab0a6; --rule-fine:#c6cabf;
  --brass:#7a6636; --herb:#3a5c46; --iron:#8c3a2e;
  --shadow:0 1px 0 rgba(20,24,29,.10), 0 10px 24px -18px rgba(20,24,29,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--board);
  background-image:linear-gradient(rgba(20,24,29,.025) 1px,transparent 1px);
  background-size:100% 3px;
  color:var(--ink); font-family:'Spectral',Georgia,serif; font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px}

.mast{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.mast .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.mast h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:clamp(25px,5.8vw,37px);
  line-height:1.02;margin:0;letter-spacing:-.015em}
.mast p{margin:8px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:52ch}

/* ---------- subject switcher ---------- */
.subjects{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.subject-pill{font-family:'Zilla Slab',serif;font-size:15px;font-weight:600;padding:11px 16px;
  background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink-soft);cursor:pointer;
  border-radius:5px;flex:1 1 auto;text-align:center;min-width:150px}
.subject-pill:hover{border-color:var(--ink);color:var(--ink)}
.subject-pill.active{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0 0}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 11px 7px;border:1px solid var(--rule);border-bottom:none;background:var(--sheet-2);
  color:var(--ink-soft);cursor:pointer;border-radius:3px 3px 0 0;position:relative;top:1px}
.tab:hover{background:var(--sheet);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--ink);font-weight:600;
  border-color:var(--ink);border-bottom:1px solid var(--sheet)}

.sheet{background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);
  padding:20px 18px 22px;border-radius:0 3px 3px 3px}

.ladder{display:flex;gap:0;margin:0 0 20px;border:1px solid var(--rule-fine);border-radius:2px;overflow:hidden;flex-wrap:wrap}
.rung{flex:1;padding:7px 4px 6px;text-align:center;background:var(--sheet-2);min-width:60px;
  border-right:1px solid var(--rule-fine);font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;line-height:1.3}
.rung:last-child{border-right:none}
.rung b{display:block;font-size:12px;color:var(--ink);font-weight:600}
.rung:hover{background:var(--sheet)}
.rung.now{background:var(--ink);color:var(--sheet)}
.rung.now b{color:var(--sheet)}
.rung.done b::after{content:' \2713';color:var(--herb)}
.rung.now.done b::after{color:#9fd0b0}

.crumb{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule-fine);padding-bottom:8px;margin-bottom:16px}
.crumb .where{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.crumb .of{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}

.lesson h2{font-family:'Zilla Slab',serif;font-size:clamp(21px,4.6vw,27px);margin:0 0 12px;letter-spacing:-.01em;line-height:1.12}
.lesson h3{font-family:'Zilla Slab',serif;font-size:17px;margin:18px 0 6px}
.lesson p{margin:0 0 12px}
.lesson ul,.lesson ol{margin:0 0 12px;padding-left:19px}
.lesson li{margin-bottom:6px}
.lesson .lead{font-size:18px;color:var(--ink)}
.tell{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--brass);display:block;margin-top:5px}
.warn{border:1px solid rgba(140,58,46,.35);background:rgba(140,58,46,.07);border-radius:3px;padding:12px 14px;margin:14px 0}
.warn strong{color:var(--iron)}
.note{border:1px solid rgba(122,102,54,.3);background:rgba(122,102,54,.08);border-radius:3px;padding:12px 14px;margin:14px 0}
table.k{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
table.k th,table.k td{border:1px solid var(--rule-fine);padding:8px 9px;text-align:left;vertical-align:top}
table.k th{background:var(--sheet-2);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}

.dots{display:flex;gap:5px;margin:18px 0 0}
.dot{width:22px;height:3px;background:var(--rule);border-radius:2px}
.dot.on{background:var(--ink)}

.spec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule-fine);padding-bottom:8px;margin-bottom:16px}
.spec-no{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.spec-set{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}

blockquote.passage{margin:0 0 20px;padding:14px 16px;background:var(--sheet-2);border-radius:3px;
  font-size:18px;line-height:1.6;font-style:italic}
blockquote.passage.plain{font-style:normal;font-size:17px}
.step{margin:0 0 18px}
.step.locked{opacity:.55;pointer-events:none}
.step-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--brass);display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.step-label .code{background:var(--ink);color:var(--sheet);padding:2px 5px;border-radius:2px;font-weight:600;letter-spacing:.06em}
.step-label .num{width:19px;height:19px;flex:0 0 19px;border-radius:50%;background:var(--brass);color:var(--sheet);
  display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:10.5px;letter-spacing:0}
.step.locked .step-label .num{background:var(--rule)}
.lockmsg{margin-left:auto;font-style:normal;color:var(--ink-soft);letter-spacing:.06em;border:1px dashed var(--rule);
  padding:2px 7px;border-radius:2px;text-transform:none;font-size:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-family:'Zilla Slab',serif;font-size:14.5px;font-weight:500;padding:8px 12px;
  background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink);cursor:pointer;
  border-radius:2px;text-align:left;line-height:1.25}
.opt:hover{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.05em;
  opacity:.62;font-weight:400;margin-top:2px;text-transform:uppercase}

.intro{border:1px solid var(--ink);background:var(--sheet-2);padding:15px 15px 13px;margin:0 0 18px;border-radius:2px}
.intro h2{font-family:'Zilla Slab',serif;font-size:17px;margin:0 0 9px}
.intro ol{margin:0 0 10px;padding-left:19px;font-size:15px}
.intro ol li{margin-bottom:5px}
.intro p{margin:0 0 10px;font-size:14.5px;color:var(--ink-soft)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--brass);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

.rail{border:1px solid var(--rule);background:var(--sheet-2);padding:12px 13px;margin:0 0 18px;
  border-radius:2px;cursor:default;user-select:none}
.rail-head{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rail-count{color:var(--brass);font-weight:600}
.cands{display:flex;flex-wrap:wrap;gap:5px 9px;margin:0;padding:0;list-style:none}
.cand{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);transition:color .28s ease,opacity .28s ease}
.cand.out{color:var(--ink-soft);opacity:.4;text-decoration:line-through;text-decoration-thickness:1px}

.verdict{border-top:2px solid var(--ink);margin-top:20px;padding-top:16px}
.verdict h3{font-family:'Zilla Slab',serif;font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.mark{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;border:1px solid}
.mark.ok{color:var(--herb);border-color:var(--herb);background:rgba(58,92,70,.07)}
.mark.no{color:var(--iron);border-color:var(--iron);background:rgba(140,58,46,.07)}
.vblock{margin:0 0 12px}
.vlab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brass);margin-bottom:3px}
.vblock p{margin:0;font-size:16px;line-height:1.55}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:11px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);
  cursor:pointer;border-radius:2px}
.btn:hover{background:#000}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sheet-2)}

.score{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  border-top:1px solid var(--rule-fine);margin-top:18px;padding-top:11px}
.score b{color:var(--ink);font-weight:600}
.hint{font-size:14px;color:var(--ink-soft);margin:10px 0 0}
.done{text-align:center;padding:22px 6px}
.done h2{font-family:'Zilla Slab',serif;font-size:24px;margin:0 0 8px}
.done p{color:var(--ink-soft);max-width:46ch;margin:0 auto 8px;font-size:15.5px}

details.fg{border-bottom:1px solid var(--rule-fine)}
details.fg:last-of-type{border-bottom:none}
details.fg summary{cursor:pointer;padding:13px 2px;font-family:'Zilla Slab',serif;font-weight:600;
  font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fg summary::-webkit-details-marker{display:none}
details.fg summary::after{content:'+';font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:16px}
details.fg[open] summary::after{content:'\2212'}
.fg-body{padding:0 2px 16px;font-size:15.5px}
.fg-body p{margin:0 0 10px}
.fg-body ul{margin:0 0 10px;padding-left:18px}
.fg-body li{margin-bottom:5px}
.fg-body h4{font-family:'Zilla Slab',serif;font-size:15.5px;margin:16px 0 5px}

:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .wrap{padding:16px 12px 80px}
  .sheet{padding:16px 13px 18px}
  blockquote.passage{font-size:16.5px;padding-left:13px}
  .opt{font-size:14px;padding:8px 10px}
  .rung{font-size:8.5px;padding:6px 2px}
  .rung b{font-size:11px}
  table.k{font-size:13.5px}
  table.k th,table.k td{padding:6px 7px}
  .subject-pill{min-width:0;font-size:14px;padding:10px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="eyebrow">Practical courses · read the lesson, then run the drill</p>
    <h1>Personal Lessons</h1>
  </header>

  <div class="subjects" id="subjects"></div>
  <div class="tabs" role="tablist" id="tabBar"></div>
  <main class="sheet" id="stage"></main>
</div>

<script>
/* ===================== SHARED ENGINE ===================== */

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage = () => document.getElementById('stage');

function storageSave(key, obj){
  try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){}
}
function storageLoad(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return Object.assign(fallback, JSON.parse(raw));
  }catch(e){}
  return fallback;
}

/* ---- generic pick drill ---- */
function pickAnswerOf(it, cfg){ return cfg.answer ? cfg.answer(it) : it.a; }

function mountPickDrill(hostEl, cfg, state, onAllDone){
  if(state.i >= cfg.items.length) return onAllDone();
  const it = cfg.items[state.i], st = state.stats;

  hostEl.innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Item ${String(state.i+1).padStart(2,'0')} / ${cfg.items.length}</span>
      <span class="spec-set">${esc(cfg.title)}</span>
    </div>
    <blockquote class="passage ${cfg.plain?'plain':''}">${esc(it.q)}</blockquote>
    <div class="step ${state.picked!==null?'locked':''}">
      <div class="step-label"><span class="code">?</span> ${esc(cfg.prompt)}</div>
      <div class="opts" id="pickOpts">
        ${cfg.opts.map(o=>`<button class="opt" data-v="${esc(o)}" aria-pressed="${state.picked===o}">${esc(o)}</button>`).join('')}
      </div>
    </div>
    ${state.picked!==null ? `
      <div class="verdict">
        <div class="marks"><span class="mark ${state.picked===pickAnswerOf(it,cfg)?'ok':'no'}">${state.picked===pickAnswerOf(it,cfg)?'Correct':'Missed — '+esc(pickAnswerOf(it,cfg))}</span></div>
        <div class="vblock"><div class="vlab">Why</div><p>${esc(it.w)}</p></div>
        <div class="row"><button class="btn" id="pickNext">${state.i===cfg.items.length-1?'Finish':'Next item'}</button></div>
      </div>` : ''}
    <div class="score"><span>Answered <b>${st.n}</b></span><span>Correct <b>${st.ok}</b></span></div>`;

  hostEl.querySelectorAll('#pickOpts .opt').forEach(b=>b.onclick=()=>{
    state.picked = b.dataset.v;
    st.n++; if(state.picked===pickAnswerOf(it,cfg)) st.ok++;
    if(cfg.storageKey) storageSave(cfg.storageKey, state.stats);
    mountPickDrill(hostEl, cfg, state, onAllDone);
  });
  const nx = hostEl.querySelector('#pickNext');
  if(nx) nx.onclick=()=>{ state.i++; state.picked=null; mountPickDrill(hostEl, cfg, state, onAllDone); };
}

/* ---- generic faulty-claims drill ---- */
function mountErrDrill(hostEl, items, state, storageKey, onAllDone){
  if(state.i >= items.length) return onAllDone();
  const it = items[state.i];

  hostEl.innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Claim ${String(state.i+1).padStart(2,'0')} / ${items.length}</span>
      <span class="spec-set">Faulty claims</span>
    </div>
    <blockquote class="passage">${esc(it.q)}</blockquote>
    <p class="hint" style="margin-bottom:14px">State the fault out loud or in writing before revealing. Name which diagnostic question the claim fails to engage.</p>
    ${state.picked ? `<div class="verdict"><div class="vblock"><div class="vlab">The fault</div><p>${esc(it.w)}</p></div>
      <div class="row"><button class="btn" id="errNext">${state.i===items.length-1?'Finish':'Next claim'}</button></div></div>`
    : `<div class="row"><button class="btn" id="errShow">Show the fault</button></div>`}`;

  const sh = hostEl.querySelector('#errShow');
  if(sh) sh.onclick=()=>{ state.picked='x'; state.stats.seen++; storageSave(storageKey, state.stats); mountErrDrill(hostEl, items, state, storageKey, onAllDone); };
  const nx = hostEl.querySelector('#errNext');
  if(nx) nx.onclick=()=>{ state.i++; state.picked=null; mountErrDrill(hostEl, items, state, storageKey, onAllDone); };
}

/* ---- generic determination engine ----
 * A subject's `determination` describes its diagnostic-question flow:
 *   { gateCode: null | 'D1',
 *     steps: [ {code,label,options:[{id,n,sub?,keeps}]} , ... ],   // always active
 *     stepsByGate: null | { [gateOptionId]: [ {code,label,options} , ... ] } }
 * Subjects with no gate (flat multi-question keys, e.g. political ideologies)
 * set gateCode:null and put every question in `steps`.
 * Subjects with a gate (branching keys, e.g. psychology) put just the gate
 * question in `steps` and the per-branch follow-ups in `stepsByGate`.
 * Specimens store answers as `sub:{ [stepCode]: [acceptableAnswerIds] }`,
 * covering the gate code too when there is one.
 */

function outcomeName(subject, id){ return subject.outcomes.find(o=>o.id===id).n; }

function detActiveSteps(subject, state){
  const d = subject.determination;
  if(!d.gateCode) return d.steps;
  const gateAns = state.answers[d.gateCode];
  const extra = gateAns ? (d.stepsByGate[gateAns]||[]) : [];
  return [...d.steps, ...extra];
}

function detCandidates(subject, state){
  let live = subject.outcomes.map(o=>o.id);
  detActiveSteps(subject, state).forEach(step=>{
    const ans = state.answers[step.code];
    if(!ans) return;
    const opt = step.options.find(o=>o.id===ans);
    if(opt && opt.keeps) live = live.filter(id=>opt.keeps.includes(id));
  });
  return live;
}

function detReady(subject, state){
  const steps = detActiveSteps(subject, state);
  return steps.length>0 && steps.every(step=>state.answers[step.code]);
}

function nameOptions(subject, state){
  const d = subject.determination;
  if(!d.gateCode) return subject.outcomes;
  const gateAns = state.answers[d.gateCode];
  return subject.outcomes.filter(o=>o.group===gateAns);
}

function correctSteps(subject, sp){
  const d = subject.determination;
  if(!d.gateCode) return d.steps;
  const gateWant = sp.sub[d.gateCode];
  const extra = (gateWant && d.stepsByGate[gateWant[0]]) || [];
  return [...d.steps, ...extra];
}

function detStepsHTML(subject, state){
  const steps = detActiveSteps(subject, state);
  let html = '';
  steps.forEach((step, idx)=>{
    const unlocked = idx===0 ? true : !!state.answers[steps[idx-1].code];
    html += `<div class="step ${unlocked?'':'locked'} ${state.revealed?'locked':''}">
      <div class="step-label"><span class="num">${idx+1}</span><span class="code">${esc(step.code)}</span> ${esc(step.label)}${unlocked?'':'<span class="lockmsg">Answer the previous step to unlock</span>'}</div>
      <div class="opts" data-step="${step.code}">${step.options.map(o=>
        `<button class="opt" data-v="${o.id}" aria-pressed="${state.answers[step.code]===o.id}">${esc(o.n)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</button>`).join('')}</div>
    </div>`;
  });
  const ready = detReady(subject, state);
  html += `<div class="step ${ready?'':'locked'} ${state.revealed?'locked':''}">
    <div class="step-label"><span class="num">${steps.length+1}</span><span class="code">ID</span> Name it${ready?'':'<span class="lockmsg">Answer the previous step to unlock</span>'}</div>
    <div class="opts" id="outcomeOpts">${nameOptions(subject,state).map(o=>
      `<button class="opt" data-o="${o.id}" aria-pressed="${state.outcome===o.id}">${esc(o.n)}</button>`).join('')}</div>
  </div>`;
  return html;
}

function detVerdictHTML(subject, sp, state){
  const steps = correctSteps(subject, sp);
  const routeOk = steps.every(step => (sp.sub[step.code]||[]).includes(state.answers[step.code]));
  const okO = state.outcome === sp.outcome;
  const name = outcomeName(subject, sp.outcome);

  const wantLine = () => {
    if(routeOk) return '';
    const bad = steps.find(step => !(sp.sub[step.code]||[]).includes(state.answers[step.code]));
    if(!bad) return '';
    const opts = bad.options.filter(o=>(sp.sub[bad.code]||[]).includes(o.id)).map(o=>o.n);
    return ' → ' + esc(opts.join(' or '));
  };

  return `<div class="verdict">
    <h3>${esc(name)}</h3>
    <div class="marks">
      <span class="mark ${okO?'ok':'no'}">Name ${okO?'correct':'missed'}</span>
      <span class="mark ${routeOk?'ok':'no'}">Route ${routeOk?'correct':'missed'+wantLine()}</span>
    </div>
    ${(okO && !routeOk) ? `<div class="warn"><strong>Right name, wrong route.</strong> Scored as a miss. A label you can’t derive from the diagnostic questions won’t survive an unfamiliar situation.</div>` : ''}
    <div class="vblock"><div class="vlab">Why</div><p>${esc(sp.why)}</p></div>
    <div class="vblock"><div class="vlab">What would falsify this reading</div><p>${esc(sp.fals)}</p></div>
    <div class="row"><button class="btn" id="detNext">Next specimen</button></div>
  </div>`;
}

function mountDetermination(subject, hostEl, state, storageKey, onAllDone){
  const specimens = subject.specimens;
  if(state.i >= specimens.length) return onAllDone();
  const sp = specimens[state.i];
  const live = detCandidates(subject, state);
  const st = state.stats;

  hostEl.innerHTML = `
    ${state.intro ? `<div class="intro">
      <h2>How this works</h2>
      ${subject.determinationIntro}
      <div class="row" style="margin-top:4px"><button class="btn" id="introGo">Start</button></div>
    </div>` : ''}
    <div class="spec-head">
      <span class="spec-no">Specimen ${String(state.i+1).padStart(2,'0')} / ${specimens.length}</span>
      ${state.intro ? '<span class="spec-set">Full determination</span>' : '<button class="linkbtn" id="introOpen">How this works</button>'}
    </div>
    <blockquote class="passage">${esc(sp.q)}</blockquote>

    <div class="rail">
      <div class="rail-head"><span>Readout · updates automatically · nothing to tap</span><span class="rail-count">${live.length} of ${subject.outcomes.length} left</span></div>
      <ul class="cands">${subject.outcomes.map(o=>`<li class="cand ${live.includes(o.id)?'':'out'}">${esc(o.n)}</li>`).join('')}</ul>
    </div>

    ${detStepsHTML(subject, state)}

    ${state.revealed ? detVerdictHTML(subject, sp, state) : `
      <div class="row">
        <button class="btn" id="detRecord" ${state.outcome?'':'disabled'}>Record determination</button>
        <button class="btn ghost" id="detSkip">Skip</button>
      </div>
      <p class="hint">Answer every step above, then name it. Right name by the wrong route counts as a miss.</p>`}

    <div class="score">
      <span>Determined <b>${st.n}</b></span>
      <span>Name correct <b>${st.label}</b></span>
      <span>Route correct <b>${st.frame}</b></span>
    </div>`;

  hostEl.querySelectorAll('[data-step] .opt').forEach(b=>b.onclick=(e)=>{
    const code = e.currentTarget.parentElement.dataset.step;
    const d = subject.determination;
    state.answers[code] = b.dataset.v;
    state.outcome = null;
    if(d.gateCode === code){
      state.answers = { [code]: state.answers[code] };
    }
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  });
  const outcomeOpts = hostEl.querySelector('#outcomeOpts');
  if(outcomeOpts) outcomeOpts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    state.outcome = b.dataset.o;
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  });

  const ig = hostEl.querySelector('#introGo');
  if(ig) ig.onclick = ()=>{
    state.intro=false;
    try{ localStorage.setItem(storageKey+':intro','done'); }catch(e){}
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  };
  const io = hostEl.querySelector('#introOpen');
  if(io) io.onclick = ()=>{ state.intro=true; mountDetermination(subject, hostEl, state, storageKey, onAllDone); };

  const rv = hostEl.querySelector('#detRecord');
  if(rv) rv.onclick = ()=>{
    const steps = correctSteps(subject, sp);
    const routeOk = steps.every(step => (sp.sub[step.code]||[]).includes(state.answers[step.code]));
    const okO = state.outcome === sp.outcome;
    st.n++; if(okO) st.label++; if(routeOk) st.frame++;
    state.revealed = true; storageSave(storageKey, st);
    mountDetermination(subject, hostEl, state, storageKey, onAllDone);
  };
  const sk = hostEl.querySelector('#detSkip');
  if(sk) sk.onclick = ()=>{ nextSpecimen(state); mountDetermination(subject, hostEl, state, storageKey, onAllDone); };
  const nxBtn = hostEl.querySelector('#detNext');
  if(nxBtn) nxBtn.onclick = ()=>{ nextSpecimen(state); mountDetermination(subject, hostEl, state, storageKey, onAllDone); };
}

function nextSpecimen(state){ state.i++; state.answers={}; state.outcome=null; state.revealed=false; }
function introSeen(storageKey){
  try{ return localStorage.getItem(storageKey+':intro')==='done'; }catch(e){ return false; }
}

const IDEOLOGY_COURSE = [
{ tag:'One', title:'The five questions',
  cards:[
  {h:'Classify by content, never by method',
   b:`<p class="lead">Most misidentification happens because people classify by how a movement <i>behaves</i> rather than what it <i>claims</i>.</p>
      <p>Rallies, censorship, secret police, purges and personality cults appear across regimes with completely opposite beliefs. They travel freely. They tell you almost nothing about ideology.</p>
      <p>What does not travel is the answer to a small set of questions about ownership, allegiance and purpose. Those are the key characters. This course teaches five of them, then drills them.</p>

{ tag:'Two', title:'The socialist family',

      <p>Ownership. Not taxation, not regulation, not spending. If productive assets stay privately owned and the state only taxes and redistributes, that is a welfare state.</p>
      <div class="warn"><strong>The most common error in English-language politics.</strong> "Government does a thing" is not socialism. Public roads, central banks, militaries and food inspection exist in every capitalist state on earth. Always ask Q1: did ownership of productive assets actually change hands?</div>
      <p>The word covers at least four incompatible things. The next cards separate them.</p>`},
  {h:'Marxism and Marxism–Leninism',
   b:`<h3>Marxism</h3>

      <ul><li>Historical materialism: economic relations drive history</li>

{ tag:'Three', title:'Fascism',
  cards:[
  {h:'A definition with actual content',
   b:`<p class="lead">A mass, anti-liberal, anti-Marxist movement organised around a myth of national decline and rebirth, pursuing regeneration through unity, discipline and often violence, led by a leader who embodies the popular will, in which the individual exists to serve the organic nation.</p>
      <p>This is the most abused word on the list. Used loosely it means "authoritarian and unpleasant," which makes it useless. Used precisely it picks out a specific thing.</p>
      <div class="note">Fascism's definition is genuinely contested among historians. Paxton emphasises process and stages, Griffin the rebirth myth, Eco a family-resemblance list; some restrict the term largely to interwar Europe. Treat what follows as a family resemblance, not a checklist requiring every item.</div>`},
  {h:'The ten markers — look for the cluster',
   b:`<ul>
      <li><b>Palingenetic ultranationalism</b> — the nation is decadent and will be reborn. The ideological core.</li>

      <li><b>Nation as organism</b> — a body with one will; the individual is a cell.</li>
      <li><b>Enemies both weak and strong</b> — contemptible yet about to overwhelm you.</li>

      <li><b>Corporatism</b> — private ownership retained under state-directed bodies; independent unions abolished.</li>
      <li><b>Militarism</b> — expansion as proof of vitality.</li>

      <p>No single item is decisive. The cluster is.</p>`},
  {h:'Three things fascism is not',
   b:`<h3>Not Nazism, exactly</h3>
      <p>Nazism is the variant where biological race, not the nation-state, is the primary unit, with antisemitism as cosmology and extermination as policy. All Nazism is fascist; not all fascism is Nazi.</p>
      <h3>Not ordinary authoritarianism</h3>
      <p>A junta or personalist dictator who wants power and quiet is authoritarian. Fascism demands <i>active participation</i>. Authoritarianism demands passivity. This is why the marker drill matters: repression is shared, mobilisation is not.</p>
      <h3>Not reactionary conservatism</h3>
      <p>The reactionary wants to <i>restore</i> throne, altar and hierarchy. The fascist wants to <i>create something new</i> through national rebirth, and will smash traditional elites to do it. Fascism is revolutionary in method however traditionalist its aesthetics.</p>`},
  {h:'"But the Nazis were socialists"',
   b:`<p>Resolve it with Q1 and Q2, not the party name.</p>
      <p><b>Q1 — ownership.</b> It stayed private. The regime privatised major state holdings in the 1930s, banned independent trade unions, destroyed the workers' parties, and directed private industry through contracts and controls. That is state-directed capitalism, not social ownership.</p>
      <p><b>Q2 — primary unit.</b> Race, constructed in explicit opposition to class. Marxism was the movement's declared mortal enemy.</p>
      <p>The name was a recruitment device aimed at working-class voters.</p>
      <div class="note">Party names are marketing. This is the same reason "Democratic People's Republic" tells you nothing about a state. Always check the answers, never the label.</div>`}

{ tag:'Four', title:'Look-alikes',
  cards:[
  {h:'Terms that are not ideologies',
   b:`<p>Several words in common use describe a <i>method</i>, a <i>degree</i>, or a <i>fragment</i> rather than a belief system. Mistaking them for ideologies causes most bad classification.</p>
      <table class="k">
      <tr><th>Term</th><th>What it actually is</th></tr>
      <tr><td>Authoritarianism</td><td>A method of rule. Compatible with almost any ideology.</td></tr>

const PSYCH_COURSE = [
{ tag:'One', title:'The diagnostic mindset',
  cards:[
  {h:'Classify by pattern, never by a single moment',
   b:`<p class="lead">Most misreads in this territory happen because someone skips straight to a label. A tense exchange becomes "he's gaslighting me." One boastful moment becomes "total narcissist."</p>
      <p>What actually discriminates isn't how uncomfortable the moment felt. It's a small set of questions about kind, pervasiveness, and function. This course teaches five of them, then drills them.</p>
      <div class="note">Throughout, a right label reached by the wrong route counts as a miss. If you can't say <i>which question</i> decided it, you've recognised a vibe, not identified a pattern.</div>`},

   b:`<table class="k">
      <tr><th>D1</th><td><b>What kind of thing is this?</b><br>a moment of reasoning / a move in an interaction / a stable way someone is<span class="tell">The fastest discriminator — decides which key you even need.</span></td></tr>
      <tr><th>D2</th><td><b>Pervasive and stable, or situational and reactive?</b><span class="tell">Separates a trait or disorder from an ordinary bad day.</span></td></tr>

      <tr><th>D5</th><td><b>What would falsify this read?</b><br>keeps the label falsifiable instead of sticky</td></tr>
      </table>
      <p>D1 and D2 do most of the work. The other three usually confirm rather than decide.</p>`},
  {h:'D1 routes you to a key',
   b:`<p>Answer D1 and you've already picked which part of this course applies:</p>
      <ul>
        <li><b>A mind justifying itself</b> → the reasoning / self-justification family (Lesson 2)</li>
        <li><b>A move in an interaction</b> → the tactics family (Lesson 5)</li>
        <li><b>A stable way someone consistently is</b> → the personality-pattern family (Lessons 3–4)</li>
      </ul>
      <p>These are genuinely different kinds of things. A single confusing moment with someone is not evidence of a personality disorder, and a personality disorder is not just "someone who did a manipulative thing once." Conflating the three is the single most common error in casual psychological talk.</p>`},

{ tag:'Two', title:'Cognitive dissonance & self-justification',
  cards:[
  {h:'The mechanism, not just "hypocrisy"',
   b:`<p class="lead">Cognitive dissonance (Festinger): the discomfort of holding two contradictory cognitions, and the drive to resolve it. The resolution does not require honestly changing your mind — there are four moves, and only one of them is that.</p>
      <ol>
        <li><b>Change the belief</b> to match the behaviour — genuine, if it happens.</li>
        <li><b>Change the behaviour</b> to match the belief — also genuine, if it happens.</li>
        <li><b>Add a justifying cognition</b> without changing either — a permission slip written after the fact.</li>
        <li><b>Discredit the source</b> of the contradicting information — the easiest move, and the most damaging.</li>
      </ol>
      <span class="tell">Tell: dissonance reduction shows up after the behaviour, as a repair job. The decision came first; the story came second.</span>`},
  {h:'Confirmation bias',
   b:`<p>Not "believing what you want" in general — specifically <b>asymmetric scrutiny</b>: confirming evidence gets accepted lightly; disconfirming evidence gets picked apart or waved off as an exception.</p>
      <span class="tell">Tell: ask how much scrutiny each type of evidence received. If confirming evidence sailed through and disconfirming evidence got cross-examined, that's the signature.</span>`},
  {h:'Motivated reasoning',
   b:`<p>The conclusion is fixed <b>before</b> the reasoning starts; the reasoning is reverse-engineered to arrive somewhere it was already going. This is the easiest thing in the family to confuse with dissonance reduction.</p>
      <span class="tell">Tell: dissonance reduction responds to discomfort that arrives after a behaviour. Motivated reasoning starts with the destination already chosen — sometimes before any specific behaviour has even happened.</span>`},
  {h:'Sunk cost / escalation of commitment',
   b:`<p>Justifying further investment — money, time, a relationship — by appeal to what's already been spent, rather than by what the future investment is actually worth. Often <i>powered by</i> dissonance: admitting the first four years were wasted is exactly the discomfort avoided by spending a fifth.</p>
      <span class="tell">Tell: the stated reason points backward ("I've already put in so much"), not forward ("this is still worth it").</span>`},
  {h:'Changing your mind is not a bias',
   b:`<p>If someone updates a belief because the evidence genuinely warranted it — and can say what would have moved them the other way too — that's reasoning working correctly, not a distortion.</p>
      <div class="note">The tell is direction: did the evidence lead to the conclusion, or did the conclusion lead the search for evidence? Treating all belief change as suspect is itself a mistake — the mirror image of never updating at all.</div>`}
  ],
  drill:{kind:'pick', key:'u2'} },

{ tag:'Three', title:'The narcissism spectrum',
  cards:[
  {h:'Not one dial',
   b:`<p class="lead">Confidence, self-esteem, and narcissism get used interchangeably. They are three different things.</p>
      <ul>
        <li><b>Confidence</b> — situational belief in your ability to do a specific thing.</li>
        <li><b>Self-esteem</b> — a general, stable sense of your own worth. Compatible with genuine warmth and real empathy.</li>
        <li><b>Narcissism</b> — a self-concept organised around being exceptional, requiring external admiration, structurally low in empathy for anyone whose function isn't to supply that admiration.</li>
      </ul>
      <div class="note">The discriminator is not confidence level. It's what happens to the person's regard for <i>other people</i> once the confidence gets tested.</div>`},
  {h:'Grandiose narcissism',
   b:`<p>The stereotype, and the easier one to spot: overt, entitled, dominance-seeking, requires admiration, name-drops achievements unprompted, reacts to criticism with contempt or rage (<b>narcissistic injury</b>), treats relationships instrumentally.</p>
      <span class="tell">Tell: the mask cracks outward, as aggression toward whoever threatened it.</span>`},
  {h:'Vulnerable narcissism',
   b:`<p>The one people miss constantly, because it doesn't look like the stereotype at all: covert, hypersensitive to any perceived slight, chronically feels under-appreciated and wronged, avoids risk rather than seeking dominance — but still fundamentally organised around the self, still low in empathy for others' independent reality.</p>
      <span class="tell">Tell: the mask cracks inward, as withdrawal, self-pity, and quiet resentment — the same structure as the grandiose form, turned in on itself.</span>`},
  {h:'The actual clinical criteria, stated plainly',
   b:`<p>A pervasive pattern, present by early adulthood and across contexts, of: grandiosity, need for excessive admiration, and lack of empathy — typically alongside several of: entitlement, exploitation, envy, arrogance, fantasies of unlimited success, belief in being special.</p>
      <div class="warn"><strong>The two words that matter most: pervasive and impairing.</strong> Most people show two or three of these sometimes. That is not the disorder. The disorder requires the pattern to be the person's stable operating mode, not their behaviour under stress, threat, or grief.</div>`}
  ],
  drill:{kind:'pick', key:'u3'} },

{ tag:'Four', title:'Look-alikes and false friends',
  cards:[
  {h:'Narcissistic vs. borderline pattern',
   b:`<table class="k">
      <tr><th></th><th>Narcissistic</th><th>Borderline</th></tr>
      <tr><td>Core fear</td><td>Being ordinary / unadmired</td><td>Being abandoned</td></tr>
      <tr><td>Self-image</td><td>Fixed grandiosity (or its vulnerable mirror)</td><td>Unstable — swings, often within one relationship</td></tr>
      <tr><td>View of others</td><td>Instrumental — a supply of admiration</td><td>Idealized, then devalued, then sometimes re-idealized</td></tr>
      <tr><td>Reaction to conflict</td><td>Contempt, dismissal, cutting off</td><td>Panic, frantic repair, or sudden devaluation</td></tr>
      </table>
      <span class="tell">Tell: "don't leave me" pulls toward borderline. "How dare you not admire me" pulls toward narcissistic.</span>`},
  {h:'Narcissistic vs. histrionic pattern',
   b:`<p>Histrionic is about being <i>noticed</i>, not necessarily admired for superiority. More emotionally expressive and theatrical in the moment; less overt entitlement; often genuinely warm and suggestible, where narcissism resists influence that doesn't flatter it.</p>
      <span class="tell">Tell: histrionic wants an audience. Narcissistic wants a mirror. Watch what happens when attention shifts to someone else — histrionic escalates for attention; narcissistic devalues whoever now has it.</span>`},
  {h:'Narcissistic vs. antisocial pattern / psychopathy',
   b:`<p>Antisocial centers on disregard for rules and others' rights — impulsivity, routine deceit, no remorse for concrete harm. It doesn't require grandiosity at all. Psychopathy adds a more totalizing absence of empathy — not the <i>selective</i> withholding narcissism shows, but a flatter, more instrumental view of people generally.</p>
      <span class="tell">Tell: a narcissist wants you to see them as superior. An antisocial/psychopathic pattern usually doesn't care what you think — only what you can be used for.</span>`},

      <p>This is the psychological equivalent of the political-ideology horseshoe error: judging by how uncomfortable the behaviour makes you, instead of by its actual content.</p>`},

{ tag:'Five', title:'Manipulation tactics & defense mechanisms',
  cards:[
  {h:'Defense mechanisms, briefly',
   b:`<p>Everyone uses defense mechanisms; the question is which ones, how rigidly, and how much reality-distortion they require.</p>
      <ul>
        <li><b>Denial</b> — refusing to register a fact at all.</li>
        <li><b>Projection</b> — attributing your own unacceptable feeling to someone else.</li>
        <li><b>Rationalization</b> — a plausible but false reason, built after the fact (dissonance reduction's usual delivery mechanism).</li>
        <li><b>Displacement</b> — redirecting an emotion toward a safer target.</li>
        <li><b>Intellectualization</b> — draining the emotion out of something by discussing it purely abstractly.</li>
      </ul>
      <p>None of these, alone, is pathological. Everyone does all five sometimes. The question is always D2: occasional, or the person's only mode?</p>`},
  {h:'Gaslighting',
   b:`<p>Specifically: a <i>pattern</i>, over time, of denying another person's memory, perception, or feelings in order to make them distrust their own judgment — not a single instance of being wrong, and not ordinary disagreement.</p>
      <span class="tell">Tell: repetition + escalation + the functional effect that the other person starts pre-emptively doubting themselves. A single "that's not what happened" is not gaslighting. Years of it, until you stop trusting your own memory, is.</span>`},
  {h:'DARVO',
   b:`<p><b>D</b>eny, <b>A</b>ttack, <b>R</b>everse <b>V</b>ictim and <b>O</b>ffender — deny the act happened, attack the accuser's credibility, reframe the accuser as the real aggressor. Named and studied by psychologist Jennifer Freyd.</p>
      <span class="tell">Tell: it's the sequence, not just defensiveness. All three parts, in that order, in one exchange, is the signature.</span>`},
  {h:'Love-bombing → devaluation',
   b:`<p>Rapid, intense idealization and attention early on — disproportionate to how long or how well the person is actually known — that creates dependency, followed by withdrawal or criticism once the attachment is secured.</p>
      <span class="tell">Tell: speed and intensity relative to actual depth of knowledge, and its conditionality. Genuine early enthusiasm is common and not a red flag by itself; the tell is that it functions as an investment called in later.</span>`},
  {h:'The trap: everything becomes manipulation',
   b:`<p>Most defensiveness in an argument is not a tactic. Most disagreement is not gaslighting. Most early-relationship excitement is not love-bombing.</p>
      <div class="warn"><strong>The discriminator is pattern + function, not a single uncomfortable moment.</strong> Calling every instance of someone being wrong about a shared memory "gaslighting" empties the word of the thing it was built to name.</div>`}
  ],
  drill:{kind:'pick', key:'u5'} },

      <p>For each specimen: answer D1 (the domain), then the two questions specific to that domain, then name it. A readout between the scenario and the questions crosses off outcomes your answers have eliminated.</p>

        {id:'nothing_x', n:'Nothing — the comparison already holds',      keeps:['comp_ok']}
    ]}
  ],
  cause: [
    { code:'K1', label:'What else could produce this exact pattern', options:[
        {id:'third',     n:'Something driving both sides at once',        keeps:['confound']},
        {id:'backwards', n:'The effect could be producing the cause',     keeps:['reverse']},
        {id:'extreme',   n:'The group was picked for being extreme, and drifted back', keeps:['regression']},
        {id:'none_k',    n:'Nothing plausible — the design rules the alternatives out', keeps:['cause_ok']}
    ]},
    { code:'K2', label:'What would settle it', options:[
        {id:'adjust',    n:'Holding the third variable fixed',            keeps:['confound']},
        {id:'timing',    n:'Knowing which one came first',                keeps:['reverse']},
        {id:'untreated', n:'Watching an equally extreme group left alone',keeps:['regression']},
        {id:'already',   n:'Already settled — randomised, or the alternatives are closed off', keeps:['cause_ok']}
    ]}
  ]
};

const STATS_COURSE = [
{ tag:'One', title:'The pipeline',
  cards:[
  {h:'Audit the pipeline, not the number',
   b:`<p class="lead">Almost nobody lies with statistics by inventing a figure. The number is usually correct. What goes wrong happened before the number existed — in who was counted, in what was counted, in what it was set against, and in what it was said to prove.</p>
      <p>So arguing with the figure is the wrong move, and so is the reflex of distrusting anything numerical. Both leave you unable to tell a good claim from a bad one, which is the only skill worth having here.</p>
      <p>Every statistical claim is the output of a pipeline with four stages. This course walks the pipeline in order and asks one question at each stage.</p>
      <div class="note">Throughout, a right label reached by the wrong route counts as a miss. If you cannot say <i>which stage</i> broke, you have registered a smell, not diagnosed a claim.</div>`},
  {h:'The four stages',
   b:`<table class="k">
      <tr><th>S1</th><td><b>Who got counted?</b><br>which cases made it into the data at all<span class="tell">Faults here cannot be repaired downstream.</span></td></tr>
      <tr><th>S2</th><td><b>What does the number count?</b><br>the definition, the instrument, the effort spent looking<span class="tell">Ask what would have to change in the world for this number to move.</span></td></tr>
      <tr><th>S3</th><td><b>What is it set against?</b><br>the contrast, the denominator, the base rate<span class="tell">A number alone carries no information.</span></td></tr>
      <tr><th>S4</th><td><b>What does it say caused what?</b><br>the leap from a pattern to an explanation<span class="tell">The famous stage, and the least often decisive.</span></td></tr>
      </table>
      <p>Run them in that order. They are not a menu.</p>`},
  {h:'Stop at the first break',
   b:`<p>The stages are sequential, and a fault upstream contaminates everything after it. If the sample was assembled out of survivors, there is no point debating whether the correlation is causal — you are reasoning about a population that does not exist.</p>
      <p>So the diagnostic question is not <i>what is wrong with this claim</i>, which usually has several answers. It is <b>where does it first break</b>, which has one.</p>
      <div class="warn"><strong>This is the discipline the key enforces.</strong> A claim can be guilty at three stages at once. Name the earliest, because that is the one that decides whether anything downstream is worth examining.</div>`},
  {h:'"No fault" is a real answer',
   b:`<p>Every stage in this course has a sound option, and roughly one specimen in five is clean. This is deliberate.</p>
      <p>A key that only ever outputs faults is not a diagnostic instrument, it is a mood. The person who can say <i>this one is fine, and here is why</i> is the one whose objections are worth listening to when they do object.</p>
      <p>Learn the shape of a sound claim — random frame with non-response chased, a stable definition, a like-for-like contrast, randomised assignment — so that its absence is something you notice rather than something you argue yourself into.</p>`}
  ],
  drill:{kind:'pick', key:'v1'} },

{ tag:'Two', title:'Who got counted',
  cards:[
  {h:'The move: picture who is missing',
   b:`<p class="lead">Sampling faults share one shape. The data was assembled by a process that had opinions about which cases to include, and the excluded cases are the ones that would change the answer.</p>
      <p>The move is always the same: describe the cases that are not in front of you, then ask what they would do to the conclusion. If you cannot answer, you do not yet know what the number means.</p>`},
  {h:'The four sampling faults',
   b:`<table class="k">
      <tr><th>A</th><td><b>Survivorship</b> — the population was defined at the end of the window<span class="tell">The failures were removed by the act of assembling the data.</span></td></tr>
      <tr><th>B</th><td><b>Self-selection</b> — subjects put themselves in<span class="tell">Whatever motivated them to join also predicts their answer.</span></td></tr>
      <tr><th>C</th><td><b>Non-response</b> — the frame was right, the returns were not<span class="tell">The silent differ from the responders in the direction of the question.</span></td></tr>
      <tr><th>D</th><td><b>Small-number volatility</b> — nobody is missing, the denominator is tiny<span class="tell">Extremes at both ends of the table are the same phenomenon.</span></td></tr>
      </table>
      <p>The first three are about who is absent. The fourth is about how few are present — no bias at all, just arithmetic.</p>`},
  {h:'Small numbers deserve their own reflex',
   b:`<p>Give a rate a denominator of a few thousand and it will swing violently on one or two cases. This produces league tables in which the very best and the very worst entries are both small, and it produces "clusters" that are the expected clumping of random points.</p>
      <div class="note"><strong>The check takes five seconds:</strong> look at the other end of the same table. If small units dominate the top <i>and</i> the bottom, size is producing the ranking, not quality.</div>
      <p>Percentages hide this completely. "Up 200%" is three cases where there was one.</p>`},
  {h:'Size does not fix selection',
   b:`<p>The most persistent error in this stage is believing that a big enough sample repairs a bad one. It does not, and it never has.</p>
      <p>Two thousand self-selected website respondents are worse than four hundred randomly drawn ones, because increasing n reduces random error while leaving the systematic error exactly where it was. A large biased sample is a precise estimate of the wrong quantity.</p>
      <div class="warn"><strong>Watch for size cited as a defence.</strong> "We surveyed forty thousand people" answers a question nobody asked if all forty thousand opted in.</div>`}
  ],
  drill:{kind:'pick', key:'v2'} },

{ tag:'Three', title:'What the number counts',
  cards:[
  {h:'The counterfactual test',
   b:`<p class="lead">At this stage the sample is fine and the arithmetic is fine. The question is whether the number is still attached to the thing it is supposed to represent.</p>
      <p>One question does most of the work here: <b>if the underlying reality had not moved at all, could this number still have moved?</b> Three answers say yes, and each names a different fault.</p>`},
  {h:'Three ways a number detaches',
   b:`<table class="k">
      <tr><th>A</th><td><b>Proxy failure</b> — the measure became the target<span class="tell">Goodhart: a measure that becomes a target stops being a good measure.</span></td></tr>
      <tr><th>B</th><td><b>Definition changed</b> — same word, new counting rule<span class="tell">The ruler was rewritten mid-series.</span></td></tr>
      <tr><th>C</th><td><b>Detection effect</b> — more looking, not more happening<span class="tell">Screening, reporting drives, new awareness campaigns.</span></td></tr>
      </table>
      <p>All three produce a moving series over a still world. They are told apart by what moved: the incentive, the rule, or the effort.</p>`},
  {h:'Proxies are not lies, they are load-bearing approximations',
   b:`<p>Waiting times stand in for good emergency care. Test scores stand in for learning. Tickets closed stand in for support quality. Every one of these is a reasonable proxy right up until someone is paid on it.</p>
      <p>Then effort flows to the number rather than the thing, the two come apart, and the series improves while the world does not. The improvement is real — as a measurement of the measurement.</p>
      <div class="note"><strong>The tell is a target announced.</strong> Whenever a passage says a metric became the central measure, ask what happened to the parts of the job the metric does not see.</div>`},
  {h:'Detection: the mortality check',
   b:`<p>Detection effects are the hardest of the three to see, because a genuine rise and a rise in looking produce the same headline.</p>
      <p>The check is to find a downstream measure that harder looking cannot inflate. For disease, that is deaths and advanced-stage presentations. If diagnoses rise fifteen-fold and deaths are flat, the extra fourteen-fold was always there, unfound and mostly harmless.</p>
      <p>The same trick generalises. For crime, ask about homicides or hospital admissions for assault — the offences whose recording barely depends on whether anyone was asked to look.</p>`}
  ],
  drill:{kind:'pick', key:'v3'} },

{ tag:'Four', title:'What it is set against',
  cards:[
  {h:'A number alone carries no information',
   b:`<p class="lead">Ninety percent improved. Risk up 18%. Mortality 3.1%. None of these means anything until you know the quantity it is being held against — and the most effective way to mislead with a true number is to publish it without its comparison.</p>
      <p>Four faults live here, and each is repaired by supplying one specific missing quantity.</p>`},
  {h:'What each one is missing',
   b:`<table class="k">
      <tr><th>A</th><td><b>No comparison group</b> → supply an untreated group<span class="tell">Most conditions improve on their own; that rate is the floor.</span></td></tr>
      <tr><th>B</th><td><b>Relative risk alone</b> → supply the absolute numbers<span class="tell">18% of a 6% baseline is one extra case per hundred.</span></td></tr>
      <tr><th>C</th><td><b>Base-rate neglect</b> → supply the prevalence<span class="tell">Test accuracy is not the probability you are ill.</span></td></tr>
      <tr><th>D</th><td><b>Simpson’s paradox</b> → split the total back into subgroups<span class="tell">The aggregate can reverse every subgroup at once.</span></td></tr>
      </table>`},
  {h:'Base rates: the hundred-people move',
   b:`<p>Conditional probability defeats intuition reliably enough that you should stop trying to reason about it in percentages and just count bodies.</p>
      <p>Ten thousand people. One in ten thousand has the condition, so one person has it, and the test finds them. The test also wrongly flags 1% of the 9,999 who do not — about a hundred people. So a hundred and one positives, of whom one is real.</p>
      <div class="note"><strong>A 99% accurate test yielded a positive result that is roughly 99% likely to be wrong.</strong> Nothing about the test is faulty. The prevalence was doing the work all along.</div>`},
  {h:'Simpson’s paradox is not an exotic case',
   b:`<p>It appears wherever a total is computed across subgroups of different sizes and different underlying rates — hospital mortality, university admissions, batting averages, treatment success by clinic.</p>
      <p>The referral hospital takes the hardest cases. Its combined mortality is worse than the district general even when it is better in every category. Both numbers are correct; only one answers the question a patient is asking.</p>
      <p>Whenever a comparison rests on two totals, ask what the totals are averaging over — and whether the mix differs between them.</p>`}
  ],
  drill:{kind:'pick', key:'v4'} },

{ tag:'Five', title:'What caused what',
  cards:[
  {h:'Three alternatives, not one slogan',
   b:`<p class="lead">"Correlation does not imply causation" is where most people stop, and stopping there is nearly as bad as not knowing it. It names no alternative, so it cannot be checked, and it dismisses good and bad studies at exactly the same cost.</p>
      <p>There are three specific alternatives to a causal reading. Name the one you mean, and say which way it would push.</p>`},
  {h:'The three alternatives',
   b:`<table class="k">
      <tr><th>A</th><td><b>Confounding</b> — a third thing drives both<span class="tell">Name the variable. "Income" is an argument; "confound" is not.</span></td></tr>
      <tr><th>B</th><td><b>Reverse causation</b> — the effect is producing the cause<span class="tell">Settled by sequence: which one moved first?</span></td></tr>
      <tr><th>C</th><td><b>Regression to the mean</b> — the group was selected for being extreme<span class="tell">Needs no mechanism and no third variable. Pure measurement.</span></td></tr>
      </table>`},
  {h:'Regression to the mean is the one you will miss',
   b:`<p>Any measurement is part real signal and part noise on the day. Select a group for having the most extreme scores and you have selected, among other things, for the ones whose noise ran hardest in one direction. Measure again and that component averages out.</p>
      <p>The group improves. Nothing caused it. Whatever you did in between gets the credit.</p>
      <div class="warn"><strong>This is why "we treated the worst cases and they improved" is not evidence.</strong> It is also why praise appears to backfire and criticism appears to work: both are administered after extreme performances, and both are followed by ordinary ones.</div>`},
  {h:'What randomisation actually buys',
   b:`<p>Random assignment closes off confounding and reverse causation by construction — unmeasured third variables land in both arms by chance, and an assignment made before any outcome exists cannot have been caused by one.</p>
      <p>That is why the sound specimens in this course are almost all randomised. It is also why the check does not end there: broken blinding, differential dropout, or outcomes ascertained more keenly in one arm reopen the questions randomisation was meant to close.</p>
      <div class="note"><strong>Observational evidence is not worthless.</strong> A named confound that has been measured and adjusted for, a dose-response relationship, and a plausible mechanism together can carry a causal claim. Demanding a trial for everything is a way of never updating.</div>`}
  ],
  drill:{kind:'pick', key:'v5'} },

{ tag:'Six', title:'Claims that engage nothing',
  cards:[
  {h:'The residual category',
   b:`<p class="lead">Some claims cannot be run through the key at all. There is no sample to describe, no definition to check, no contrast to supply — just a number-shaped object doing rhetorical work.</p>
      <p>These are not hard cases. They are the most common ones, and the failure mode is treating them as though they deserve the full procedure.</p>`},
  {h:'Two symmetrical errors',
   b:`<p>The first is the credulous one: a figure is quoted, it sounds specific, and specificity is mistaken for evidence. Nine out of ten dentists.</p>
      <p>The second is the corrosive one: <i>correlation is not causation</i>, <i>you can prove anything with statistics</i>, <i>that study was funded by someone</i> — deployed to dismiss without engaging a single stage of the pipeline.</p>
      <div class="warn"><strong>Both errors have the same structure.</strong> Neither asks a question that could come back with an answer. The drill below is practice at saying exactly which question a claim refuses to engage.</div>`}
  ],
  drill:{kind:'err'} },

{ tag:'Seven', title:'Full determination',
  cards:[
  {h:'Running the whole key',
   b:`<p class="lead">Now the stages come without labels. Read the claim, decide where it first breaks, work the two questions under that stage, and name the fault.</p>
      <p>The readout crosses off what your answers have ruled out. Your name and your route are scored separately, and a right name from the wrong route counts as a miss — because a fault you cannot locate is one you will not find again in an unfamiliar claim.</p>
      <div class="note">Roughly one specimen in five is sound. Naming it sound is a determination, not a pass.</div>`}
  ],
  drill:{kind:'det'} }
];

const STATISTICS = {
  id:'stats', name:'Statistical Claims', eyebrow:'Diagnostic instrument · Rev. 1',
  intro:'Walk each claim down the pipeline — who was counted, what was counted, what it is set against, what it is said to prove — and name the earliest stage that breaks. A correct label reached by the wrong route is scored as a miss.',
  outcomes: STATS_OUTCOMES,
  determination: { gateCode:'S1', steps:[STATS_GATE], stepsByGate:STATS_STEPS_BY_GATE },
  determinationIntro:`<p>You are walking each claim down a four-stage pipeline. Find the earliest stage that breaks, work the two questions under it, and name the fault last.</p>
      <ol>
        <li>Read the claim.</li>
        <li><b>Step 1</b> — where does it <i>first</i> break: who got counted, what the number counts, what it is set against, or what it says caused what? Several stages may be faulty; name the earliest, because it decides whether anything downstream is worth examining.</li>
        <li><b>Steps 2–3</b> — the two questions specific to that stage. They unlock in order and change with your Step 1 answer.</li>
        <li><b>Step 4</b> — now name it, and record your determination.</li>
      </ol>
      <p>The strip between the claim and step 1 is a readout, not a control. It crosses off faults your answers have ruled out. Nothing there is tappable.</p>
      <p>Roughly one specimen in five is sound, and every stage offers a no-fault option. Naming a claim sound is a determination like any other.</p>
      <p>Your name and your route are scored separately. Right name from the wrong steps counts as a miss.</p>`,
  specimens: STATS_SPECIMENS,
  quickDrills: [
    {key:'v1', title:'Which stage', prompt:'Where does this claim first break?', items:V1_DRILL, opts:V1_OPTS},
    {key:'v2', title:'Who got counted', prompt:'Which sampling fault — if any?', items:V2_DRILL, opts:V2_OPTS},
    {key:'v3', title:'What it counts', prompt:'What happened to the measure?', items:V3_DRILL, opts:V3_OPTS},
    {key:'v4', title:'The comparison', prompt:'What is missing from the contrast?', items:V4_DRILL, opts:V4_OPTS},
    {key:'v5', title:'Cause or pattern', prompt:'Which alternative to the causal reading?', items:V5_DRILL, opts:V5_OPTS}
  ],
  errDrill: STATS_ERR,
  course: STATS_COURSE,
  tabs: [
    {key:'course', label:'Course'}, {key:'det', label:'Determination'},
    {key:'v1', label:'Which stage'}, {key:'v2', label:'Who got counted'}, {key:'v3', label:'What it counts'},
    {key:'v4', label:'The comparison'}, {key:'v5', label:'Cause or pattern'},
    {key:'err', label:'Faulty claims'}, {key:'reference', label:'Reference'}
  ],
  caveats:`<ul>
    <li><b>Naming a fault is not refuting a claim.</b> "Confound" on its own is a noise. Name the variable, say which direction it would push, and estimate whether it is big enough to account for the effect — otherwise you have raised a possibility, not an objection.</li>
    <li><b>Real claims often break at several stages at once.</b> "Where does it first break" is a teaching convention that forces a single defensible answer; it is not a law about how claims fail.</li>
    <li><b>Professional statistics has tools for all of these</b> — weighting, adjustment, instrumental variables, sensitivity analysis, inverse-probability weighting for non-response. A confound that has been measured and handled is in a different category from one that was never mentioned.</li>
    <li><b>Absence of a fault you can name is not proof a claim is true.</b> The key finds specific breakages. A claim can pass all four stages and still be wrong, underpowered, or a fluke.</li>
    <li><b>This key is about validity, not magnitude.</b> It says nothing about effect sizes, confidence intervals, or whether a real effect is large enough to act on — which is usually the question that actually matters.</li>
    <li><b>Faults of the literature sit outside the pipeline.</b> Publication bias, p-hacking, multiple comparisons and the garden of forking paths are properties of how a body of research was produced, not of the sentence in front of you. A single well-built study drawn from a badly built literature will pass this key cleanly.</li>
    <li><b>These terms are also weapons.</b> "Cherry-picked," "biased sample," "correlation isn’t causation" are used to dismiss unwelcome findings at least as often as to examine them. Applying the key selectively to claims you dislike is the failure mode this course is most likely to produce.</li>
  </ul>`
};
