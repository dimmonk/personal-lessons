<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Key to Political Ideologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#d5d9d1;
  --sheet:#f3f2ed;
  --sheet-2:#e9e8e1;
  --ink:#14181d;
  --ink-soft:#4c545a;
  --rule:#aab0a6;
  --rule-fine:#c6cabf;
  --brass:#7a6636;
  --brass-lite:#a08a4e;
  --herb:#3a5c46;
  --iron:#8c3a2e;
  --shadow:0 1px 0 rgba(20,24,29,.10), 0 10px 24px -18px rgba(20,24,29,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--board);
  background-image:linear-gradient(rgba(20,24,29,.025) 1px,transparent 1px);
  background-size:100% 3px;
  color:var(--ink);
  font-family:'Spectral',Georgia,serif;
  font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px}

/* ---------- masthead ---------- */
.mast{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.mast .eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);margin:0 0 6px
}
.mast h1{
  font-family:'Zilla Slab',serif;font-weight:700;font-size:clamp(27px,6.2vw,40px);
  line-height:1.02;margin:0;letter-spacing:-.015em
}
.mast p{margin:8px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:52ch}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:3px;margin:16px 0 0}
.tab{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;padding:8px 11px 7px;border:1px solid var(--rule);
  border-bottom:none;background:var(--sheet-2);color:var(--ink-soft);
  cursor:pointer;border-radius:3px 3px 0 0;position:relative;top:1px
}
.tab:hover{background:var(--sheet);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--ink);font-weight:600;border-color:var(--ink);border-bottom:1px solid var(--sheet)}

/* ---------- sheet ---------- */
.sheet{
  background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);
  padding:20px 18px 22px;border-radius:0 3px 3px 3px
}

/* ---------- specimen ---------- */
.spec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule-fine);padding-bottom:8px;margin-bottom:16px}
.spec-no{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.spec-set{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}

blockquote.passage{
  margin:0 0 20px;padding:14px 16px;background:var(--sheet-2);border-radius:3px;
  font-size:18px;line-height:1.6;font-style:italic;color:var(--ink)
}
blockquote.passage.plain{font-style:normal;font-size:17px}

/* ---------- steps ---------- */
.step{margin:0 0 18px}
.step.locked{opacity:.55;pointer-events:none}
.step-label{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--brass);display:flex;align-items:center;gap:7px;margin-bottom:8px
}
.step-label .code{background:var(--ink);color:var(--sheet);padding:2px 5px;border-radius:2px;font-weight:600;letter-spacing:.06em}
.step-label .num{
  width:19px;height:19px;flex:0 0 19px;border-radius:50%;background:var(--brass);color:var(--sheet);
  display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:10.5px;letter-spacing:0
}
.step.locked .step-label .num{background:var(--rule)}
.lockmsg{margin-left:auto;font-style:normal;color:var(--ink-soft);letter-spacing:.06em;
  border:1px dashed var(--rule);padding:2px 7px;border-radius:2px;text-transform:none;font-size:10px}

/* ---------- intro ---------- */
.intro{border:1px solid var(--ink);background:var(--sheet-2);padding:15px 15px 13px;margin:0 0 18px;border-radius:2px}
.intro h2{font-family:'Zilla Slab',serif;font-size:17px;margin:0 0 9px}
.intro ol{margin:0 0 10px;padding-left:19px;font-size:15px}
.intro ol li{margin-bottom:5px}
.intro p{margin:0 0 10px;font-size:14.5px;color:var(--ink-soft)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--brass);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{
  font-family:'Zilla Slab',serif;font-size:14.5px;font-weight:500;
  padding:8px 12px;background:var(--sheet-2);border:1px solid var(--rule);
  color:var(--ink);cursor:pointer;border-radius:2px;text-align:left;line-height:1.25
}
.opt:hover{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.05em;opacity:.62;font-weight:400;margin-top:2px;text-transform:uppercase}

/* ---------- determination rail ---------- */
.rail{border:1px solid var(--rule);background:var(--sheet-2);padding:12px 13px;margin:0 0 18px;border-radius:2px;
  cursor:default;user-select:none}
.rail-head{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px}
.rail-count{color:var(--brass);font-weight:600}
.cands{display:flex;flex-wrap:wrap;gap:5px 9px;margin:0;padding:0;list-style:none}
.cand{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;color:var(--ink);
  transition:color .28s ease,opacity .28s ease}
.cand.out{color:var(--ink-soft);opacity:.4;text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- verdict ---------- */
.verdict{border-top:2px solid var(--ink);margin-top:20px;padding-top:16px}
.verdict h3{font-family:'Zilla Slab',serif;font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.mark{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;border:1px solid}
.mark.ok{color:var(--herb);border-color:var(--herb);background:rgba(58,92,70,.07)}
.mark.no{color:var(--iron);border-color:var(--iron);background:rgba(140,58,46,.07)}
.vblock{margin:0 0 12px}
.vblock .vlab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--brass);margin-bottom:3px}
.vblock p{margin:0;font-size:16px;line-height:1.55}

/* ---------- buttons ---------- */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:11px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);
  cursor:pointer;border-radius:2px
}
.btn:hover{background:#000}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sheet-2)}

/* ---------- score strip ---------- */
.score{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  border-top:1px solid var(--rule-fine);margin-top:18px;padding-top:11px}
.score b{color:var(--ink);font-weight:600}

/* ---------- field guide ---------- */
details.fg{border-bottom:1px solid var(--rule-fine);padding:0}
details.fg:last-of-type{border-bottom:none}
details.fg summary{
  cursor:pointer;padding:13px 2px;font-family:'Zilla Slab',serif;font-weight:600;font-size:17px;
  list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px
}
details.fg summary::-webkit-details-marker{display:none}
details.fg summary::after{content:'+';font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:16px}
details.fg[open] summary::after{content:'\2212'}
.fg-body{padding:0 2px 16px;font-size:15.5px}
.fg-body p{margin:0 0 10px}
.fg-body ul{margin:0 0 10px;padding-left:18px}
.fg-body li{margin-bottom:5px}
.fg-body .tell{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.02em;
  color:var(--brass);text-transform:none;display:block;margin-top:4px}
.fg-body h4{font-family:'Zilla Slab',serif;font-size:15.5px;margin:16px 0 5px}
.warn{border:1px solid rgba(140,58,46,.35);background:rgba(140,58,46,.07);border-radius:3px;padding:11px 13px;margin:12px 0}
.warn strong{color:var(--iron)}
table.k{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px}
table.k th,table.k td{border:1px solid var(--rule-fine);padding:7px 9px;text-align:left;vertical-align:top}
table.k th{background:var(--sheet-2);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600}

.hint{font-size:14px;color:var(--ink-soft);margin:10px 0 0}
.done{text-align:center;padding:26px 6px}
.done h2{font-family:'Zilla Slab',serif;font-size:24px;margin:0 0 6px}

:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .wrap{padding:16px 12px 80px}
  .sheet{padding:16px 13px 18px}
  blockquote.passage{font-size:16.5px;padding-left:13px}
  .opt{font-size:14px;padding:8px 10px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <p class="eyebrow">Diagnostic instrument · Rev. 3</p>
    <h1>Field Key to Political Ideologies</h1>
    <p>Run each specimen through the key characters before naming it. A correct label reached by the wrong route is scored as a miss.</p>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="det" aria-selected="true">Determination</button>
    <button class="tab" role="tab" data-tab="unit" aria-selected="false">Primary unit</button>
    <button class="tab" role="tab" data-tab="soc" aria-selected="false">Socialist family</button>
    <button class="tab" role="tab" data-tab="fasc" aria-selected="false">Marker sort</button>
    <button class="tab" role="tab" data-tab="err" aria-selected="false">Faulty claims</button>
    <button class="tab" role="tab" data-tab="guide" aria-selected="false">Field guide</button>
  </div>

  <main class="sheet" id="stage"></main>
</div>

<script>
/* ============================ DATA ============================ */

const FAMILIES = [
  {id:'marx',   n:'Marxism'},
  {id:'ml',     n:'Marxism–Leninism'},
  {id:'demsoc', n:'Democratic socialism'},
  {id:'socdem', n:'Social democracy'},
  {id:'anarch', n:'Anarchism / libertarian socialism'},
  {id:'mktsoc', n:'Market socialism'},
  {id:'clib',   n:'Classical liberalism'},
  {id:'react',  n:'Reactionary conservatism'},
  {id:'fasc',   n:'Fascism'},
  {id:'nazi',   n:'Nazism'},
  {id:'natpop', n:'National populism'},
  {id:'idegal', n:'Identity-egalitarianism'},
  {id:'pop',    n:'Populism (thin — unresolved)'}
];

const UNITS = [
  {id:'class',  n:'Class',              sub:'owners vs sellers of labour',
   keeps:['marx','ml','demsoc','socdem','anarch','mktsoc']},
  {id:'nation', n:'Nation',             sub:'organic people / homeland',
   keeps:['fasc','nazi','natpop','react']},
  {id:'race-h', n:'Race or identity',   sub:'hierarchical valence',
   keeps:['nazi','fasc']},
  {id:'race-e', n:'Race or identity',   sub:'egalitarian valence',
   keeps:['idegal']},
  {id:'indiv',  n:'Individual',         sub:'self-directing person',
   keeps:['clib']},
  {id:'trad',   n:'Tradition & faith',  sub:'inherited order, throne & altar',
   keeps:['react']},
  {id:'people', n:'People vs elite',    sub:'the real majority vs the corrupt few',
   keeps:['natpop','pop']}
];

const OWNERSHIP = [
  {id:'private',  n:'Private, untouched',        sub:'Q1',
   keeps:['clib','react','idegal','pop']},
  {id:'directed', n:'Private but state-directed',sub:'Q1',
   keeps:['fasc','nazi','natpop']},
  {id:'public',   n:'State or public ownership', sub:'Q1',
   keeps:['ml','demsoc','marx']},
  {id:'worker',   n:'Worker-collective',         sub:'Q1',
   keeps:['anarch','demsoc','marx','mktsoc']},
  {id:'redist',   n:'Private + heavy redistribution',sub:'Q1',
   keeps:['socdem','idegal','mktsoc']},
  {id:'unspec',   n:'Not stated in the passage', sub:'Q1',
   keeps:null}
];

const SPECIMENS = [
  {q:'The soil of the fatherland has been poisoned by soft men and foreign ideas. We do not ask for votes; we ask for obedience, and in return we will give you a nation your grandchildren will die for gladly.',
   unit:['nation'], own:['unspec'], fam:'fasc',
   why:'Q2 is the nation; Q3 is decline followed by rebirth; Q4 openly abolishes electoral legitimacy ("we do not ask for votes"). Add the cult of sacrifice and the fascist cluster is complete.',
   fals:'Pure restorationist monarchism with no mass mobilisation and no rebirth myth would make this reactionary conservatism instead.'},

  {q:'Wages appear to be payment for a day\u2019s work. They are not. The worker produces more value in a day than he is paid for; the remainder is taken. This is not theft by a bad employer — it is the ordinary functioning of the system.',
   unit:['class'], own:['unspec'], fam:'marx',
   why:'Surplus value stated almost verbatim. The decisive tell is the last sentence: the framing is systemic, not moral. Marxism indicts the mode of production, not bad actors inside it.',
   fals:'If the proposed remedy were merely higher wages within capitalism, this would be labour reformism borrowing Marxist vocabulary.'},

  {q:'We propose a national minimum wage, sectoral bargaining, twelve months\u2019 parental leave, and free university. Business will continue to be privately owned and we will keep the budget balanced.',
   unit:['class'], own:['redist'], fam:'socdem',
   why:'Q1 is answered explicitly and in the negative: ownership does not move. Floors, rights and transfers, plus fiscal orthodoxy. This is the welfare state, not social ownership.',
   fals:'A nationalisation plank would push it into democratic socialism.'},

  {q:'The state, however benevolent, is a machine for coercion. We will not capture it; we will dissolve it. Production will be run by the assemblies of those who do the producing.',
   unit:['class'], own:['worker'], fam:'anarch',
   why:'Anti-capitalist and anti-statist simultaneously — that pairing belongs to no other family. Refusing to capture the state rules out every parliamentary and vanguard route.',
   fals:'Any transitional-state or vanguard-party language would make it Leninist.'},

  {q:'Order requires that men know their place. The monarchy, the church, and the family were dismantled by ideologues, and nothing built since has replaced them. We seek restoration, not revolution.',
   unit:['trad'], own:['unspec'], fam:'react',
   why:'Q3 is the restoration of a divine-traditional order, and the final clause explicitly disclaims revolution. That disclaimer is precisely what rules out fascism.',
   fals:'Add a mass movement, a leader principle and rebirth-through-violence and it crosses into fascism — the aesthetics would barely change.'},

  {q:'The masses cannot arrive at revolutionary consciousness on their own; left alone they achieve only trade-union consciousness. They require a disciplined party to lead them.',
   unit:['class'], own:['unspec'], fam:'ml',
   why:'A near-paraphrase of the vanguard argument. The acting subject of history has shifted from the class to the party — that shift is the whole of Leninism.',
   fals:'If the party were subordinated to elected worker assemblies, you are closer to council communism.'},

  {q:'Government\u2019s role is to enforce contracts, defend the borders, and otherwise leave people alone. Prosperity is what happens when free individuals trade without permission.',
   unit:['indiv'], own:['private'], fam:'clib',
   why:'Q2 individual, Q1 private, Q4 defend-and-limit. Note that border enforcement appears here too — it carries no nationalist weight on its own.',
   fals:'A strong nationalist or traditionalist obligation overriding individual choice would pull it toward fusionist or national conservatism.'},

  {q:'There are no classes in a healthy nation — only Germans, or Italians, or Frenchmen, arranged in their proper function. Those who preach class war are agents of dissolution and will be dealt with as such.',
   unit:['nation'], own:['unspec'], fam:'fasc',
   why:'The decisive line is the explicit substitution of national unity for class, plus the threat against those who insist on class. That anti-Marxist plank is what separates fascism from every left ideology.',
   fals:'Almost none. This is textbook.'},

  {q:'Real people, the ones who work and pay and follow the rules, have been sold out by a corrupt establishment. We will take the country back for them.',
   unit:['people'], own:['unspec'], fam:'pop',
   why:'There is no answer to Q1 and nothing in Q2 beyond "the people." Populism is a thin ideology: it needs a host, and no host is visible here. Naming a fuller ideology would be over-classification.',
   fals:'This item exists to train withholding. Ask who counts as the people, who the elite are, and what happens to ownership — then classify.'},

  {q:'We accept the market. We reject that the market should decide who receives medicine, education, and shelter. Those are removed from the market entirely; everything else stays in it.',
   unit:['class'], own:['redist'], fam:'socdem',
   why:'Decommodifying three sectors while accepting markets elsewhere does not settle Q1 for production as a whole. Most likely social democracy — but market socialism remains live until you ask who owns the decommodified sectors.',
   fals:'If those sectors pass to worker or social ownership rather than state purchase, it moves toward market socialism.'},

  {q:'The old parties are finished. Only a movement that speaks for the forgotten majority, protects our borders and culture, and uses the full power of the state to break the grip of global finance and bureaucratic elites can restore the nation\u2019s strength. Private enterprise will be directed toward national goals.',
   unit:['people','nation'], own:['directed'], fam:'natpop',
   why:'Watch the two questions work together: Q2 narrows to the populist pair, Q1 narrows to the state-directing trio, and only national populism survives both. It lacks the fascist cluster — no rebirth myth, no leader-as-embodied-will, no paramilitary mobilisation, no cult of purifying violence.',
   fals:'Add an explicit national rebirth myth and a rejection of parliamentary legitimacy and it crosses into fascism. Stay inside electoral contestation and it does not.'},

  {q:'Structural barriers rooted in race, gender, and other identity categories continue to produce unequal outcomes even when formal legal equality exists. True justice requires that institutions actively identify and dismantle those barriers, and that resources and opportunities be redistributed until outcomes are equitable. Color-blindness and formal equality are not enough; they preserve the status quo.',
   unit:['race-e'], own:['redist','private'], fam:'idegal',
   why:'The unit is race — but the valence is egalitarian: hierarchy is named as unjust and slated for dismantling. Q1 goes largely untouched, which is what separates this from Marxism; the rejection of formal equality as sufficient is what separates it from classical liberalism.',
   fals:'If the analysis recentred on ownership of the means of production as the fundamental antagonism, it would move into Marxist territory. Whether this descends from the critical-theory lineage or is an independent liberal-egalitarian development is genuinely disputed.'}
];

const UNIT_DRILL = [
  {q:'The history of all hitherto existing society is the history of class struggles.', a:'Class', w:'Marxist family.'},
  {q:'A people that has forgotten its blood and soil has already begun to die.', a:'Race / blood', w:'Hierarchical valence — the Nazi variant of fascism.'},
  {q:'The nation, humiliated and betrayed, will be reborn through discipline and will.', a:'Nation', w:'Fascism. The rebirth language is decisive.'},
  {q:'Each person is the best judge of their own interest, and the state exists to protect that judgment.', a:'Individual', w:'Classical liberalism.'},
  {q:'The workers of the world have no country.', a:'Class', w:'Class placed explicitly above nation — Marxist internationalism.'}
];

const SOC_DRILL = [
  {q:'We will raise the top marginal rate to 62% and fund universal childcare and free tertiary education. Firms remain private.', a:'Social democracy', w:'Ownership untouched. Transfers are not socialism.'},
  {q:'Federated worker councils will run the mills. We recognize no parliament and no state.', a:'Anarcho-syndicalism', w:'Worker ownership plus rejection of the state.'},
  {q:'The party, as the conscious vanguard, will hold power on behalf of the working class through the transitional period.', a:'Marxism–Leninism', w:'Vanguard language is the giveaway.'},
  {q:'We will win a legislative majority and transfer the utilities, rail, and major banks into public and cooperative ownership.', a:'Democratic socialism', w:'Real ownership transfer, electoral route.'},
  {q:'We will deregulate labor markets and cut corporate tax to attract investment that lifts wages.', a:'Not socialist', w:'Supply-side liberalism.'}
];
const SOC_OPTS = ['Marxism–Leninism','Democratic socialism','Social democracy','Anarcho-syndicalism','Not socialist'];

const FASC_DRILL = [
  {q:'Censorship of the press', a:'auth', w:'Every dictatorship censors. Near-zero diagnostic weight.'},
  {q:'National youth movement with uniforms and mandatory membership', a:'fasc', w:'Mass mobilisation — fascism demands participation, not just obedience.'},
  {q:'Torture of political prisoners', a:'auth', w:'Method, not content. Found across every ideology that has held power.'},
  {q:'Doctrine that the current generation is degenerate and must be purified through struggle', a:'fasc', w:'Palingenesis plus the cult of purifying struggle. This is the ideological core.'},
  {q:'Ban on opposition parties', a:'auth', w:'Universal in single-party states of every stripe.'},
  {q:'Compulsory state-run bodies replacing independent unions, while employers still own the firms', a:'fasc', w:'Corporatism — the fascist answer to Q1.'},
  {q:'Leader who says parliament cannot represent the people because he already is the people\u2019s will', a:'fasc', w:'The leader principle. Not merely a dictator — a claim about representation itself.'}
];

const ERR_DRILL = [
  {q:'Sweden is a socialist country.', w:'Sweden is a social democracy — private ownership plus a high-tax welfare state. The claim never engages Q1.'},
  {q:'Antifa is just as fascist as the fascists.', w:'Category error. Fascism is a content — rebirth myth, nation-as-organism, leader principle, anti-Marxism — not a level of militancy or illiberalism.'},
  {q:'Fascism is when the government does a lot of stuff.', w:'That is statism at most, and probably just governance. Q1 and Q2 are never engaged.'},
  {q:'The USSR and Nazi Germany were basically the same ideology.', w:'Classification by method. They give opposite answers on Q1 (state ownership vs directed private ownership) and Q2 (class vs race). Comparable in repression, opposite in content.'},
  {q:'Anyone who wants strong borders is a fascist.', w:'Nationalism is not fascism, and border control exists in every state including socialist ones. No rebirth myth, no leader principle, no mobilisation — no fascism.'},
  {q:'Universal healthcare is Marxism.', w:'Marxism is an analysis of capitalism and class, not a list of public services. Q1 is untouched by a healthcare programme.'}
];

/* ============================ STATE ============================ */

const S = {tab:'det', i:0, unit:null, own:null, fam:null, revealed:false, intro:true,
           stats:{det:{n:0,label:0,frame:0}, unit:{n:0,ok:0}, soc:{n:0,ok:0}, fasc:{n:0,ok:0}, err:{n:0,seen:0}},
           picked:null, sub:{i:0}};

function saveStats(){
  try{ localStorage.setItem('fieldkey:stats', JSON.stringify(S.stats)); }catch(e){}
}
function loadStats(){
  try{
    const raw = localStorage.getItem('fieldkey:stats');
    if(raw) S.stats = Object.assign(S.stats, JSON.parse(raw));
  }catch(e){}
  try{
    if(localStorage.getItem('fieldkey:intro') === 'done') S.intro = false;
  }catch(e){}
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage = () => document.getElementById('stage');

/* ============================ DETERMINATION ============================ */

function candidates(){
  let live = FAMILIES.map(f=>f.id);
  if(S.unit){ const u = UNITS.find(x=>x.id===S.unit); live = live.filter(id=>u.keeps.includes(id)); }
  if(S.own){ const o = OWNERSHIP.find(x=>x.id===S.own); if(o.keeps) live = live.filter(id=>o.keeps.includes(id)); }
  return live;
}

function renderDet(){
  if(S.i >= SPECIMENS.length) return renderDetDone();
  const sp = SPECIMENS[S.i];
  const live = candidates();
  const st = S.stats.det;

  stage().innerHTML = `
    ${S.intro ? `<div class="intro">
      <h2>How this works</h2>
      <p>You are running each passage through a key, the way you would identify a plant. Work the characters first, name the specimen last.</p>
      <ol>
        <li>Read the passage.</li>
        <li><b>Step 1</b> — tap the primary unit of analysis. Steps 2 and 3 are greyed out until you do; they unlock in order.</li>
        <li><b>Step 2</b> — tap who owns the means of production. Pick <i>Not stated</i> when the passage genuinely doesn't say.</li>
        <li><b>Step 3</b> — now name the family, and record it.</li>
      </ol>
      <p>The strip between the passage and step 1 is a readout, not a control. It crosses off families your answers have ruled out. Nothing there is tappable.</p>
      <p>Your name and your route are scored separately. Right name from the wrong steps counts as a miss.</p>
      <div class="row" style="margin-top:4px"><button class="btn" id="introGo">Start</button></div>
    </div>` : ''}
    <div class="spec-head">
      <span class="spec-no">Specimen ${String(S.i+1).padStart(2,'0')} / ${SPECIMENS.length}</span>
      ${S.intro ? '<span class="spec-set">Full determination</span>' : '<button class="linkbtn" id="introOpen">How this works</button>'}
    </div>
    <blockquote class="passage">${esc(sp.q)}</blockquote>

    <div class="rail">
      <div class="rail-head"><span>Readout \u00b7 updates automatically \u00b7 nothing to tap</span><span class="rail-count">${live.length} of ${FAMILIES.length} left</span></div>
      <ul class="cands">${FAMILIES.map(f=>`<li class="cand ${live.includes(f.id)?'':'out'}">${esc(f.n)}</li>`).join('')}</ul>
    </div>

    <div class="step ${S.revealed?'locked':''}">
      <div class="step-label"><span class="num">1</span><span class="code">Q2</span> Primary unit of analysis</div>
      <div class="opts" id="unitOpts">
        ${UNITS.map(u=>`<button class="opt" data-u="${u.id}" aria-pressed="${S.unit===u.id}">${esc(u.n)}<small>${esc(u.sub)}</small></button>`).join('')}
      </div>
    </div>

    <div class="step ${S.unit?'':'locked'} ${S.revealed?'locked':''}">
      <div class="step-label"><span class="num">2</span><span class="code">Q1</span> Ownership of the means of production${S.unit?'':'<span class="lockmsg">Answer step 1 to unlock</span>'}</div>
      <div class="opts" id="ownOpts">
        ${OWNERSHIP.map(o=>`<button class="opt" data-o="${o.id}" aria-pressed="${S.own===o.id}">${esc(o.n)}</button>`).join('')}
      </div>
    </div>

    <div class="step ${S.own?'':'locked'} ${S.revealed?'locked':''}">
      <div class="step-label"><span class="num">3</span><span class="code">ID</span> Name the family${S.own?'':'<span class="lockmsg">Answer step 2 to unlock</span>'}</div>
      <div class="opts" id="famOpts">
        ${FAMILIES.map(f=>`<button class="opt" data-f="${f.id}" aria-pressed="${S.fam===f.id}">${esc(f.n)}</button>`).join('')}
      </div>
    </div>

    ${S.revealed ? verdictHTML(sp) : `
      <div class="row">
        <button class="btn" id="reveal" ${S.fam?'':'disabled'}>Record determination</button>
        <button class="btn ghost" id="skip">Skip</button>
      </div>
      <p class="hint">Steps 1 and 2 before step 3. Reaching the right name by the wrong route counts as a miss.</p>`}

    <div class="score">
      <span>Determined <b>${st.n}</b></span>
      <span>Name correct <b>${st.label}</b></span>
      <span>Route correct <b>${st.frame}</b></span>
    </div>`;

  stage().querySelectorAll('#unitOpts .opt').forEach(b=>b.onclick=()=>{S.unit=b.dataset.u; S.own=null; S.fam=null; renderDet();});

  const ig = document.getElementById('introGo');
  if(ig) ig.onclick = ()=>{
    S.intro = false;
    try{ localStorage.setItem('fieldkey:intro','done'); }catch(e){}
    renderDet();
  };
  const io = document.getElementById('introOpen');
  if(io) io.onclick = ()=>{ S.intro = true; renderDet(); };
  stage().querySelectorAll('#ownOpts .opt').forEach(b=>b.onclick=()=>{S.own=b.dataset.o; S.fam=null; renderDet();});
  stage().querySelectorAll('#famOpts .opt').forEach(b=>b.onclick=()=>{S.fam=b.dataset.f; renderDet();});

  const rv = document.getElementById('reveal');
  if(rv) rv.onclick = ()=>{
    const okU = sp.unit.includes(S.unit);
    const okO = sp.own.includes(S.own);
    const okF = S.fam === sp.fam;
    st.n++; if(okF) st.label++; if(okU && okO) st.frame++;
    S.revealed = true; saveStats(); renderDet();
  };
  const sk = document.getElementById('skip');
  if(sk) sk.onclick = nextSpec;
  const nx = document.getElementById('next');
  if(nx) nx.onclick = nextSpec;
}

function verdictHTML(sp){
  const okU = sp.unit.includes(S.unit);
  const okO = sp.own.includes(S.own);
  const okF = S.fam === sp.fam;
  const famName = FAMILIES.find(f=>f.id===sp.fam).n;
  const unitName = u => { const x=UNITS.find(y=>y.id===u); return x.n + (x.id.startsWith('race')? ' ('+x.sub+')' : ''); };
  const ownName = o => OWNERSHIP.find(y=>y.id===o).n;

  return `<div class="verdict">
    <h3>${esc(famName)}</h3>
    <div class="marks">
      <span class="mark ${okF?'ok':'no'}">Name ${okF?'correct':'missed'}</span>
      <span class="mark ${okU?'ok':'no'}">Q2 ${okU?'correct':'\u2192 '+esc(sp.unit.map(unitName).join(' or '))}</span>
      <span class="mark ${okO?'ok':'no'}">Q1 ${okO?'correct':'\u2192 '+esc(sp.own.map(ownName).join(' or '))}</span>
    </div>
    ${(okF && !(okU&&okO)) ? `<div class="warn"><strong>Right name, wrong route.</strong> Scored as a miss. A label you cannot derive from the key characters will not survive an unfamiliar passage.</div>` : ''}
    <div class="vblock"><div class="vlab">Why</div><p>${esc(sp.why)}</p></div>
    <div class="vblock"><div class="vlab">What would falsify this reading</div><p>${esc(sp.fals)}</p></div>
    <div class="row"><button class="btn" id="next">Next specimen</button></div>
  </div>`;
}

function nextSpec(){ S.i++; S.unit=S.own=S.fam=null; S.revealed=false; renderDet(); }

function renderDetDone(){
  const st = S.stats.det;
  stage().innerHTML = `<div class="done">
    <h2>Determination set complete</h2>
    <p style="color:var(--ink-soft);max-width:44ch;margin:0 auto 18px">Names correct: <b>${st.label}</b> · routes correct: <b>${st.frame}</b> · of <b>${st.n}</b> recorded.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Run the set again</button></div></div>`;
  document.getElementById('again').onclick=()=>{S.i=0;S.unit=S.own=S.fam=null;S.revealed=false;renderDet();};
}

/* ============================ QUICK SORTS ============================ */

function renderPick(cfg){
  const {key, items, opts, title, prompt, plain} = cfg;
  if(S.sub.i >= items.length) return renderSortDone(cfg);
  const it = items[S.sub.i];
  const st = S.stats[key];

  stage().innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Item ${String(S.sub.i+1).padStart(2,'0')} / ${items.length}</span>
      <span class="spec-set">${esc(title)}</span>
    </div>
    <blockquote class="passage ${plain?'plain':''}">${esc(it.q)}</blockquote>
    <div class="step ${S.picked!==null?'locked':''}">
      <div class="step-label"><span class="code">?</span> ${esc(prompt)}</div>
      <div class="opts" id="pickOpts">
        ${opts(it).map(o=>`<button class="opt" data-v="${esc(o)}" aria-pressed="${S.picked===o}">${esc(o)}</button>`).join('')}
      </div>
    </div>
    ${S.picked!==null ? `
      <div class="verdict">
        <div class="marks"><span class="mark ${S.picked===answerOf(it,cfg)?'ok':'no'}">${S.picked===answerOf(it,cfg)?'Correct':'Missed — '+esc(answerOf(it,cfg))}</span></div>
        <div class="vblock"><div class="vlab">Why</div><p>${esc(it.w)}</p></div>
        <div class="row"><button class="btn" id="next">Next item</button></div>
      </div>` : ''}
    <div class="score"><span>Answered <b>${st.n}</b></span><span>Correct <b>${st.ok}</b></span></div>`;

  stage().querySelectorAll('#pickOpts .opt').forEach(b=>b.onclick=()=>{
    S.picked = b.dataset.v;
    st.n++; if(S.picked===answerOf(it,cfg)) st.ok++;
    saveStats(); renderPick(cfg);
  });
  const nx=document.getElementById('next');
  if(nx) nx.onclick=()=>{S.sub.i++; S.picked=null; renderPick(cfg);};
}

function answerOf(it,cfg){ return cfg.answer ? cfg.answer(it) : it.a; }

function renderSortDone(cfg){
  const st = S.stats[cfg.key];
  stage().innerHTML = `<div class="done"><h2>Set complete</h2>
    <p style="color:var(--ink-soft);margin:0 0 18px"><b>${st.ok}</b> correct of <b>${st.n}</b> answered.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Run again</button></div></div>`;
  document.getElementById('again').onclick=()=>{S.sub.i=0;S.picked=null;renderPick(cfg);};
}

/* ============================ FAULTY CLAIMS ============================ */

function renderErr(){
  if(S.sub.i >= ERR_DRILL.length){
    stage().innerHTML = `<div class="done"><h2>Set complete</h2>
      <p style="color:var(--ink-soft);margin:0 0 18px">All six faults reviewed.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Run again</button></div></div>`;
    document.getElementById('again').onclick=()=>{S.sub.i=0;S.picked=null;renderErr();};
    return;
  }
  const it = ERR_DRILL[S.sub.i];
  stage().innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Claim ${String(S.sub.i+1).padStart(2,'0')} / ${ERR_DRILL.length}</span>
      <span class="spec-set">Faulty claims</span>
    </div>
    <blockquote class="passage">${esc(it.q)}</blockquote>
    <p class="hint" style="margin-bottom:14px">State the fault out loud or in writing before revealing. Name which diagnostic question the claim fails to engage.</p>
    ${S.picked ? `<div class="verdict"><div class="vblock"><div class="vlab">The fault</div><p>${esc(it.w)}</p></div>
      <div class="row"><button class="btn" id="next">Next claim</button></div></div>`
    : `<div class="row"><button class="btn" id="show">Show the fault</button></div>`}`;
  const sh=document.getElementById('show');
  if(sh) sh.onclick=()=>{S.picked='x'; S.stats.err.seen++; saveStats(); renderErr();};
  const nx=document.getElementById('next');
  if(nx) nx.onclick=()=>{S.sub.i++; S.picked=null; renderErr();};
}

/* ============================ FIELD GUIDE ============================ */

function renderGuide(){
  stage().innerHTML = `
    <div class="spec-head"><span class="spec-no">Reference</span><span class="spec-set">Key characters &amp; taxa</span></div>

    <details class="fg" open><summary>The five key characters</summary><div class="fg-body">
      <table class="k">
        <tr><th>Q1</th><td><b>Who owns the means of production?</b><br>private / state / worker-collective / private-but-state-directed<br><span class="tell">Separates economic left from right, and socialism from fascism.</span></td></tr>
        <tr><th>Q2</th><td><b>What is the primary unit of analysis?</b><br>class / nation / race or identity / individual / tradition &amp; faith / people vs elite<br><span class="tell">Fastest single discriminator — but see the valence trap.</span></td></tr>
        <tr><th>Q3</th><td><b>What is the engine of history?</b><br>material conflict / national decline &amp; rebirth / racial struggle / expanding liberty / divine order / people vs elite</td></tr>
        <tr><th>Q4</th><td><b>Attitude to liberal democracy?</b><br>fulfil &amp; expand / transcend / abolish / defend or restore<br><span class="tell">Separates democratic socialists from Leninists; conservatives from fascists.</span></td></tr>
        <tr><th>Q5</th><td><b>Desired end state?</b><br>classless stateless society / regenerated nation / racial hierarchy / pluralist competition / restored order / open-ended</td></tr>
      </table>
    </div></details>

    <details class="fg"><summary>The Q2 valence trap</summary><div class="fg-body">
      <p>Q2 asks <i>which</i> unit. For race and identity you must also ask <i>in which direction</i>, because the same noun points to opposite families.</p>
      <table class="k">
        <tr><th>Valence</th><th>The claim</th><th>Family</th></tr>
        <tr><td>Hierarchical</td><td>The group has an inherent nature and a rightful rank. Hierarchy is natural and must be preserved.</td><td>Nazism, racialist fascism</td></tr>
        <tr><td>Egalitarian</td><td>The group is a category of disadvantage produced by institutions. Hierarchy is unjust and must be dismantled.</td><td>Identity-egalitarianism</td></tr>
      </table>
      <div class="warn"><strong>Both organise politics around race. They are opposites.</strong> Stopping at "this text sorts people by racial category" and jumping to fascism is the single most likely error this key produces — and it fails in both directions, since the mirror mistake is treating a racial-hierarchy claim as merely conservative.</div>
    </div></details>

    <details class="fg"><summary>The socialist family</summary><div class="fg-body">
      <p><b>Socialism</b> is social ownership or democratic control of the means of production. Ownership — not taxation, not regulation. If productive assets stay private and the state only taxes and redistributes, that is a welfare state.</p>
      <h4>Marxism</h4><p>An analytical framework more than a programme: historical materialism, class conflict, surplus value, capitalism generating its own crises. End state is classless, stateless, moneyless.<span class="tell">Tell: modes of production, class, material conditions, contradictions.</span></p>
      <h4>Marxism–Leninism</h4><p>Marxism plus a theory of seizing and holding power: vanguard party, democratic centralism, dictatorship of the proletariat, one-party state.<span class="tell">Tell: the party, not the class, is the acting subject of history.</span></p>
      <h4>Democratic socialism</h4><p>Genuine social ownership of major productive assets, via elections and inside democratic institutions. Rejects vanguardism.</p>
      <h4>Social democracy</h4><p>Not socialism under the ownership definition. Accepts private ownership and markets; constrains capitalism through welfare, labour rights, progressive taxation.<span class="tell">Tell: redistribution, floors and rights — never who owns the factory.</span></p>
      <h4>Anarchism / libertarian socialism</h4><p>Socialist economics plus the state as enemy. Ownership to councils, communes, unions.<span class="tell">Tell: anti-capitalist and anti-statist at once.</span></p>
      <h4>Market socialism</h4><p>Worker- or socially-owned firms competing in real markets at real prices.</p>
      <div class="warn"><strong>Common error.</strong> "Government does a thing" is not socialism. Roads, central banks, militaries and food inspection exist in every capitalist state. Always ask Q1: did ownership of productive assets change hands?</div>
    </div></details>

    <details class="fg"><summary>Fascism</summary><div class="fg-body">
      <p>A mass, anti-liberal, anti-Marxist movement organised around a myth of national decline and rebirth, pursuing regeneration through unity, discipline and often violence, led by a leader who embodies the popular will, in which the individual exists to serve the organic nation.</p>
      <p><b>Look for the cluster, not one item:</b></p>
      <ul>
        <li><b>Palingenetic ultranationalism</b> — the nation is decadent and will be reborn. The ideological core.</li>
        <li><b>Mythic past</b> — a lost golden age, usually historically fictional.</li>
        <li><b>Nation as organism</b> — a body with one will; the individual is a cell.</li>
        <li><b>Enemies both weak and strong</b> — contemptible yet about to overwhelm you.</li>
        <li><b>Cult of action and violence</b> — struggle purifies; deliberation is weakness.</li>
        <li><b>Leader principle</b> — the leader intuits the true will; parliaments are theatre.</li>
        <li><b>Mass mobilisation</b> — uniforms, rallies, paramilitaries, youth wings. This is what separates fascism from ordinary dictatorship.</li>
        <li><b>Anti-liberal <i>and</i> anti-Marxist</b> — class struggle denounced as foreign and divisive, replaced by national unity. Critical.</li>
        <li><b>Corporatism</b> — private ownership retained under state-directed bodies; independent unions abolished.</li>
        <li><b>Militarism</b> — expansion as proof of vitality.</li>
      </ul>
      <h4>Against Nazism</h4><p>Nazism is the variant where biological race, not the nation-state, is the primary unit, with antisemitism as cosmology and extermination as policy. All Nazism is fascist; not all fascism is Nazi.</p>
      <h4>Against ordinary authoritarianism</h4><p>A junta wanting power and quiet is authoritarian. Fascism demands active participation. Authoritarianism demands passivity.</p>
      <h4>Against reactionary conservatism</h4><p>The reactionary wants to restore throne, altar and hierarchy. The fascist wants to create something new through national rebirth, and will smash traditional elites to do it. Fascism is revolutionary in method however traditionalist its aesthetics.</p>
      <h4>On "the Nazis were socialists"</h4><p>Resolve with Q1 and Q2, not the party name. <b>Q1:</b> ownership stayed private — the regime privatised major holdings, banned independent unions, destroyed the workers' parties and directed private industry through contracts and controls. That is state-directed capitalism. <b>Q2:</b> the primary unit was race, constructed in explicit opposition to class; Marxism was the declared mortal enemy. Party names are marketing.</p>
    </div></details>

    <details class="fg"><summary>Look-alikes and false friends</summary><div class="fg-body">
      <table class="k">
        <tr><th>Term</th><th>What it actually is</th></tr>
        <tr><td>Authoritarianism</td><td>A method of rule. Compatible with almost any ideology.</td></tr>
        <tr><td>Totalitarianism</td><td>Ambition to penetrate all of life. A degree of control, not a content.</td></tr>
        <tr><td>Populism</td><td>Thin ideology: pure people vs corrupt elite. Attaches to hosts on left and right.</td></tr>
        <tr><td>Communism</td><td>(a) Marx's stateless end state; (b) the 20th-century party-states. Always specify which.</td></tr>
        <tr><td>Corporatism</td><td>Economy organised into state-recognised blocs of labour and capital. Not "rule by corporations."</td></tr>
        <tr><td>Nationalism</td><td>Prioritisation of the nation. Necessary but far from sufficient for fascism.</td></tr>
        <tr><td>Classical liberalism</td><td>Individual rights, limited state, rule of law, free markets. Not modern American "liberal."</td></tr>
        <tr><td>Progressivism</td><td>Directed reform toward equality and inclusion through institutions. The mid-century institutional strand.</td></tr>
        <tr><td>Conservatism</td><td>Preference for inherited institutions and gradual change. Ranges from fusionism to traditionalism to national conservatism.</td></tr>
        <tr><td>Statism</td><td>A large, active state. A dial, not a doctrine.</td></tr>
        <tr><td>Technocracy</td><td>Rule by credentialed expertise rather than mandate.</td></tr>
      </table>
      <div class="warn"><strong>The horseshoe error.</strong> Leninism and fascism look alike in methods — one-party rule, leader cult, secret police, mobilised masses. Never classify by method. Methods travel; content does not.</div>
    </div></details>

    <details class="fg"><summary>Two contemporary formations</summary><div class="fg-body">
      <p>Neither is a classical ideology. Both are composites fusing a thin ideology onto a thicker host, and both are more often used as epithets than descriptions.</p>
      <h4>National populism</h4>
      <table class="k">
        <tr><th>Q1</th><td>Private, retained — but directed toward national ends</td></tr>
        <tr><th>Q2</th><td>The "real people" against a cosmopolitan elite</td></tr>
        <tr><th>Q3</th><td>The nation was sold out from above and outside; recover its strength</td></tr>
        <tr><th>Q4</th><td>Works inside elections; attacks courts, press and bureaucracy as unrepresentative without abolishing the vote</td></tr>
        <tr><th>Q5</th><td>A sovereign, culturally cohesive nation — restored, not transfigured</td></tr>
      </table>
      <p><b>Separates from fascism by four absences:</b> no palingenetic rebirth myth, no leader-as-embodied-will replacing elections, no paramilitary mobilisation, no cult of purifying violence. Where those appear, the classification changes.<span class="tell">Tell: sovereignty, borders, globalists, the establishment, industrial policy — pursued through ballots.</span></p>
      <h4>Identity-egalitarianism</h4>
      <table class="k">
        <tr><th>Q1</th><td>Markets and private ownership largely accepted; the demand is on distribution and institutional design</td></tr>
        <tr><th>Q2</th><td>Identity categories as structurally positioned groups — egalitarian valence</td></tr>
        <tr><th>Q3</th><td>Formally neutral institutions reproduce inherited disadvantage</td></tr>
        <tr><th>Q4</th><td>Fulfil and expand it — charges liberalism with failing its own promises</td></tr>
        <tr><th>Q5</th><td>Equitable outcomes across groups; open-ended</td></tr>
      </table>
      <p><b>Separates from Marxism by:</b> class and ownership are not the root analytic, so Q1 goes largely untouched. <b>From classical liberalism by:</b> rejecting formal equality as sufficient.<span class="tell">Tell: structural, systemic, disparate outcomes, equity distinct from equality, colour-blindness as insufficient.</span></p>
      <p><b>Genuinely contested:</b> whether this descends from the Marxist and critical-theory lineage or is an independent liberal-egalitarian development is disputed among scholars. The five questions classify it without settling that.</p>
    </div></details>

    <details class="fg"><summary>Honest caveats</summary><div class="fg-body">
      <ul>
        <li><b>Fascism's definition is contested.</b> Paxton emphasises process and stages; Griffin the rebirth myth; Eco a family-resemblance list. Some historians restrict the term largely to interwar Europe. Treat the markers as a family resemblance, not a checklist requiring every item.</li>
        <li><b>Whether social democracy counts as socialism</b> depends on defining socialism by ownership or by egalitarian outcome. This key uses ownership because it discriminates better; the other definition is widely used in ordinary speech.</li>
        <li><b>Classical vs modern "liberal."</b> In American usage the word often means something closer to social democracy. Check Q1–Q5, not the word.</li>
        <li><b>These terms are also weapons.</b> In live speech they are used to condemn rather than describe. Analytic and rhetorical use are different activities.</li>
        <li><b>Applying this to current parties is contested terrain.</b> Informed people land differently on the same evidence. The key tells you which questions to ask; it does not hand you verdicts on living cases.</li>
        <li><b>Non-Western, theocratic and technocratic systems</b> are lightly covered. The five questions still apply, but additional primary units — faith, civilisation, expertise — become relevant.</li>
      </ul>
    </div></details>`;
}

/* ============================ ROUTER ============================ */

const CFG = {
  unit:{key:'unit', items:UNIT_DRILL, title:'Primary unit', prompt:'Which unit of analysis is primary?',
        opts:()=>['Class','Nation','Race / blood','Individual','Tradition & faith','People vs elite']},
  soc:{key:'soc', items:SOC_DRILL, title:'Socialist family', prompt:'Which branch — if any?',
       opts:()=>SOC_OPTS},
  fasc:{key:'fasc', items:FASC_DRILL, title:'Marker sort', plain:true,
        prompt:'Specifically fascist, or merely authoritarian?',
        opts:()=>['Fascist marker','Merely authoritarian'],
        answer:it=>it.a==='fasc'?'Fascist marker':'Merely authoritarian'}
};

function route(){
  S.sub.i = 0; S.picked = null;
  if(S.tab==='det') return renderDet();
  if(S.tab==='err') return renderErr();
  if(S.tab==='guide') return renderGuide();
  return renderPick(CFG[S.tab]);
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
    t.setAttribute('aria-selected','true');
    S.tab = t.dataset.tab;
    if(S.tab==='det'){ S.i=0; S.unit=S.own=S.fam=null; S.revealed=false; }
    route();
  };
});

loadStats();
route();
</script>
</body>
</html>
