<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Key to Psychological Patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#d5d9d1; --sheet:#f3f2ed; --sheet-2:#e9e8e1;
  --ink:#14181d; --ink-soft:#4c545a; --rule:#aab0a6; --rule-fine:#c6cabf;
  --brass:#7a6636; --herb:#3a5c46; --iron:#8c3a2e;
  --shadow:0 1px 0 rgba(20,24,29,.10), 0 10px 24px -18px rgba(20,24,29,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--board);
  background-image:linear-gradient(rgba(20,24,29,.025) 1px,transparent 1px);
  background-size:100% 3px;
  color:var(--ink); font-family:'Spectral',Georgia,serif; font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px}

.mast{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.mast .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.mast h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:clamp(25px,5.8vw,37px);
  line-height:1.02;margin:0;letter-spacing:-.015em}
.mast p{margin:8px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:52ch}

.tabs{display:flex;flex-wrap:wrap;gap:3px;margin:14px 0 0}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 11px 7px;border:1px solid var(--rule);border-bottom:none;background:var(--sheet-2);
  color:var(--ink-soft);cursor:pointer;border-radius:3px 3px 0 0;position:relative;top:1px}
.tab:hover{background:var(--sheet);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--ink);font-weight:600;
  border-color:var(--ink);border-bottom:1px solid var(--sheet)}

.sheet{background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);
  padding:20px 18px 22px;border-radius:0 3px 3px 3px}

.ladder{display:flex;gap:0;margin:0 0 20px;border:1px solid var(--rule-fine);border-radius:2px;overflow:hidden}
.rung{flex:1;padding:7px 4px 6px;text-align:center;background:var(--sheet-2);
  border-right:1px solid var(--rule-fine);font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;line-height:1.3}
.rung:last-child{border-right:none}
.rung b{display:block;font-size:12px;color:var(--ink);font-weight:600}
.rung:hover{background:var(--sheet)}
.rung.now{background:var(--ink);color:var(--sheet)}
.rung.now b{color:var(--sheet)}
.rung.done b::after{content:' \2713';color:var(--herb)}
.rung.now.done b::after{color:#9fd0b0}

.crumb{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule-fine);padding-bottom:8px;margin-bottom:16px}
.crumb .where{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.crumb .of{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}

.lesson h2{font-family:'Zilla Slab',serif;font-size:clamp(21px,4.6vw,27px);margin:0 0 12px;letter-spacing:-.01em;line-height:1.12}
.lesson h3{font-family:'Zilla Slab',serif;font-size:17px;margin:18px 0 6px}
.lesson p{margin:0 0 12px}
.lesson ul{margin:0 0 12px;padding-left:19px}
.lesson li{margin-bottom:6px}
.lesson .lead{font-size:18px;color:var(--ink)}
.tell{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--brass);display:block;margin-top:5px}
.warn{border:1px solid rgba(140,58,46,.35);background:rgba(140,58,46,.07);border-radius:3px;padding:12px 14px;margin:14px 0}
.warn strong{color:var(--iron)}
.note{border:1px solid rgba(122,102,54,.3);background:rgba(122,102,54,.08);border-radius:3px;padding:12px 14px;margin:14px 0}
table.k{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
table.k th,table.k td{border:1px solid var(--rule-fine);padding:8px 9px;text-align:left;vertical-align:top}
table.k th{background:var(--sheet-2);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}

.dots{display:flex;gap:5px;margin:18px 0 0}
.dot{width:22px;height:3px;background:var(--rule);border-radius:2px}
.dot.on{background:var(--ink)}

.spec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--rule-fine);padding-bottom:8px;margin-bottom:16px}
.spec-no{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.spec-set{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}

blockquote.passage{margin:0 0 20px;padding:14px 16px;background:var(--sheet-2);border-radius:3px;
  font-size:18px;line-height:1.6;font-style:italic}
blockquote.passage.plain{font-style:normal;font-size:17px}
.step{margin:0 0 18px}
.step.locked{opacity:.55;pointer-events:none}
.step-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--brass);display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.step-label .code{background:var(--ink);color:var(--sheet);padding:2px 5px;border-radius:2px;font-weight:600;letter-spacing:.06em}
.step-label .num{width:19px;height:19px;flex:0 0 19px;border-radius:50%;background:var(--brass);color:var(--sheet);
  display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:10.5px;letter-spacing:0}
.step.locked .step-label .num{background:var(--rule)}
.lockmsg{margin-left:auto;font-style:normal;color:var(--ink-soft);letter-spacing:.06em;border:1px dashed var(--rule);
  padding:2px 7px;border-radius:2px;text-transform:none;font-size:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-family:'Zilla Slab',serif;font-size:14.5px;font-weight:500;padding:8px 12px;
  background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink);cursor:pointer;
  border-radius:2px;text-align:left;line-height:1.25}
.opt:hover{border-color:var(--ink);background:#fff}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.05em;
  opacity:.62;font-weight:400;margin-top:2px;text-transform:uppercase}

.intro{border:1px solid var(--ink);background:var(--sheet-2);padding:15px 15px 13px;margin:0 0 18px;border-radius:2px}
.intro h2{font-family:'Zilla Slab',serif;font-size:17px;margin:0 0 9px}
.intro ol{margin:0 0 10px;padding-left:19px;font-size:15px}
.intro ol li{margin-bottom:5px}
.intro p{margin:0 0 10px;font-size:14.5px;color:var(--ink-soft)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--brass);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

.rail{border:1px solid var(--rule);background:var(--sheet-2);padding:12px 13px;margin:0 0 18px;
  border-radius:2px;cursor:default;user-select:none}
.rail-head{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rail-count{color:var(--brass);font-weight:600}
.cands{display:flex;flex-wrap:wrap;gap:5px 9px;margin:0;padding:0;list-style:none}
.cand{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);transition:color .28s ease,opacity .28s ease}
.cand.out{color:var(--ink-soft);opacity:.4;text-decoration:line-through;text-decoration-thickness:1px}

.verdict{border-top:2px solid var(--ink);margin-top:20px;padding-top:16px}
.verdict h3{font-family:'Zilla Slab',serif;font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.mark{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;border:1px solid}
.mark.ok{color:var(--herb);border-color:var(--herb);background:rgba(58,92,70,.07)}
.mark.no{color:var(--iron);border-color:var(--iron);background:rgba(140,58,46,.07)}
.vblock{margin:0 0 12px}
.vlab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brass);margin-bottom:3px}
.vblock p{margin:0;font-size:16px;line-height:1.55}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:11px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);
  cursor:pointer;border-radius:2px}
.btn:hover{background:#000}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sheet-2)}

.score{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  border-top:1px solid var(--rule-fine);margin-top:18px;padding-top:11px}
.score b{color:var(--ink);font-weight:600}
.hint{font-size:14px;color:var(--ink-soft);margin:10px 0 0}
.done{text-align:center;padding:22px 6px}
.done h2{font-family:'Zilla Slab',serif;font-size:24px;margin:0 0 8px}
.done p{color:var(--ink-soft);max-width:46ch;margin:0 auto 8px;font-size:15.5px}

details.fg{border-bottom:1px solid var(--rule-fine)}
details.fg:last-of-type{border-bottom:none}
details.fg summary{cursor:pointer;padding:13px 2px;font-family:'Zilla Slab',serif;font-weight:600;
  font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fg summary::-webkit-details-marker{display:none}
details.fg summary::after{content:'+';font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:16px}
details.fg[open] summary::after{content:'\2212'}
.fg-body{padding:0 2px 16px;font-size:15.5px}
.fg-body p{margin:0 0 10px}
.fg-body ul{margin:0 0 10px;padding-left:18px}
.fg-body li{margin-bottom:5px}
.fg-body h4{font-family:'Zilla Slab',serif;font-size:15.5px;margin:16px 0 5px}

:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .wrap{padding:16px 12px 80px}
  .sheet{padding:16px 13px 18px}
  blockquote.passage{font-size:16.5px;padding-left:13px}
  .opt{font-size:14px;padding:8px 10px}
  .rung{font-size:8.5px;padding:6px 2px}
  .rung b{font-size:11px}
  table.k{font-size:13.5px}
  table.k th,table.k td{padding:6px 7px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <p class="eyebrow">Diagnostic instrument · Rev. 1</p>
    <h1>Field Key to Psychological Patterns</h1>
    <p>Run each scenario through the diagnostic questions before naming it. A correct label reached by the wrong route is scored as a miss.</p>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="det" aria-selected="true">Determination</button>
    <button class="tab" role="tab" data-tab="u1" aria-selected="false">Pattern or moment</button>
    <button class="tab" role="tab" data-tab="u2" aria-selected="false">Which distortion</button>
    <button class="tab" role="tab" data-tab="u3" aria-selected="false">Spectrum</button>
    <button class="tab" role="tab" data-tab="u4" aria-selected="false">Which pattern</button>
    <button class="tab" role="tab" data-tab="u5" aria-selected="false">Name the tactic</button>
    <button class="tab" role="tab" data-tab="err" aria-selected="false">Faulty claims</button>
    <button class="tab" role="tab" data-tab="guide" aria-selected="false">Field guide</button>
  </div>

  <main class="sheet" id="stage"></main>
</div>

<script>
/* ===================== SHARED DATA ===================== */

const DOMAINS = [
  { id:'reasoning', n:'A mind justifying itself',  sub:'reasoning in the moment',
    outcomes:['dissonance','confbias','motivated','sunkcost','revision'] },
  { id:'tactic',    n:'A move in an interaction',  sub:'a specific tactic',
    outcomes:['gaslight','darvo','lovebomb','projection','notactic'] },
  { id:'pattern',   n:'A stable way someone is',   sub:'an enduring pattern',
    outcomes:['narc_grand','narc_vuln','bpd','hpd','aspd','traits'] }
];

const OUTCOMES = [
  {id:'dissonance', n:'Cognitive dissonance reduction', domain:'reasoning'},
  {id:'confbias',   n:'Confirmation bias',               domain:'reasoning'},
  {id:'motivated',  n:'Motivated reasoning',              domain:'reasoning'},
  {id:'sunkcost',   n:'Sunk cost / escalation of commitment', domain:'reasoning'},
  {id:'revision',   n:'Genuine belief revision (not a bias)', domain:'reasoning'},

  {id:'gaslight',   n:'Gaslighting',                      domain:'tactic'},
  {id:'darvo',      n:'DARVO',                            domain:'tactic'},
  {id:'lovebomb',   n:'Love-bombing → devaluation',   domain:'tactic'},
  {id:'projection', n:'Projection',                        domain:'tactic'},
  {id:'notactic',   n:'Not a tactic',                      domain:'tactic'},

  {id:'narc_grand', n:'Grandiose narcissistic pattern',   domain:'pattern'},
  {id:'narc_vuln',  n:'Vulnerable narcissistic pattern',  domain:'pattern'},
  {id:'bpd',        n:'Borderline pattern',                domain:'pattern'},
  {id:'hpd',        n:'Histrionic pattern',                domain:'pattern'},
  {id:'aspd',       n:'Antisocial pattern / psychopathy',  domain:'pattern'},
  {id:'traits',     n:'Traits only — not a disorder',  domain:'pattern'}
];

function outcomeName(id){ return OUTCOMES.find(o=>o.id===id).n; }

const SUBQ = {
  reasoning: [
    { code:'R1', label:'Timing of the conclusion', options:[
        {id:'before',   n:'Conclusion fixed before the reasoning began',            keeps:['motivated']},
        {id:'after',    n:'Belief or action came first; discomfort followed',       keeps:['dissonance','confbias','sunkcost']},
        {id:'evidence', n:'Reasoning is honestly responding to new evidence',       keeps:['revision']}
    ]},
    { code:'R2', label:'What gives, to relieve it', options:[
        {id:'addstory', n:'A justification is added; belief and behavior stay the same', keeps:['dissonance']},
        {id:'scrutiny', n:'New evidence gets scrutinized harder than confirming evidence', keeps:['confbias']},
        {id:'backward', n:'Further commitment is justified by what’s already been spent', keeps:['sunkcost']},
        {id:'updates',  n:'The belief itself updates, without defensiveness',       keeps:['revision']},
        {id:'fixed',    n:'The conclusion was never really in doubt',               keeps:['motivated']}
    ]}
  ],
  tactic: [
    { code:'T1', label:'What the move is doing', options:[
        {id:'denyreality',      n:'Denying the other person’s memory or perception, repeatedly', keeps:['gaslight']},
        {id:'denyattackreverse',n:'Deny the act, attack the accuser, reverse victim and offender',    keeps:['darvo']},
        {id:'idealizewithdraw', n:'Fast idealization now, conditional withdrawal later',              keeps:['lovebomb']},
        {id:'ownfeeling',       n:'Placing an unacceptable feeling of their own onto the other person', keeps:['projection']},
        {id:'singlemoment',     n:'A single defensive reaction, no larger sequence',                  keeps:['notactic']}
    ]},
    { code:'T2', label:'How much evidence do you have', options:[
        {id:'pattern',     n:'Repeats, escalates, or has a clear before/after arc', keeps:['gaslight','darvo','lovebomb','projection']},
        {id:'oneinstance', n:'One instance only',                                   keeps:['notactic']}
    ]}
  ],
  pattern: [
    { code:'P1', label:'Core fear or need being protected', options:[
        {id:'shame_out',   n:'Shame or inadequacy, defended by outward grandiosity',            keeps:['narc_grand']},
        {id:'shame_in',    n:'Same shame, presenting as fragility or quiet resentment',         keeps:['narc_vuln']},
        {id:'abandonment', n:'Terror of abandonment',                                            keeps:['bpd']},
        {id:'attention',   n:'Need to be noticed — the center of attention',                keeps:['hpd']},
        {id:'norule',      n:'No particular fear — rules and others’ claims don’t weigh much', keeps:['aspd']},
        {id:'normal',      n:'None of these dominate — normal-range behavior under stress', keeps:['traits']}
    ]},
    { code:'P2', label:'Response when challenged or criticized', options:[
        {id:'rage',          n:'Rage or contempt toward the critic',                keeps:['narc_grand']},
        {id:'withdraw',      n:'Hurt withdrawal, covert resentment, self-pity',      keeps:['narc_vuln']},
        {id:'panic',         n:'Panic, frantic repair attempts, or sudden devaluation', keeps:['bpd']},
        {id:'dramatic',      n:'Escalated dramatics aimed at an audience',           keeps:['hpd']},
        {id:'flat',          n:'Flat, strategic, unbothered — no emotional escalation', keeps:['aspd']},
        {id:'proportionate', n:'A normal, proportionate reaction',                   keeps:['traits']}
    ]}
  ]
};

const U1_OPTS = ['A mind justifying itself','A move in an interaction','A stable way someone is','None of these — a proportionate reaction'];
const U1_DRILL = [
  {q:'"I know I said I’d never date someone who does that again, but he’s different" — said while listing three of the exact behaviors she swore off.',
   a:'A mind justifying itself', w:'Reasoning family. The contradiction is between her stated rule and her current choice — watch for this to resurface as dissonance reduction in Lesson 2.'},
  {q:'A coworker denies ever agreeing to the deadline, then says you’re the one who’s always disorganized — in the same conversation where the email trail says otherwise.',
   a:'A move in an interaction', w:'Tactics family: deny + attack. Watch for the reversal that would confirm DARVO in Lesson 5.'},
  {q:'Ten years, every job, every friendship: he is the misunderstood genius, and everyone else eventually turns out to be an idiot or an enemy.',
   a:'A stable way someone is', w:'Pattern family: consistent across a decade and multiple contexts.'},
  {q:'"I’ve put four years into this degree, I can’t switch majors now" — said about a major she dislikes every class of.',
   a:'A mind justifying itself', w:'Reasoning family, specifically sunk cost.'},
  {q:'She’s withdrawn and short-tempered this week. She just found out her father is sick.',
   a:'None of these — a proportionate reaction', w:'A proportionate reaction to a real external stressor. Not everything needs this course’s vocabulary — that’s the point of D2.'}
];

const U2_OPTS = ['Dissonance reduction','Confirmation bias','Motivated reasoning','Sunk cost / escalation','Genuine belief revision'];
const U2_DRILL = [
  {q:'"I already told everyone I was vegan, so I’m not going to make a big deal out of the fact that the sauce probably has fish stock in it."',
   a:'Dissonance reduction', w:'Behavior conflicts with stated identity; resolved by minimizing rather than changing behavior or belief.'},
  {q:'He reads three studies supporting his diet closely and enthusiastically, and dismisses the one contradicting study as "funded by industry" — without checking who funded the other three.',
   a:'Confirmation bias', w:'Textbook asymmetric scrutiny: confirming evidence sails through, disconfirming evidence gets a standard never applied evenly.'},
  {q:'She decided to promote her friend before the interviews even happened, and spent the interviews taking notes that supported that outcome.',
   a:'Motivated reasoning', w:'The conclusion preceded the evidence-gathering.'},
  {q:'"We’ve spent two years and forty thousand dollars on this renovation, we can’t stop now" — said after they can no longer afford to finish it properly.',
   a:'Sunk cost / escalation', w:'The stated reason points backward at money already spent, not forward at what remains worth doing.'},
  {q:'"I used to think the policy would work. Turnout data from the three cities that tried it changed my mind, even though I really wanted it to work."',
   a:'Genuine belief revision', w:'Updated by external data, stated as such, no defensive move present.'},
  {q:'A manager who prides himself on being data-driven quietly stops checking the metric that turned negative last quarter, while still citing the ones that are positive.',
   a:'Confirmation bias', w:'Selectively stops tracking the metric that contradicts the "data-driven" self-image while continuing to cite the ones that flatter it.'}
];

const U3_OPTS = ['Healthy confidence/self-esteem','Narcissistic traits (non-clinical)','Grandiose narcissistic pattern','Vulnerable narcissistic pattern','Insufficient evidence','Not narcissism at all'];
const U3_DRILL = [
  {q:'She’s proud of the promotion, thanks the people who helped her get it, and is visibly happy for a colleague who got promoted the same week.',
   a:'Healthy confidence/self-esteem', w:'Pride without diminishing others; genuine happiness at someone else’s success.'},
  {q:'He redirects every conversation back to his own achievements within about ninety seconds, regardless of topic, and has for as long as anyone’s known him.',
   a:'Narcissistic traits (non-clinical)', w:'Pervasive and cross-context (D2 satisfied), but the evidence covers only one criterion — admiration-seeking. Empathy, entitlement, and reaction-to-threat aren’t shown yet.'},
  {q:'Passed over for a role he wanted, he tells people privately that the company "isn’t ready for someone like him," and that the person who got it will fail within a year.',
   a:'Grandiose narcissistic pattern', w:'Narcissistic injury: preserving grandiosity by devaluing both the decision and the person who benefited.'},
  {q:'A new employee snaps at a reasonable correction in her first stressful week on the job, then apologizes the next day.',
   a:'Insufficient evidence', w:'First week, high stress, self-corrected with an apology — D2 fails on both counts: not pervasive, not unprovoked.'},
  {q:'He never raises his voice and never asks for anything — and has spent fifteen years quietly certain nobody has ever appreciated what he’s actually capable of, growing colder toward anyone who seems to be doing better than him.',
   a:'Vulnerable narcissistic pattern', w:'No overt grandiosity, but the same structure — unrecognized specialness — turned inward, over fifteen years.'},
  {q:'"That’s such a narcissistic thing to say" — about a friend who mentioned being proud of finishing a marathon.',
   a:'Not narcissism at all', w:'Pride in a personal accomplishment is not narcissism. The faulty-claim case.'}
];

const U4_OPTS = ['Narcissistic','Borderline','Histrionic','Antisocial/psychopathic','Not a disorder — a hard moment'];
const U4_DRILL = [
  {q:'Ghosted after two dates, someone spirals into "I always ruin everything, please just tell me what I did," texts eleven times in an hour, then sends one furious message calling the other person evil.',

/* ===================== SHARED UI HELPERS ===================== */

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage = () => document.getElementById('stage');

function storageSave(key, obj){
  try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){}
}
function storageLoad(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return Object.assign(fallback, JSON.parse(raw));
  }catch(e){}
  return fallback;
}
function introSeen(storageKey){
  try{ return localStorage.getItem(storageKey+':intro')==='done'; }catch(e){ return false; }
}

function pickAnswerOf(it, cfg){ return cfg.answer ? cfg.answer(it) : it.a; }

function mountPickDrill(hostEl, cfg, state, onAllDone){
  if(state.i >= cfg.items.length) return onAllDone();
  const it = cfg.items[state.i], st = state.stats;

  hostEl.innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Item ${String(state.i+1).padStart(2,'0')} / ${cfg.items.length}</span>
      <span class="spec-set">${esc(cfg.title)}</span>
    </div>
    <blockquote class="passage ${cfg.plain?'plain':''}">${esc(it.q)}</blockquote>
    <div class="step ${state.picked!==null?'locked':''}">
      <div class="step-label"><span class="code">?</span> ${esc(cfg.prompt)}</div>
      <div class="opts" id="pickOpts">
        ${cfg.opts.map(o=>`<button class="opt" data-v="${esc(o)}" aria-pressed="${state.picked===o}">${esc(o)}</button>`).join('')}
      </div>
    </div>
    ${state.picked!==null ? `
      <div class="verdict">
        <div class="marks"><span class="mark ${state.picked===pickAnswerOf(it,cfg)?'ok':'no'}">${state.picked===pickAnswerOf(it,cfg)?'Correct':'Missed — '+esc(pickAnswerOf(it,cfg))}</span></div>
        <div class="vblock"><div class="vlab">Why</div><p>${esc(it.w)}</p></div>
        <div class="row"><button class="btn" id="pickNext">${state.i===cfg.items.length-1?'Finish':'Next item'}</button></div>
      </div>` : ''}
    <div class="score"><span>Answered <b>${st.n}</b></span><span>Correct <b>${st.ok}</b></span></div>`;

  hostEl.querySelectorAll('#pickOpts .opt').forEach(b=>b.onclick=()=>{
    state.picked = b.dataset.v;
    st.n++; if(state.picked===pickAnswerOf(it,cfg)) st.ok++;
    if(cfg.storageKey) storageSave(cfg.storageKey, state.stats);
    mountPickDrill(hostEl, cfg, state, onAllDone);
  });
  const nx = hostEl.querySelector('#pickNext');
  if(nx) nx.onclick=()=>{ state.i++; state.picked=null; mountPickDrill(hostEl, cfg, state, onAllDone); };
}

function mountErrDrill(hostEl, items, state, storageKey, onAllDone){
  if(state.i >= items.length) return onAllDone();
  const it = items[state.i];

  hostEl.innerHTML = `
    <div class="spec-head">
      <span class="spec-no">Claim ${String(state.i+1).padStart(2,'0')} / ${items.length}</span>
      <span class="spec-set">Faulty claims</span>
    </div>
    <blockquote class="passage">${esc(it.q)}</blockquote>
    <p class="hint" style="margin-bottom:14px">State the fault out loud or in writing before revealing. Name which diagnostic question the claim fails to engage.</p>
    ${state.picked ? `<div class="verdict"><div class="vblock"><div class="vlab">The fault</div><p>${esc(it.w)}</p></div>
      <div class="row"><button class="btn" id="errNext">${state.i===items.length-1?'Finish':'Next claim'}</button></div></div>`
    : `<div class="row"><button class="btn" id="errShow">Show the fault</button></div>`}`;

  const sh = hostEl.querySelector('#errShow');
  if(sh) sh.onclick=()=>{ state.picked='x'; state.stats.seen++; storageSave(storageKey, state.stats); mountErrDrill(hostEl, items, state, storageKey, onAllDone); };
  const nx = hostEl.querySelector('#errNext');
  if(nx) nx.onclick=()=>{ state.i++; state.picked=null; mountErrDrill(hostEl, items, state, storageKey, onAllDone); };
}

function detCandidates(state){
  let live = OUTCOMES.map(o=>o.id);
  if(!state.domain) return live;
  const d = DOMAINS.find(x=>x.id===state.domain);
  live = live.filter(id=>d.outcomes.includes(id));
  SUBQ[state.domain].forEach(q=>{
    const ans = state.sub[q.code];
    if(!ans) return;
    const opt = q.options.find(o=>o.id===ans);
    if(opt) live = live.filter(id=>opt.keeps.includes(id));
  });
  return live;
}

function detReady(state){
  if(!state.domain) return false;
  return SUBQ[state.domain].every(q=>state.sub[q.code]);
}

function detStepsHTML(state){
  let html = `<div class="step ${state.revealed?'locked':''}">
    <div class="step-label"><span class="num">1</span><span class="code">D1</span> What kind of thing is this?</div>
    <div class="opts" id="domainOpts">${DOMAINS.map(d=>
      `<button class="opt" data-d="${d.id}" aria-pressed="${state.domain===d.id}">${esc(d.n)}<small>${esc(d.sub)}</small></button>`).join('')}</div>
  </div>`;

  if(state.domain){
    const qs = SUBQ[state.domain];
    qs.forEach((q,idx)=>{
      const unlocked = idx===0 ? true : !!state.sub[qs[idx-1].code];
      html += `<div class="step ${unlocked?'':'locked'} ${state.revealed?'locked':''}">
        <div class="step-label"><span class="num">${idx+2}</span><span class="code">${q.code}</span> ${esc(q.label)}${unlocked?'':'<span class="lockmsg">Answer the previous step to unlock</span>'}</div>
        <div class="opts" data-subq="${q.code}">${q.options.map(o=>
          `<button class="opt" data-v="${o.id}" aria-pressed="${state.sub[q.code]===o.id}">${esc(o.n)}</button>`).join('')}</div>
      </div>`;
    });
    const ready = detReady(state);
    html += `<div class="step ${ready?'':'locked'} ${state.revealed?'locked':''}">
      <div class="step-label"><span class="num">${qs.length+2}</span><span class="code">ID</span> Name it${ready?'':'<span class="lockmsg">Answer the previous step to unlock</span>'}</div>
      <div class="opts" id="outcomeOpts">${OUTCOMES.filter(o=>o.domain===state.domain).map(o=>
        `<button class="opt" data-o="${o.id}" aria-pressed="${state.outcome===o.id}">${esc(o.n)}</button>`).join('')}</div>
    </div>`;
  }
  return html;
}

function detVerdictHTML(sp, state){
  const okD = state.domain === sp.domain;
  const subOk = okD && SUBQ[sp.domain].every(q=>{
    const want = sp.sub[q.code];
    return want && want.includes(state.sub[q.code]);
  });
  const okO = state.outcome === sp.outcome;
  const name = outcomeName(sp.outcome);

  const wantLine = () => {
    if(okD && subOk) return '';
    if(!okD) return ' → ' + esc(DOMAINS.find(d=>d.id===sp.domain).n);
    const bad = SUBQ[sp.domain].find(q=> !(sp.sub[q.code]||[]).includes(state.sub[q.code]));
    if(!bad) return '';
    const opts = bad.options.filter(o=>(sp.sub[bad.code]||[]).includes(o.id)).map(o=>o.n);
    return ' → ' + esc(opts.join(' or '));
  };

  return `<div class="verdict">
    <h3>${esc(name)}</h3>
    <div class="marks">
      <span class="mark ${okO?'ok':'no'}">Name ${okO?'correct':'missed'}</span>
      <span class="mark ${okD&&subOk?'ok':'no'}">Route ${okD&&subOk?'correct':'missed'+wantLine()}</span>
    </div>
    ${(okO && !(okD&&subOk)) ? `<div class="warn"><strong>Right name, wrong route.</strong> Scored as a miss. A label you can’t derive from the diagnostic questions won’t survive an unfamiliar situation.</div>` : ''}
    <div class="vblock"><div class="vlab">Why</div><p>${esc(sp.why)}</p></div>
    <div class="vblock"><div class="vlab">What would falsify this reading</div><p>${esc(sp.fals)}</p></div>
    <div class="row"><button class="btn" id="detNext">Next specimen</button></div>
  </div>`;
}

function mountDetermination(hostEl, state, storageKey, onAllDone){
  if(state.i >= SPECIMENS.length) return onAllDone();
  const sp = SPECIMENS[state.i];
  const live = detCandidates(state);
  const st = state.stats;

  hostEl.innerHTML = `
    ${state.intro ? `<div class="intro">
      <h2>How this works</h2>
      <p>You are running each scenario through the diagnostic key, the way the political-ideology course runs a passage through Q1/Q2. Answer the domain first, then the two questions specific to it, and only then name it.</p>
      <ol>
        <li>Read the scenario.</li>
        <li><b>Step 1</b> — is this a moment of reasoning, a move in an interaction, or a stable pattern? The later steps unlock in order, and change depending on this answer.</li>
        <li><b>Steps 2–3</b> — the two questions specific to that domain.</li>
        <li><b>Step 4</b> — now name it, and record your determination.</li>
      </ol>
      <p>The strip between the scenario and step 1 is a readout, not a control. It crosses off outcomes your answers have ruled out. Nothing there is tappable.</p>
      <p>Your name and your route are scored separately. Right name from the wrong steps counts as a miss.</p>
      <div class="row" style="margin-top:4px"><button class="btn" id="introGo">Start</button></div>
    </div>` : ''}
    <div class="spec-head">
      <span class="spec-no">Specimen ${String(state.i+1).padStart(2,'0')} / ${SPECIMENS.length}</span>
      ${state.intro ? '<span class="spec-set">Full determination</span>' : '<button class="linkbtn" id="introOpen">How this works</button>'}
    </div>
    <blockquote class="passage">${esc(sp.q)}</blockquote>

    <div class="rail">
      <div class="rail-head"><span>Readout · updates automatically · nothing to tap</span><span class="rail-count">${live.length} of ${OUTCOMES.length} left</span></div>
      <ul class="cands">${OUTCOMES.map(o=>`<li class="cand ${live.includes(o.id)?'':'out'}">${esc(o.n)}</li>`).join('')}</ul>
    </div>

    ${detStepsHTML(state)}

    ${state.revealed ? detVerdictHTML(sp, state) : `
      <div class="row">
        <button class="btn" id="detRecord" ${state.outcome?'':'disabled'}>Record determination</button>
        <button class="btn ghost" id="detSkip">Skip</button>
      </div>
      <p class="hint">Domain, then the two follow-up questions, before naming it. Right name by the wrong route counts as a miss.</p>`}

    <div class="score">
      <span>Determined <b>${st.n}</b></span>
      <span>Name correct <b>${st.label}</b></span>
      <span>Route correct <b>${st.frame}</b></span>
    </div>`;

  hostEl.querySelectorAll('#domainOpts .opt').forEach(b=>b.onclick=()=>{
    state.domain = b.dataset.d; state.sub = {}; state.outcome = null;
    mountDetermination(hostEl, state, storageKey, onAllDone);
  });
  hostEl.querySelectorAll('[data-subq] .opt').forEach(b=>b.onclick=(e)=>{
    const code = e.currentTarget.parentElement.dataset.subq;
    state.sub[code] = b.dataset.v; state.outcome = null;
    mountDetermination(hostEl, state, storageKey, onAllDone);
  });
  const outcomeOpts = hostEl.querySelector('#outcomeOpts');
  if(outcomeOpts) outcomeOpts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    state.outcome = b.dataset.o;
    mountDetermination(hostEl, state, storageKey, onAllDone);
  });

  const ig = hostEl.querySelector('#introGo');
  if(ig) ig.onclick = ()=>{
    state.intro=false;
    try{ localStorage.setItem(storageKey+':intro','done'); }catch(e){}
    mountDetermination(hostEl, state, storageKey, onAllDone);
  };
  const io = hostEl.querySelector('#introOpen');
  if(io) io.onclick = ()=>{ state.intro=true; mountDetermination(hostEl, state, storageKey, onAllDone); };

  const rv = hostEl.querySelector('#detRecord');
  if(rv) rv.onclick = ()=>{
    const okD = state.domain === sp.domain;
    const subOk = okD && SUBQ[sp.domain].every(q=>(sp.sub[q.code]||[]).includes(state.sub[q.code]));
    const okO = state.outcome === sp.outcome;
    st.n++; if(okO) st.label++; if(okD && subOk) st.frame++;
    state.revealed = true; storageSave(storageKey, st);
    mountDetermination(hostEl, state, storageKey, onAllDone);
  };
  const sk = hostEl.querySelector('#detSkip');
  if(sk) sk.onclick = ()=>{ nextSpecimen(state); mountDetermination(hostEl, state, storageKey, onAllDone); };
  const nxBtn = hostEl.querySelector('#detNext');
  if(nxBtn) nxBtn.onclick = ()=>{ nextSpecimen(state); mountDetermination(hostEl, state, storageKey, onAllDone); };
}

function nextSpecimen(state){ state.i++; state.domain=null; state.sub={}; state.outcome=null; state.revealed=false; }

const PICK_CFG = {
  u1:{items:U1_DRILL, opts:U1_OPTS, title:'Pattern or moment', prompt:'What kind of thing is this (D1)?', storageKey:'psych-fieldkey:stats:u1'},
  u2:{items:U2_DRILL, opts:U2_OPTS, title:'Which distortion', prompt:'Which distortion — if any?', storageKey:'psych-fieldkey:stats:u2'},
  u3:{items:U3_DRILL, opts:U3_OPTS, title:'Where on the spectrum', prompt:'Where does this fall?', storageKey:'psych-fieldkey:stats:u3'},
  u4:{items:U4_DRILL, opts:U4_OPTS, title:'Which pattern', prompt:'Which pattern, if any, fits best?', storageKey:'psych-fieldkey:stats:u4'},
  u5:{items:U5_DRILL, opts:U5_OPTS, title:'Name the tactic', prompt:'Name the tactic, or say it’s not one', storageKey:'psych-fieldkey:stats:u5'}
};

/* ===================== STATE ===================== */

const S = {
  tab:'det',
  stats:{ det:{n:0,label:0,frame:0}, u1:{n:0,ok:0}, u2:{n:0,ok:0}, u3:{n:0,ok:0}, u4:{n:0,ok:0}, u5:{n:0,ok:0}, err:{seen:0} }
};
const drillStates = {};

function getDrillState(tab){
  if(drillStates[tab]) return drillStates[tab];
  let s;
  if(tab==='det') s = {i:0,domain:null,sub:{},outcome:null,revealed:false,intro:!introSeen('psych-fieldkey:stats:det'), stats:S.stats.det};
  else if(tab==='err') s = {i:0,picked:null,stats:S.stats.err};
  else s = {i:0,picked:null,stats:S.stats[tab]};
  drillStates[tab] = s;
  return s;
}

function loadAll(){
  for(const k of ['u1','u2','u3','u4','u5']) storageLoad('psych-fieldkey:stats:'+k, S.stats[k]);
  storageLoad('psych-fieldkey:stats:det', S.stats.det);
  storageLoad('psych-fieldkey:stats:err', S.stats.err);
}

/* ===================== ROUTER ===================== */

function route(){
  if(S.tab==='guide') return renderGuide();
  const state = getDrillState(S.tab);
  if(S.tab==='det') return mountDetermination(stage(), state, 'psych-fieldkey:stats:det', ()=>renderDone('det'));
  if(S.tab==='err') return mountErrDrill(stage(), ERR_DRILL, state, 'psych-fieldkey:stats:err', ()=>renderDone('err'));
  return mountPickDrill(stage(), PICK_CFG[S.tab], state, ()=>renderDone(S.tab));
}

function renderDone(tab){
  if(tab==='det'){
    const st=S.stats.det;
    stage().innerHTML = `<div class="done"><h2>Determination set complete</h2>
      <p style="color:var(--ink-soft);max-width:44ch;margin:0 auto 18px">Names correct: <b>${st.label}</b> · routes correct: <b>${st.frame}</b> · of <b>${st.n}</b> recorded.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Run the set again</button></div></div>`;
    document.getElementById('again').onclick=()=>{ delete drillStates.det; route(); };
    return;
  }
  if(tab==='err'){
    stage().innerHTML = `<div class="done"><h2>Set complete</h2>
      <p style="color:var(--ink-soft);margin:0 0 18px">All ${ERR_DRILL.length} faults reviewed.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Run again</button></div></div>`;
    document.getElementById('again').onclick=()=>{ delete drillStates.err; route(); };
    return;
  }
  const st=S.stats[tab];
  stage().innerHTML = `<div class="done"><h2>Set complete</h2>
    <p style="color:var(--ink-soft);margin:0 0 18px"><b>${st.ok}</b> correct of <b>${st.n}</b> answered.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Run again</button></div></div>`;
  document.getElementById('again').onclick=()=>{ delete drillStates[tab]; route(); };
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
    t.setAttribute('aria-selected','true');
    S.tab = t.dataset.tab;
    route();
  };
});

/* ===================== FIELD GUIDE ===================== */

function renderGuide(){
  stage().innerHTML = `
    <div class="spec-head"><span class="spec-no">Reference</span><span class="spec-set">Diagnostic questions &amp; taxonomy</span></div>

    <details class="fg" open><summary>The five diagnostic questions</summary><div class="fg-body">
      <table class="k">
        <tr><th>D1</th><td><b>What kind of thing is this?</b><br>a moment of reasoning / a move in an interaction / a stable way someone is<br><span class="tell">The fastest discriminator — decides which key you even need.</span></td></tr>
        <tr><th>D2</th><td><b>Pervasive and stable, or situational and reactive?</b><br><span class="tell">Separates a trait or disorder from an ordinary bad day.</span></td></tr>
        <tr><th>D3</th><td><b>What need, fear, or contradiction does it resolve?</b><br>reveals the function, not just the behaviour</td></tr>
        <tr><th>D4</th><td><b>What's the nearest look-alike — and what separates them?</b></td></tr>
        <tr><th>D5</th><td><b>What would falsify this read?</b><br>keeps the label falsifiable instead of sticky</td></tr>
      </table>
    </div></details>

    <details class="fg"><summary>Cognitive dissonance &amp; the self-justification family</summary><div class="fg-body">
      <p><b>Cognitive dissonance</b> is the discomfort of holding two contradictory cognitions, and the drive to resolve it. Resolution doesn't require honestly changing your mind — there are four moves: change the belief, change the behaviour, add a justifying cognition, or discredit the source.<span class="tell">Tell: it shows up after the behaviour, as a repair job.</span></p>
      <h4>Confirmation bias</h4><p>Asymmetric scrutiny — confirming evidence sails through, disconfirming evidence gets cross-examined.</p>
      <h4>Motivated reasoning</h4><p>The conclusion is fixed before the reasoning starts. Easiest to confuse with dissonance reduction — the difference is timing: dissonance reacts to discomfort after a behaviour, motivated reasoning starts with the destination already chosen.</p>
      <h4>Sunk cost / escalation of commitment</h4><p>Justifying further investment by appeal to what's already spent, not by what the future investment is worth.<span class="tell">Tell: the stated reason points backward, not forward.</span></p>
      <div class="warn"><strong>Changing your mind is not a bias.</strong> Genuine belief revision runs evidence → conclusion. A bias runs conclusion → evidence.</div>
    </div></details>

    <details class="fg"><summary>The narcissism spectrum</summary><div class="fg-body">
      <p>Confidence, self-esteem, and narcissism are three different things. The discriminator isn't confidence level — it's what happens to the person's regard for <i>other people</i> once that confidence is tested.</p>
      <h4>Grandiose narcissism</h4><p>Overt, entitled, dominance-seeking, reacts to criticism with contempt or rage (narcissistic injury).<span class="tell">Tell: the mask cracks outward.</span></p>
      <h4>Vulnerable narcissism</h4><p>Covert, hypersensitive, chronically feels wronged — same self-organising structure, turned inward.<span class="tell">Tell: the mask cracks inward, as withdrawal and quiet resentment.</span></p>
      <div class="note"><b>The two words that matter most: pervasive and impairing.</b> Most people show a couple of these traits sometimes. That is not the disorder.</div>
    </div></details>

    <details class="fg"><summary>Look-alikes and false friends</summary><div class="fg-body">
      <table class="k">
        <tr><th></th><th>Narcissistic</th><th>Borderline</th></tr>
        <tr><td>Core fear</td><td>Being unadmired</td><td>Being abandoned</td></tr>
        <tr><td>Others</td><td>Instrumental — a supply of admiration</td><td>Idealized, then devalued</td></tr>
        <tr><td>Under conflict</td><td>Contempt, cutting off</td><td>Panic, frantic repair, or sudden devaluation</td></tr>
      </table>
      <p><b>Histrionic</b> wants an audience, not specifically admiration for superiority — more expressive, less entitled, often suggestible. <b>Antisocial / psychopathy</b> centers on disregard for rules and others' rights, without requiring grandiosity at all; psychopathy adds a flatter, more total absence of empathy rather than narcissism's selective withholding.</p>
      <div class="warn"><strong>Unpleasantness is not a diagnosis.</strong> Diagnose the structure — self-other model, core fear, response to threat — never the severity of how much you dislike someone.</div>
      <p>Words that are not diagnoses: "toxic," "narc," "sociopath" (not a clinical term), "gaslighting" applied to any disagreement.</p>
    </div></details>

    <details class="fg"><summary>Manipulation tactics &amp; defense mechanisms</summary><div class="fg-body">
      <p>Defense mechanisms — denial, projection, rationalization, displacement, intellectualization — are universal. The question is always D2: occasional, or the person's only mode?</p>
      <h4>Gaslighting</h4><p>A pattern, over time, of denying someone's memory or perception to make them distrust their own judgment.<span class="tell">Tell: repetition + escalation + the functional effect of self-doubt.</span></p>
      <h4>DARVO</h4><p>Deny, Attack, Reverse Victim and Offender — a specific three-part sequence, not just defensiveness.</p>
      <h4>Love-bombing → devaluation</h4><p>Rapid idealization disproportionate to actual time known, followed by conditional withdrawal once dependency is secured.</p>
      <div class="warn"><strong>The discriminator is pattern + function, not a single uncomfortable moment.</strong> Most defensiveness is just defensiveness. Most disagreement is not gaslighting.</div>
    </div></details>

    <details class="fg"><summary>Honest caveats</summary><div class="fg-body">
      <ul>
        <li><b>This is not a diagnostic tool, and it does not make you one.</b> Real diagnosis needs a licensed clinician, a structured interview, and ruling out other explanations — medical conditions, substance use, an acute stressor, trauma responses that mimic personality pathology.</li>
        <li><b>Pervasiveness, early onset, and impairment are required</b> for any disorder label. A handful of matching traits is not a disorder — treat the marker lists as family resemblances, not a checklist.</li>
        <li><b>The categories are contested even among clinicians.</b> The DSM-5's own alternative model treats personality pathology as dimensional, not categorical. Comorbidity is common, and trained clinicians disagree on borderline cases.</li>
        <li><b>These words are also weapons.</b> "Narcissist," "gaslighting," "toxic," "sociopath" are used constantly online to condemn rather than describe.</li>
        <li><b>Diagnosing at a distance is unreliable.</b> Public figures, exes, coworkers you've never had a clinical conversation with — confidence should scale down with distance, not up.</li>
        <li><b>Watch your own motivated reasoning while using this key</b> — especially about people you already have strong feelings about.</li>
        <li><b>Cultural and contextual variation is real.</b> Don't let this key turn cultural difference into pathology.</li>
        <li><b>None of this replaces professional help</b> — for yourself, or for a relationship that matches the manipulation-tactics section.</li>
      </ul>
    </div></details>`;
}

loadAll();
route();
</script>
</body>
</html>
